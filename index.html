/* =========================================================
   PLAYER ACTIONS
========================================================= */
function computeAvailablePower(){ return applyGSTBoost(energyToPower(mystate.energyToday), mystate.gstBoostPercent); }
function totalDeployedMine(){ return Object.values(mystate.deployedPower).reduce((a,b)=>a+b,0); }
function remainingPower(){ return round2(computeAvailablePower() - totalDeployedMine()); }
function iAmEliminated(){ return !factionOwnsAny(profile.faction, world.ownership); }

async function deployPower(mainT, secT, splitPct){
  if (mystate.locked) return;
  const avail = remainingPower();
  let [mp, sp] = splitPct;
  // AUTHORITATIVE GUARD: with no secondary target there is nowhere for the
  // secondary share to go, so the main target must take 100%. Without this,
  // a split like [50,50] arriving alongside secT === null silently discarded
  // half the player's power — it was neither deployed nor left available,
  // because deployment also locks for the day. That's how "I deployed 100%
  // but still have power left, and the button is greyed out" happens.
  if (!secT){ mp = 100; sp = 0; }
  const mainPower = round2(avail * mp/100);
  // Give the secondary the exact remainder rather than an independently
  // rounded share. Rounding both halves separately can overshoot (16.67
  // split 50/50 rounds to 8.34 + 8.34 = 16.68), which left the player at
  // -0.01 available. Deriving the remainder makes main + secondary add up
  // to exactly what was available, every time.
  const secPower = secT ? round2(avail - mainPower) : 0;

  let updatedDoc = null;
  try{
    const { data,error }=await sbClient.rpc('rk_submit_deployment',{
      p_room:roomCode,p_main:mainT,p_secondary:secT,p_main_percent:mp,
      p_energy:mystate.energyToday,p_boost:mystate.gstBoostPercent
    });
    if (error) throw error;
    updatedDoc=data;
  } catch(e){
    console.error('secure deploy failed:', e);
    lastSyncError = { message: 'Your deployment was not accepted: ' + ((e&&e.message)||'Please retry.'), retry: () => { lastSyncError = null; deployPower(mainT, secT, splitPct); } };
    render();
    return;
  }
  if (updatedDoc) activityDoc = updatedDoc;

  mystate.deployedPower[mainT] = round2((mystate.deployedPower[mainT]||0) + mainPower);
  if (secT) mystate.deployedPower[secT] = round2((mystate.deployedPower[secT]||0) + secPower);
  mystate.locked = true;
  lastSyncError = null;
  uiScreen = 'home';
  render();
}
async function followRally(){
  if (mystate.locked) return;
  const r = activityDoc.rally[profile.faction];
  if (!r) return;
  mystate.followedRally = true;
  await deployPower(r.main, r.secondary, r.split);
}
/* =========================================================
   COMMANDER — nominate, elect, broadcast
   Term is one ROUND (7 days), not one day. A one-day term resets trust every
   morning: the commander pays no price for a bad call and nobody has a reason
   to remember them, which makes both the message board and any followership
   worthless. A week-long term lets a commander build a record.
   Selection is self-nomination + objective energy ranking (no voting) —
   voting between strangers with zero social graph is noise, and being drafted
   at random produces commanders who never wanted the job.
========================================================= */
function commanderEnergyThreshold(){
  // Must be in the top N% of your faction by recent energy to stand. Uses the
  // roster (everyone currently in this room) as the population.
  const mine = Object.values(roster || {}).filter(r => r.faction === profile.faction && typeof r.recentEnergy === 'number');
  if (!mine.length) return 0;
  const sorted = mine.map(r => r.recentEnergy).sort((a,b) => b - a);
  const idx = Math.max(0, Math.ceil(sorted.length * CONFIG.commanderTopPercent) - 1);
  return sorted[idx];
}
function isEligibleToNominate(){
  if (!world || !profile) return false;
  const c = (world.commanders || {})[profile.faction];
  if (c && c.playerId === LOCAL_PLAYER_ID) return false; // already commander
  // Term limit: can't serve more than N consecutive rounds, so the single
  // biggest runner in a faction can't hold the seat forever and freeze
  // everyone else out.
  const streak = (seasonProgress && seasonProgress.commanderStreak) || 0;
  if (streak >= CONFIG.commanderMaxConsecutiveRounds) return false;
  const myEnergy = (profile.recentEnergy || 0);
  return myEnergy >= commanderEnergyThreshold();
}
function myNomination(){
  const list = (world.commanderNominees || {})[profile.faction] || [];
  return list.find(n => n.playerId === LOCAL_PLAYER_ID) || null;
}
async function nominateSelf(){
  if (!isEligibleToNominate()) return;
  const {data,error}=await sbClient.rpc('rk_nominate',{p_room:roomCode});
  if (error){
    lastSyncError = { message: 'Your nomination did not sync. Please retry.', retry: () => { lastSyncError = null; nominateSelf(); } };
    render(); return;
  }
  if (data) world=data;
  lastSyncError = null;
  await electCommanderIfNeeded();
  render();
}
// Highest recent energy among those who actually put their hand up wins.
// Deterministic, so every client computes the same winner from the same data.
function pickCommanderFrom(nominees){
  if (!nominees || !nominees.length) return null;
  const sorted = [...nominees].sort((a,b) => (b.energy - a.energy) || a.playerId.localeCompare(b.playerId));
  return sorted[0];
}
// NOMINATION WINDOW.
// Elections used to resolve the instant the first person nominated, which
// made it "first to click wins" rather than "highest energy wins" — nobody
// else ever got the chance to stand. Nominations now stay open for the whole
// of Day 1 and the winner is only locked in from Day 2 onward.
function nominationsOpen(){ return world && world.currentDay <= CONFIG.commanderNominationDays; }
async function electCommanderIfNeeded(){
  if (!world || nominationsOpen() || world.rallyEnabled===false) return;
  const {data,error}=await sbClient.rpc('rk_elect_commanders',{p_room:roomCode});
  if (!error&&data) world=data;
  // Track our own consecutive-round streak locally, for the term limit.
  const mine = (world.commanders || {})[profile.faction];
  if (mine && mine.playerId === LOCAL_PLAYER_ID && seasonProgress && seasonProgress.lastCommanderRound !== world.round){
    seasonProgress.commanderStreak = ((seasonProgress.lastCommanderRound === world.round - 1) ? (seasonProgress.commanderStreak || 0) : 0) + 1;
    seasonProgress.lastCommanderRound = world.round;
    await safeSet(seasonProgressKey(), seasonProgress, false);
  }
}
function iAmCommander(){
  const c = world && (world.commanders || {})[profile.faction];
  return !!(c && c.playerId === LOCAL_PLAYER_ID);
}
async function publishCommanderMessage(text){
  if (!iAmCommander()) return;
  const msg = (text || '').slice(0, CONFIG.commanderMessageMaxChars);
  const {data,error}=await sbClient.rpc('rk_publish_message',{p_room:roomCode,p_text:msg});
  if (error){
    lastSyncError = { message: 'Your message did not sync. Please retry.', retry: () => { lastSyncError = null; publishCommanderMessage(msg); } };
    render(); return;
  }
  if (data) world=data;
  lastSyncError = null; commanderMsgInput = ''; render();
}
async function publishRally(main, sec, split){
  if (!iAmCommander()) return;
  const {data,error}=await sbClient.rpc('rk_publish_rally',{p_room:roomCode,p_main:main,p_secondary:sec,p_main_percent:split[0]});
  if (error){
    lastSyncError = { message: 'Your Rally failed to publish. Please retry.', retry: () => { lastSyncError = null; publishRally(main, sec, split); } };
    render();
    return;
  }
  lastSyncError = null;
  if (data) activityDoc=data;
  render();
}
// The energy slider's oninput event fires on every pixel of drag movement —
// potentially dozens of times per second. Writing to storage on every one of
// those was the actual cause of hitting the message rate limit. Now input
// only updates local state + re-renders (no network call) and debounces the
// real write; a slider "release" (onchange) always flushes immediately so
// nothing is lost if the tab closes right after.
let energySaveTimer = null;

  if (mystate.locked) return;
  mystate.energyToday = parseFloat(v);

  persistMyState();
  render();

  await safeSet(dayKey(world.runId, 'mystate', world.currentDay), mystate, false);

            ${world.phase==='fog' ? `<span class="chip-small">${tr('HIDDEN')}</span>` : statusPill(st)}
          </div>`;
        }).join('')}
        <div class="divider"></div>
        <div class="row-between" style="margin-bottom:12px;"><span class="muted">${tr('Status')}</span><span class="mono">${world.phase==='fog' ? tr('FOG — awaiting resolve') : tr('OPEN — awaiting resolve')}</span></div>
        <button class="btn btn-primary" onclick="closeModal(); goScreen('deploy'); prefillDeploy('${t}')" ${mystate.locked?'disabled':''}>
          ${mystate.locked ? tr('POWER ALREADY DEPLOYED') : tr('DEPLOY POWER HERE')}
        </button>
      ` : `<div class="empty-note">${tr('Not an active battle today.')}</div>`}
    </div>
  </div>`;
}

/* ---------- RUN ---------- */
function screenRun(){

    ${mystate.gstBoostPercent>0 ? `<div class="row-between"><span class="muted">${tr('GST Boost')}</span><span class="mono" style="color:var(--gold)">+${mystate.gstBoostPercent}%</span></div>` : ''}
    <div class="row-between" style="margin-top:6px;"><span><b>${tr('POWER EARNED')}</b></span><span class="big-num mono" style="font-size:22px;">⚡ ${fmt1(boosted)}</span></div>

    <div class="debug-grid">
      ${CONFIG.gstTiers.map(pct => `<div class="gst-tier ${mystate.gstBoostPercent===pct?'selected':''}" onclick="setGST(${pct})">${pct===0?tr('None'):'+'+pct+'%'}</div>`).join('')}

}

/* ---------- DEPLOY ---------- */
let deployState = { main: null, secondary: null, splitIdx: 1 };
function prefillDeploy(t){ deployState.main = t; render(); }
function screenDeploy(){
  const avail = remainingPower();
  if (mystate.locked){
    return `<div class="card" style="text-align:center;">
      <div class="card-title">${tr('DEPLOYMENT LOCKED')}</div>
      <div class="muted">${tr('Power cannot be withdrawn after deployment.')}</div><div class="divider"></div>
      ${Object.entries(mystate.deployedPower).map(([t,p]) => `<div class="row-between"><span>${territoryLabel(t)}</span><span class="mono">⚡ ${fmt1(p)}</span></div>`).join('')}
    </div>`;
  }
  if (!battlesDoc.activeBattles.length) return `<div class="card"><div class="empty-note">${tr('No active battles to deploy to today.')}</div></div>`;

  const eliminated = iAmEliminated();
  const battles = eliminated
    ? battlesDoc.activeBattles
    : battlesDoc.activeBattles.filter(t => getEligibleFactions(t, world.ownership).includes(profile.faction));
  if (!battles.length) return `<div class="card"><div class="empty-note">${tr('Your faction has no eligible battles today (no adjacent access).')}</div></div>`;

  const main = deployState.main && battles.includes(deployState.main) ? deployState.main : battles[0];
  if (eliminated){
    const mainPower = avail;
    return `
    <div class="elim-banner"><div class="et">${tr('⚔ LAST STAND COMEBACK')}</div>
      <div class="muted" style="margin-top:4px;">${tr('Your faction holds no territory right now. Choose one open battle to attack (one target only — all your power goes there).')}</div></div>
    <div class="card">
      <div class="card-title">${tr('CHOOSE YOUR TARGET')}</div>
      ${battles.map(t => `<div class="terr-select ${main===t?'selected':''}" onclick="setDeployMain('${t}')">
        <div><b class="display">${territoryLabel(t)}</b> ${ownerBadge(world.ownership[t])}</div><div class="muted">${vpValueOf(t, world.currentDay)} VP</div></div>`).join('')}
    </div>
    <div class="card">
      <div class="row-between"><span>${tr('Available')}</span><span class="mono">${fmt1(avail)}</span></div>
      <div class="row-between"><span>${territoryLabel(main)} ${tr('(all power)')}</span><span class="mono">⚡ ${fmt1(mainPower)}</span></div>
      <div class="divider"></div>
      <div class="muted" style="font-size:12px; margin-bottom:10px;">${tr('Deployment is final. Power cannot be withdrawn after deployment.')}</div>
      <button class="btn btn-primary" onclick="confirmDeploy('${main}', null, [100,0])" ${avail<=0?'disabled':''}>${tr('CONFIRM DEPLOYMENT')}</button>
    </div>`;
  }
  const secondaryOptions = battles.filter(t=>t!==main);
  const secondary = deployState.secondary && secondaryOptions.includes(deployState.secondary) ? deployState.secondary : null;
  // The secondary can also be invalidated without any click — e.g. a realtime
  // sync changes which battles are open. Derive the split from whether a
  // secondary actually survived, so the ratio shown and the ratio deployed
  // can never disagree.
  const split = secondary ? CONFIG.splitPresets[deployState.splitIdx] : [100, 0];
  const mainPower = round2(avail*split[0]/100); const secPower = secondary ? round2(avail*split[1]/100) : 0;
  return `
  <div class="card"><div class="card-title">${tr('MAIN BATTLE')}</div>
    ${battles.map(t => `<div class="terr-select ${main===t?'selected':''}" onclick="setDeployMain('${t}')">
      <div><b class="display">${territoryLabel(t)}</b> ${ownerBadge(world.ownership[t])}</div><div class="muted">${vpValueOf(t, world.currentDay)} VP</div></div>`).join('')}
  </div>
  <div class="card"><div class="card-title">${tr('OPTIONAL SECONDARY BATTLE')}</div>
    <div class="terr-select ${!secondary?'selected':''}" onclick="setDeploySecondary(null)"><div>${tr('None — 100% to Main')}</div></div>
    ${secondaryOptions.map(t => `<div class="terr-select ${secondary===t?'selected':''}" onclick="setDeploySecondary('${t}')">
      <div><b class="display">${territoryLabel(t)}</b> ${ownerBadge(world.ownership[t])}</div><div class="muted">${vpValueOf(t, world.currentDay)} VP</div></div>`).join('')}
  </div>
  ${secondary ? `<div class="card"><div class="card-title">${tr('ALLOCATION SPLIT')}</div>
    <div class="debug-grid" style="grid-template-columns:1fr 1fr 1fr;">
      ${CONFIG.splitPresets.map((p,i) => `<div class="split-opt ${deployState.splitIdx===i?'selected':''}" onclick="setSplit(${i})">${p[0]}/${p[1]}</div>`).join('')}
    </div></div>` : ''}
  <div class="card"><div class="card-title">${tr('RESULT')}</div>
    <div class="row-between"><span>${tr('Available')}</span><span class="mono">${fmt1(avail)}</span></div>
    <div class="row-between"><span>${territoryLabel(main)} ${tr('(Main)')}</span><span class="mono">⚡ ${fmt1(mainPower)}</span></div>
    ${secondary ? `<div class="row-between"><span>${territoryLabel(secondary)} ${tr('(Secondary)')}</span><span class="mono">⚡ ${fmt1(secPower)}</span></div>` : ''}
    <div class="divider"></div>
    <div class="muted" style="font-size:12px; margin-bottom:10px;">${tr('Deployment is final. Power cannot be withdrawn after deployment.')}</div>
    <button class="btn btn-primary" onclick="confirmDeploy('${main}', ${secondary?`'${secondary}'`:null}, [${split[0]},${split[1]}])" ${avail<=0?'disabled':''}>${tr('CONFIRM DEPLOYMENT')}</button>
  </div>`;
}
function setDeployMain(t){
  deployState.main = t;
  // If the new main was the secondary, the secondary is gone — reset the split
  // to 100/0 too. Leaving splitIdx at 75/25 or 50/50 with no secondary hides
  // the split UI while still arming a partial deploy.
  if (deployState.secondary===t){ deployState.secondary=null; deployState.splitIdx=0; }
  render();
}
function setDeploySecondary(t){ deployState.secondary = t; if(!t) deployState.splitIdx = 0; else if(deployState.splitIdx===0) deployState.splitIdx=1; render(); }
function setSplit(i){ deployState.splitIdx = i; render(); }
function confirmDeploy(main, sec, split){ deployPower(main, sec, split); deployState = {main:null, secondary:null, splitIdx:1}; }

/* ---------- RALLY ---------- */
let rallyPublishState = { main:null, secondary:null, splitIdx:1 };
let commanderMsgInput = '';
function screenRally(){
  if (world.rallyEnabled === false){
    return `<div class="card" style="text-align:center;">
      <div class="card-title">${tr('RALLY IS OFF')}</div>
      <div class="muted">${tr('The Commander/Rally feature is disabled for this round (an admin turned it off in the debug panel — handy when a faction only has one player, since Rally has no one to coordinate). Deploy your power directly from the Deploy tab instead.')}</div>
    </div>`;
  }
  const m = FACTION_META[profile.faction];
  const commander = (world.commanders || {})[profile.faction];
  const battles = battlesDoc.activeBattles.filter(t => effectiveEligibleFactions(t, world.ownership, battlesDoc.activeBattles, world.currentDay).includes(profile.faction));
  const msg = (world.commanderMessages || {})[profile.faction];

  // --- No commander elected for this round yet: show the nomination stand ---
  if (!commander){
    const nominees = (world.commanderNominees || {})[profile.faction] || [];
    const mine = myNomination();
    const eligible = isEligibleToNominate();
    const threshold = commanderEnergyThreshold();
    const streak = (seasonProgress && seasonProgress.commanderStreak) || 0;
    return `
    <div class="card">
      <div class="card-title">${tr('👑 COMMANDER ELECTION — ROUND {n}', {n: world.round})}</div>
      <div class="muted" style="line-height:1.6;">${tr('Commanders serve for the <b>whole round (7 days)</b>. Anyone in the top {p}% of {faction} by recent energy can stand. Highest recent energy among those who stand wins.', {p: Math.round(CONFIG.commanderTopPercent*100), faction: m.name})}</div>
    </div>
    <div class="card">
      <div class="card-title">${tr('STANDING FOR ELECTION ({n})', {n: nominees.length})}</div>
      ${nominees.length ? nominees.slice().sort((a,b)=>b.energy-a.energy).map(n => `
        <div class="row-between" style="padding:5px 0;">
          <span>${n.name}${n.playerId===LOCAL_PLAYER_ID?' '+tr('(you)'):''}</span>
          <span class="mono">${tr('{n} energy', {n: fmt1(n.energy)})}</span>
        </div>`).join('') : `<div class="empty-note">${tr('Nobody has stood yet.')}</div>`}
      <div class="divider"></div>
      <div class="muted" style="font-size:12px; margin-bottom:8px;">${tr('Your recent energy: <b class="mono">{mine}</b> · Needed to stand: <b class="mono">{need}</b>', {mine: fmt1(profile.recentEnergy||0), need: fmt1(threshold)})}</div>
      ${streak >= CONFIG.commanderMaxConsecutiveRounds ? `<div class="muted" style="font-size:12px; color:var(--gold);">${tr("You've served {n} rounds in a row — sit this one out (max {max}).", {n: streak, max: CONFIG.commanderMaxConsecutiveRounds})}</div>` : ''}
      ${mine ? `<div class="muted" style="text-align:center;">${tr("✅ You're standing. The winner is decided once elections resolve.")}</div>`
             : `<button class="btn btn-primary" onclick="nominateSelf()" ${!eligible?'disabled':''}>${tr('STAND FOR COMMANDER')}</button>`}
    </div>`;
  }

  const isMe = commander.playerId === LOCAL_PLAYER_ID;
  const rally = activityDoc.rally[profile.faction];

  const commanderCard = `
  <div class="rally-card" style="border-color:${m.color};">
    <div class="row-between" style="margin-bottom:6px;">
      <span class="display" style="color:${m.color}; font-weight:700; letter-spacing:1px;">👑 ${commander.name}${isMe?' '+tr('(you)'):''}</span>
      <span class="chip-small">${tr('ROUND {n}', {n: world.round})}</span>
    </div>
    <div class="muted" style="font-size:12px;">${tr('Record this round: {w}W – {l}L', {w: world.commanderRecord[profile.faction].wins, l: world.commanderRecord[profile.faction].losses})}</div>
    ${msg && msg.text ? `<div class="divider"></div><div style="font-size:13px; line-height:1.5;">💬 ${msg.text}</div><div class="muted" style="font-size:11px; margin-top:4px;">${tr('— posted day {n}', {n: msg.day})}</div>` : ''}
  </div>`;

  // --- Commander's own view: message board + rally publishing ---
  if (isMe){
    const remaining = CONFIG.commanderMessageMaxChars - commanderMsgInput.length;
    const msgCard = `
    <div class="card">
      <div class="card-title">${tr('BROADCAST TO YOUR TEAM')}</div>
      <div class="muted" style="font-size:12px; margin-bottom:6px;">${tr('One short message your whole team sees. Update it any day of the round.')}</div>
      <input id="cmd-msg-input" class="name-input" maxlength="${CONFIG.commanderMessageMaxChars}" placeholder="e.g. Day 3: Blue left Find Satoshi thin — hit it tomorrow" value="${commanderMsgInput}" oninput="commanderMsgInput=this.value; updateCmdMsgCount();" />
      <div class="row-between" style="margin-top:6px;">
        <span class="muted" id="cmd-msg-count" style="font-size:11px;">${tr('{n} characters left', {n: remaining})}</span>
        <button class="btn btn-primary btn-small" onclick="publishCommanderMessage(commanderMsgInput)" ${!commanderMsgInput.trim()?'disabled':''}>${tr('POST')}</button>
      </div>
    </div>`;

    if (!rally){
      if (!battles.length) return commanderCard + msgCard + `<div class="card"><div class="empty-note">${tr('No eligible battles to rally today.')}</div></div>`;
      const main = rallyPublishState.main && battles.includes(rallyPublishState.main) ? rallyPublishState.main : battles[0];
      const secOpts = battles.filter(t=>t!==main);
      const secondary = rallyPublishState.secondary && secOpts.includes(rallyPublishState.secondary) ? rallyPublishState.secondary : null;
      const split = secondary ? CONFIG.splitPresets[rallyPublishState.splitIdx] : [100, 0];
      return commanderCard + msgCard + `
      <div class="card"><div class="card-title">${tr("TODAY'S RALLY — MAIN TERRITORY")}</div>
        ${battles.map(t => `<div class="terr-select ${main===t?'selected':''}" onclick="rMain('${t}')"><div><b class="display">${territoryLabel(t)}</b> ${ownerBadge(world.ownership[t])}</div><div class="muted">${vpValueOf(t, world.currentDay)} VP</div></div>`).join('')}
      </div>
      <div class="card"><div class="card-title">${tr('SECONDARY (OPTIONAL)')}</div>
        <div class="terr-select ${!secondary?'selected':''}" onclick="rSec(null)">${tr('None')}</div>
        ${secOpts.map(t => `<div class="terr-select ${secondary===t?'selected':''}" onclick="rSec('${t}')"><div><b class="display">${territoryLabel(t)}</b></div></div>`).join('')}
      </div>
      ${secondary ? `<div class="card"><div class="card-title">${tr('ALLOCATION SPLIT')}</div>
        <div class="debug-grid" style="grid-template-columns:1fr 1fr 1fr;">
          ${CONFIG.splitPresets.map((p,i)=>`<div class="split-opt ${rallyPublishState.splitIdx===i?'selected':''}" onclick="rSplit(${i})">${p[0]}/${p[1]}</div>`).join('')}
        </div></div>` : ''}
      <button class="btn btn-primary" onclick="doPublish('${main}', ${secondary?`'${secondary}'`:null}, [${split[0]},${split[1]}])">${tr('PUBLISH RALLY')}</button>`;
    }
    return commanderCard + msgCard + `<div class="card"><div class="empty-note">${tr("Today's rally is published and locked.")}</div></div>`;
  }

  // --- Normal player's view ---
  if (!rally){
    return commanderCard + `<div class="card"><div class="empty-note">${tr("{name} hasn't published today's Rally yet — check back shortly.", {name: commander.name})}</div></div>`;
  }
  return commanderCard + `
  <div class="rally-card" style="border-color:${m.color};">
    <div class="display" style="color:${m.color}; font-weight:700; letter-spacing:1px; margin-bottom:8px;">${tr("TODAY'S RALLY")}</div>
    <div class="row-between"><span class="muted">${tr('MAIN')}</span><span><b>${territoryLabel(rally.main)}</b> — ${rally.split[0]}%</span></div>
    ${rally.secondary ? `<div class="row-between"><span class="muted">${tr('SUPPORT')}</span><span><b>${territoryLabel(rally.secondary)}</b> — ${rally.split[1]}%</span></div>` : ''}
    ${rally.auto ? `<div class="muted" style="font-size:11px; margin-top:6px;">${tr('(auto-generated)')}</div>` : ''}
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" onclick="followRally()" ${mystate.locked?'disabled':''}>${tr('FOLLOW RALLY')}</button>
    <button class="btn btn-outline" onclick="goScreen('deploy')" ${mystate.locked?'disabled':''}>${tr('CUSTOM DEPLOY')}</button>
  </div>
  ${mystate.locked ? `<div class="muted" style="text-align:center; margin-top:10px;">${tr('Power already deployed today.')}</div>` : ''}`;
}
// Surgical update so typing in the broadcast box doesn't re-render the whole
// screen and yank focus out of the input after every character.
function updateCmdMsgCount(){
  const el = document.getElementById('cmd-msg-count');
  if (el) el.textContent = tr('{n} characters left', {n: CONFIG.commanderMessageMaxChars - commanderMsgInput.length});
}
function rMain(t){
  rallyPublishState.main=t;
  // Same reset as setDeployMain — a rally published with a split but no
  // secondary would waste that share for every player who follows it.
  if (rallyPublishState.secondary===t){ rallyPublishState.secondary=null; rallyPublishState.splitIdx=0; }
  render();
}
function rSec(t){ rallyPublishState.secondary=t; if(!t) rallyPublishState.splitIdx=0; else if(rallyPublishState.splitIdx===0) rallyPublishState.splitIdx=1; render(); }
function rSplit(i){ rallyPublishState.splitIdx=i; render(); }
function doPublish(main, sec, split){ publishRally(main, sec, split); rallyPublishState={main:null,secondary:null,splitIdx:1}; }

/* ---------- PLAYERS (who's playing) ---------- */
/* NOTE: a detailed per-player roster screen (names, per-faction breakdown,

        </div>
      </div>`;

  </div>
  <div class="card"><div class="card-title">${tr('VP EARNED THAT DAY')}</div>
    ${FACTIONS.map(f => `<div class="row-between"><span><span class="dot" style="background:${FACTION_META[f].color}"></span>${FACTION_META[f].name}</span><span class="mono">+${fmt1(s.vpGained[f])}</span></div>`).join('')}
  </div>
  ${s.rallyResults && s.rallyResults[profile.faction] ? `

    ${s.rallyResults[profile.faction].main ? `<div>${tr('MAIN')} — ${territoryLabel(s.rallyResults[profile.faction].main.t)} ${rallyOutcomeLabel(s.rallyResults[profile.faction].main.outcome)}</div>` : ''}
    ${s.rallyResults[profile.faction].secondary ? `<div>${tr('SUPPORT')} — ${territoryLabel(s.rallyResults[profile.faction].secondary.t)} ${rallyOutcomeLabel(s.rallyResults[profile.faction].secondary.outcome)}</div>` : ''}
  </div>` : ''}
  <button class="btn btn-outline" onclick="goScreen('home')">${tr('BACK TO HOME')}</button>`;

/* ---------- SEASON ---------- */
/* ---------- HISTORY (look back at past days' territory ownership) ---------- */

async function dbgToggleRally(){
  if (!isRoomAdmin) return;

  if (!error&&data) world=data; render();

async function dbgToggleNpcPower(){
  if (!isRoomAdmin) return;
  const {data,error}=await sbClient.rpc('rk_set_flag',{p_room:roomCode,p_flag:'npcPowerEnabled',p_value:world.npcPowerEnabled===false});
  if (!error&&data) world=data;

  render();

async function dbgSimulateTeammate(){
  if (!isRoomAdmin) return;
  if (!battlesDoc.activeBattles.length) return;
  const t = battlesDoc.activeBattles[Math.floor(Math.random()*battlesDoc.activeBattles.length)];
  const key = dayKey(world.runId, 'activity', world.currentDay);
  let fresh = await safeGet(key, true); if (!fresh || fresh === STORAGE_RETRY_LATER) fresh = activityDoc;
  fresh.deployed[t] = fresh.deployed[t] || {};
  const amount = Math.round(400 + Math.random()*2200);
  fresh.deployed[t][profile.faction] = round2((fresh.deployed[t][profile.faction]||0) + amount);
  await safeSet(key, fresh, true); activityDoc = fresh; render();
}
function dbgCopyInviteLink(){

  } else {

function render(){
  try{ renderInner(); }
  catch(e){
    // A last-resort safety net: if literally anything else in render()
    // throws (a screen function, a modal, etc.), show that clearly instead
    // of silently leaving the page frozen and unresponsive to every
    // subsequent click — which is exactly what an uncaught throw here used
    // to do, with no visible sign anything had gone wrong.
    console.error('render() failed:', e);
    const root = document.getElementById('root');
    if (root){
      root.innerHTML = `<div style="padding:24px; color:#e7ecf3; font-family:sans-serif; background:#0a0d12; min-height:100vh; box-sizing:border-box;">
        <h3 style="color:#ff4d4d; margin-top:0;">Something broke while updating the screen</h3>
        <p style="opacity:0.85; font-size:13px; word-break:break-word;">${(e && e.message) ? e.message : 'Unknown error'}</p>
        <button class="btn btn-primary" style="margin-top:14px;" onclick="location.reload()">RELOAD</button>
        <p style="opacity:0.3; font-size:10px; font-family:monospace; margin-top:16px;">${APP_BUILD}</p>
      </div>`;
    }
  }
}

    ${renderTopbar()}
    <div class="content">${renderSyncError()}${body}</div>
    ${renderBottomNav()}
    ${isRoomAdmin ? `<div class="fab" onclick="toggleDebug()">⚙️</div>` : ''}
    ${activeModal ? modalTerritory(activeModal) : ''}
    ${safeRenderDebug()}
  `;
}
// If renderDebug() itself throws for any reason, this stops it from taking
// the ENTIRE render() call down with it. Without this isolation, a single
// bad reference inside the debug panel's HTML would silently break every
// future render() call app-wide the moment debugOpen became true — meaning
// EVERY button anywhere (Resolve Day, Deploy, the gear icon itself, all of
// it) would stop visibly responding, since render() throwing partway through
// leaves the DOM frozen at whatever it looked like before the click, with
// no error shown. This was almost certainly the real cause behind "nothing
// works anymore after touching the gear icon".
function safeRenderDebug(){
  try{ return renderDebug(); }
  catch(e){
    console.error('renderDebug() failed — closing the debug panel so the rest of the app keeps working:', e);
    debugOpen = false;
    return '';
  }
}

/* =========================================================
   LOOPS + INIT
========================================================= */
function startLoops(){
  // No more real-time countdown to track locally — battle resolution is a
  // manual action now, so we only need the background poll to pick up
  // other players' moves (deploys, rallies, someone else resolving the day).
  scheduleNextPoll();
}
// Self-rescheduling (rather than setInterval) so a slow sync never overlaps
// with the next one, plus a random jitter per client so many people opening
// this at once don't all hit the storage backend in the same instant.
function scheduleNextPoll(){
  const jitter = Math.random() * 2000;
  setTimeout(async () => {
    try{ await syncAll(); render(); } finally { scheduleNextPoll(); }
  }, CONFIG.pollMs + jitter);
}
render();
boot();
</script>
</body>
</html>
