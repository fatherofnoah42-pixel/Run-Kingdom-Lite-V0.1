}
function submitJoinRoom(){
  const code = (joinRoomInput || '').trim().toUpperCase();
  if (!code) return;
  roomCode = code;
  saveRoomCode(roomCode);
  bootPhase = 'loading'; render();
  boot();
}
let setupUrlInput = '';
let setupKeyInput = '';
// A surgical DOM update (not a full render()) so typing doesn't steal focus
// out of the input on every keystroke — full re-renders replace the whole
// #root innerHTML, which would kick focus out of whatever you were typing
// into after a single character.
function updateSetupButtonState(){
  const btn = document.getElementById('setup-connect-btn');
  if (btn) btn.disabled = !(setupUrlInput.trim() && setupKeyInput.trim());
}
function updateJoinRoomButtonState(){
  const btn = document.getElementById('join-room-btn');
  if (btn) btn.disabled = !joinRoomInput.trim();
}
function submitSetupForm(){
  const rawUrl = (setupUrlInput || '').trim();
  const key = (setupKeyInput || '').trim();
  if (!rawUrl || !key) return;
  const url = normalizeSupabaseProjectUrl(rawUrl);
  if (!url){
    alert('That Project URL is not valid. Paste the Supabase Project URL, for example: https://abcdefgh.supabase.co');
    return;
  }
  localStorage.setItem('rk_supabase_url', url);
  localStorage.setItem('rk_supabase_key', key);
  location.reload(); // simplest, safest way to cleanly re-init everything with the new config
}
// Faction is ASSIGNED, never chosen. Self-selection reliably produces a death
// spiral (everyone piles onto last round's winner → strong gets stronger →
// weak factions quit). We balance by TOTAL RECENT ENERGY rather than by
// headcount, because energy is the real input to battle power — three equal
// headcounts with wildly different energy is not a fair board.
// Note this is entry-side fairness only; it is NOT the "secretly boost the
// losing faction" balancing that the design principles rule out.
function assignFaction(recentEnergy, factionEnergy){
  const totals = { ...(factionEnergy || { cinder:0, surge:0, bloom:0 }) };
  let best = FACTIONS[0];
  FACTIONS.forEach(f => { if ((totals[f] || 0) < (totals[best] || 0)) best = f; });
  return best;
}
async function submitOnboarding(){
  try { await submitOnboardingInner(); }
  catch(e){
    console.error('join failed:', e);
    lastSyncError = { message: 'Could not join: ' + ((e && e.message) ? e.message : String(e)), retry: () => { lastSyncError = null; submitOnboarding(); } };
    bootPhase = 'onboarding'; render();
  }
}
async function submitOnboardingInner(){
  const name = (onboardName || '').trim() || ('Runner_' + Math.floor(1000+Math.random()*9000));
  // Pull the freshest season-level energy tallies so two people joining at
  // nearly the same time don't both get assigned to the same "lightest" faction.
  // This also CREATES the world if we're the first player in this room —
  // assignment can't happen without it.
  let fresh = await ensureWorldLoaded();
  if (!fresh){
    lastSyncError = { message: 'Could not reach the game world. If you just updated the game, re-run schema.sql in Supabase (SQL Editor) — the new version needs the version column and the kv_cas/kv_add_deploy/kv_assign_faction functions.', retry: () => { lastSyncError = null; submitOnboarding(); } };
    bootPhase = 'onboarding'; render(); return;
  }
  const recentEnergy = onboardRecentEnergy;
  // Pick the lightest faction AND book our energy into it in a single atomic
  // database call. Doing this as read-then-write in the client meant two
  // people joining at the same instant both saw the same "lightest" faction
  // and both got put there, and one of the two energy writes was then lost.
  let faction = null;
  try{
    const { data, error } = await sbClient.rpc('kv_assign_faction', { p_key: fullKey(worldKey(), true), p_energy: recentEnergy });
    if (error) throw error;
    faction = data;
  } catch(e){ console.warn('atomic faction assignment unavailable, falling back:', e); }
  if (!faction) faction = assignFaction(recentEnergy, fresh.factionEnergy);

  profile = { name, faction, recentEnergy, seasonId: fresh.seasonId };
  const okProfile = await safeSet('profile', profile, false);
  if (!okProfile){
    lastSyncError = { message: 'Could not save your profile. Please retry.', retry: () => { lastSyncError = null; submitOnboarding(); } };
    bootPhase = 'onboarding'; render(); return;
  }
  bootPhase = 'loading'; render();
  await enterWorld();
}

/* =========================================================
   WORLD LIFECYCLE
========================================================= */
function makeInitialWorld(){
  return {
    seasonId: 's' + Math.random().toString(36).slice(2,8),
    round: 1,
    ...freshRoundState(),
    // Season-level state (persists across all 6 rounds):
    // factionEnergy tracks each faction's total recent energy, used to keep
    // auto-assignment balanced by ENERGY (the real input to power) rather than
    // by headcount. roundWins tracks the season-long scoreboard.
    factionEnergy: { cinder:0, surge:0, bloom:0 },
    roundWins: { cinder:0, surge:0, bloom:0 },
    rallyEnabled: true, // any player can turn this off from the debug panel — useful while testing with only 1 player per faction, where Rally has no one to coordinate
  };
}
// Everything that resets at the start of each new ROUND (week). Faction
// assignment deliberately lives OUTSIDE this — it's season-scoped, so team
// identity survives all 6 rounds instead of being reshuffled weekly.
function freshRoundState(){
  const ownership = { A:'cinder', B:null, C:'surge', D:null, E:null, F:null, G:'bloom', H:null, I:null };
  const holdDays = {}; TERRITORIES.forEach(t => holdDays[t] = ownership[t] ? 1 : 0);
  return {
    runId: 'r' + Math.random().toString(36).slice(2,8),
    currentDay: 1, phase: 'battles',
    ownership, holdDays, vp: { cinder:0, surge:0, bloom:0 },
    repHistory: Object.fromEntries(TERRITORIES.map(t=>[t,[]])),
    prizePool: CONFIG.startingPrizePool, gmtBurned: 0, protocolRevenue: 0,
    commanderRecord: { cinder:{wins:0,losses:0}, surge:{wins:0,losses:0}, bloom:{wins:0,losses:0} },
    // Commander is elected per ROUND (7 days), not per day — a one-week term
    // is what makes the message board and a followership worth anything.
    commanders: { cinder:null, surge:null, bloom:null },       // { playerId, name, energy, consecutiveRounds }
    commanderNominees: { cinder:[], surge:[], bloom:[] },      // [{ playerId, name, energy }]
    commanderMessages: { cinder:null, surge:null, bloom:null },// 80-char broadcast, editable during the round
  };
}

async function ensureBattlesDoc(day){
  const key = dayKey(world.runId, 'battles', day);
  let doc = await safeGet(key, true);
  if (doc && doc !== STORAGE_RETRY_LATER) return doc;
  // Battle generation is a pure function (same inputs always produce the same
  // result), so recomputing it here after a transient read failure is safe —
  // it can't conflict with a copy another player already saved.
  doc = generateBattlesDocPure(day, world.ownership, world.holdDays, world.repHistory);
  await safeSet(key, doc, true);
  const updatedRepHistory = advanceRepHistory(world.repHistory, doc.activeBattles);
  // Only write 'world' again if repHistory actually needs updating (it may
  // already have been folded into the settlement write that created this day —
  // see settleCurrentDay — so this is normally a no-op, saving a write.)
  if (JSON.stringify(updatedRepHistory) !== JSON.stringify(world.repHistory)){
    world = { ...world, repHistory: updatedRepHistory };
    await safeSet(worldKey(), world, true);
  }
  return doc;
}
function generateBattlesDocPure(day, ownership, holdDays, repHistory){
  const activeBattles = selectActiveBattles(day, ownership, holdDays, repHistory);
  const baseline = {};
  activeBattles.forEach(t => {
    baseline[t] = {};
    effectiveEligibleFactions(t, ownership, activeBattles, day).forEach(f => {
      baseline[t][f] = generateBaselinePower(day, t, f);
    });
  });
  return { activeBattles, baseline };
}
function advanceRepHistory(repHistory, activeBattles){
  const out = {};
  TERRITORIES.forEach(t => { const arr = (repHistory[t]||[]).slice(); arr.push(activeBattles.includes(t)); out[t] = arr.slice(-2); });
  return out;
}
async function ensureActivityDoc(day){
  const key = dayKey(world.runId, 'activity', day);
  let doc = await safeGet(key, true);
  if (doc && doc !== STORAGE_RETRY_LATER) return doc;
  if (doc === STORAGE_RETRY_LATER){
    // Can't confirm whether another player already wrote deploy/rally data —
    // never overwrite with a blank doc. Keep whatever's cached in memory (if
    // any) and re-check on the next sync.
    return activityDoc || { deployed:{}, rally:{cinder:null,surge:null,bloom:null} };
  }
  doc = { deployed:{}, rally:{cinder:null,surge:null,bloom:null} };
  await safeSet(key, doc, true);
  return doc;
}
async function ensureMyState(day){
  const key = dayKey(world.runId, 'mystate', day);
  let doc = await safeGet(key, false);
  if (doc && doc !== STORAGE_RETRY_LATER) return doc;
  if (doc === STORAGE_RETRY_LATER){
    return mystate || { energyToday: round2(rngFor('energy', day, profile.name)()*60 + 6), gstBoostPercent: 0, locked: false, deployedPower: {}, followedRally: null };
  }
  doc = { energyToday: round2(rngFor('energy', day, profile.name)()*60 + 6), gstBoostPercent: 0, locked: false, deployedPower: {}, followedRally: null };
  await safeSet(key, doc, false);
  return doc;
}
// ROUND-scoped personal progress: resets every week, because participation
// and contribution are what each round's prize pool pays out against.
function roundProgressKey(){ return `room:${roomCode}:${world.runId}-progress`; }
// SEASON-scoped personal state: the wallet, the entry fee, and the commander
// term-limit streak all have to survive round rollovers. Keying these by
// runId (which changes weekly) would silently refund/recharge the entry fee
// every round and reset the term limit, letting one player hold the commander
// seat forever.
function seasonProgressKey(){ return `room:${roomCode}:season-${world.seasonId}-wallet`; }

async function ensureSeasonProgress(){
  const key = seasonProgressKey();
  let doc = await safeGet(key, false);
  if (doc && doc !== STORAGE_RETRY_LATER) return doc;
  if (doc === STORAGE_RETRY_LATER){
    return seasonProgress || { gmtBalance: CONFIG.startingWalletGMT - CONFIG.seasonEntryFeeGMT, totalDonated: 0, paidEntryFee: true, commanderStreak: 0, lastCommanderRound: 0 };
  }
  // First time this player is seen in this SEASON — the mocked Season Entry
  // fee is charged exactly once here, for the whole 6-round season.
  doc = {
    gmtBalance: CONFIG.startingWalletGMT - CONFIG.seasonEntryFeeGMT,
    totalDonated: 0, paidEntryFee: true,
    commanderStreak: 0, lastCommanderRound: 0,
  };
  await safeSet(key, doc, false);
  return doc;
}
async function ensureProgress(){
  const key = roundProgressKey();
  let doc = await safeGet(key, false);
  if (doc && doc !== STORAGE_RETRY_LATER) return doc;
  if (doc === STORAGE_RETRY_LATER){
    return progress || { participationDays: 0, seasonContributionPower: 0, contributionRank: Math.floor(20 + Math.random()*480), lastCountedDay: 0 };
  }
  const rankRng = rngFor('rank', profile.name, world.runId);
  doc = {
    participationDays: 0, seasonContributionPower: 0,
    contributionRank: Math.floor(20 + rankRng()*480), lastCountedDay: 0,
  };
  await safeSet(key, doc, false);
  return doc;
}

async function donateGMT(amount){
  amount = Math.round(amount);
  if (!seasonProgress || !world || amount <= 0 || amount > seasonProgress.gmtBalance) return;
  seasonProgress.gmtBalance = round2(seasonProgress.gmtBalance - amount);
  seasonProgress.totalDonated = round2((seasonProgress.totalDonated||0) + amount);
  await safeSet(seasonProgressKey(), seasonProgress, false);

  const prizeAdd = Math.round(amount * CONFIG.gmtSplit.prize);
  const burnAdd = Math.round(amount * CONFIG.gmtSplit.burn);
  const protoAdd = amount - prizeAdd - burnAdd; // remainder, so the three parts always sum exactly to the donation
  const res = await mutateShared(worldKey(), (w) => {
    if (!w) return null;
    return { ...w, prizePool: w.prizePool + prizeAdd, gmtBurned: w.gmtBurned + burnAdd, protocolRevenue: w.protocolRevenue + protoAdd };
  });
  if (res.ok && res.value) world = res.value;
  render();
}

/* =========================================================
   ROSTER — "who's playing" presence list
   One shared doc, keyed by player name, holding {faction, lastSeen}. We only
   write to it: once when you join, and afterward at most once every
   CONFIG.heartbeatMs (piggybacked on the regular poll, not a separate timer)
   — so a room full of people doesn't multiply into a write per person per
   poll. Everyone reads it every poll cycle (one cheap GET) to show a live
   headcount.
========================================================= */
let roster = null;
let lastHeartbeatAt = 0;

function myRosterEntry(){
  return { name: profile.name, faction: profile.faction, recentEnergy: profile.recentEnergy || 0, lastSeen: Date.now() };
}
// Keyed by LOCAL_PLAYER_ID, NOT by display name — two different people can
// pick the same name, which would silently merge them into one entry.
// CAS-guarded so two players heartbeating at once can't drop each other.
async function joinRoster(){
  const key = `room:${roomCode}:${world.runId}-roster`;
  const res = await mutateShared(key, (cur) => ({ ...(cur || {}), [LOCAL_PLAYER_ID]: myRosterEntry() }));
  if (res.ok && res.value){ roster = res.value; lastHeartbeatAt = Date.now(); }
}
async function refreshRoster(){
  const key = `room:${roomCode}:${world.runId}-roster`;
  const fresh = await safeGet(key, true);
  if (fresh && fresh !== STORAGE_RETRY_LATER) roster = fresh;
  if (Date.now() - lastHeartbeatAt > CONFIG.heartbeatMs){
    const res = await mutateShared(key, (cur) => ({ ...(cur || {}), [LOCAL_PLAYER_ID]: myRosterEntry() }));
    if (res.ok && res.value){ roster = res.value; lastHeartbeatAt = Date.now(); }
  }
}
function rosterStats(){
  if (!roster) return { total: 0, online: 0, byFaction: {cinder:0,surge:0,bloom:0}, onlineByFaction: {cinder:0,surge:0,bloom:0}, entries: [] };
  const now = Date.now();
  const entries = Object.entries(roster).map(([id, r]) => ({ id, name: r.name || id, faction: r.faction, online: (now - r.lastSeen) <= CONFIG.onlineWindowMs }));
  const byFaction = {cinder:0,surge:0,bloom:0}, onlineByFaction = {cinder:0,surge:0,bloom:0};
  let online = 0;
  entries.forEach(e => {
    if (byFaction[e.faction] !== undefined) byFaction[e.faction]++;
    if (e.online){ online++; if (onlineByFaction[e.faction] !== undefined) onlineByFaction[e.faction]++; }
  });
  entries.sort((a,b) => (b.online - a.online) || a.name.localeCompare(b.name));
  return { total: entries.length, online, byFaction, onlineByFaction, entries };
}

// Loads the room's world, creating it if this is the first person in the room.
// Extracted so ONBOARDING can call it too: faction assignment needs to read
// the season-level energy tallies, which live on the world — but the world
// used to be created only after onboarding finished, so the very first player
// in a fresh room hit "could not reach the game world" and could never join.
async function ensureWorldLoaded(){
  let w = await safeGet(worldKey(), true);
  // If this was just a transient read failure, wait and re-check before
  // concluding the world doesn't exist — otherwise we'd spin up a duplicate world.
  for (let i = 0; i < 3 && w === STORAGE_RETRY_LATER; i++){ await sleep(700); w = await safeGet(worldKey(), true); }
  if (!w || w === STORAGE_RETRY_LATER){
    w = makeInitialWorld();
    const ok = await safeSet(worldKey(), w, true);
    if (!ok) return null;
    const check = await safeGet(worldKey(), true);
    if (check && check !== STORAGE_RETRY_LATER) w = check;
  }
  world = w;
  return world;
}
async function enterWorld(){
  const loaded = await ensureWorldLoaded();
  if (!loaded){
    lastSyncError = { message: 'Could not reach the game world. Please retry.', retry: () => { lastSyncError = null; enterWorld(); } };
    bootPhase = 'ready'; render(); return;
  }
  await syncAll();
  await joinRoster(); // announce ourselves once so we show up for others right away
  bootPhase = 'ready';
  render();
  startLoops();
  startRealtime();
}

/* =========================================================
   REALTIME — push updates instead of frequent polling
   Supabase's free tier includes Postgres realtime (a websocket that tells us
   the instant any row in kv_store changes). This is what actually makes
   this version "more stable" than polling a shared store: other players'
   moves show up within a second or two, and we don't need to hammer the
   database every few seconds to find out what changed. The regular poll
   loop (scheduleNextPoll) is kept, just at a much slower cadence, purely as
   a safety net in case a realtime message is ever missed (e.g. a brief
   disconnect).
========================================================= */
let realtimeChannel = null;
function startRealtime(){
  if (!sbClient || realtimeChannel) return;
  realtimeChannel = sbClient
    .channel('kv-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'kv_store' }, handleRealtimeChange)
    .subscribe();
}
function handleRealtimeChange(payload){
  const row = payload.new && payload.new.key ? payload.new : payload.old;
  if (!row || !row.key || !world) return;
  const key = row.key;
  const value = payload.new ? payload.new.value : null;
  const roomPrefix = `room:${roomCode}:`;
  if (!key.startsWith(roomPrefix)) return; // ignore other rooms entirely
  if (key === worldKey()){
    if (!value) return;
    // A day/round rollover changes which per-day documents are current. If we
    // just swapped in the new world and re-rendered, the header would show the
    // new day while battlesDoc / activityDoc / mystate still held the PREVIOUS
    // day's data — a brief but real "new world + stale UI" state where the map
    // and the deploy screen disagree with the day counter. Re-sync those
    // documents before showing anything from the new day.
    const rolledOver = value.currentDay !== world.currentDay
      || value.round !== world.round
      || value.runId !== world.runId;
    world = value;
    if (rolledOver){
      dataStale = true;
      render();
      syncAll().then(() => { dataStale = false; render(); });
    } else {
      render();
    }
    return;
  }
  // Only react to keys relevant to the season we're currently in — ignore
  // everyone else's personal keys and any leftover data from old runIds.
  if (!key.startsWith(roomPrefix + world.runId + '-')) return;
  if (key === dayKey(world.runId, 'activity', world.currentDay)){
    if (value) { activityDoc = value; render(); }
  } else if (key === dayKey(world.runId, 'battles', world.currentDay)){
    if (value) { battlesDoc = value; render(); }
  } else if (key === `room:${roomCode}:${world.runId}-roster`){
    if (value) { roster = value; render(); }
  } else if (key.startsWith(dayKey(world.runId, 'settlement', ''))){
    // A new day just got settled somewhere else — re-sync everything (new
    // day's battles/activity docs, updated world) rather than trying to
    // patch every field by hand.
    syncAll().then(render);
  }
}

let cachedDocsForDay = null; // day number that battlesDoc/mystate were last loaded for
let settlementFetchedForDay = null; // reportDay we last fetched settlementDoc for
let progressLoaded = false;

async function syncAll(){
  const fresh = await safeGet(worldKey(), true);
  if (fresh && fresh !== STORAGE_RETRY_LATER) world = fresh;
  const day = world.currentDay;

  // battlesDoc and mystate only change when the day itself changes (both are
  // written once per day by this client's own actions or the settlement
  // flow), so there's no need to re-fetch them from storage on every poll —
  // that was a large, mostly-wasted share of our storage call volume.
  const dayChanged = cachedDocsForDay !== day;
  if (dayChanged || !battlesDoc) battlesDoc = await ensureBattlesDoc(day);
  if (dayChanged || !mystate) mystate = await ensureMyState(day);
  cachedDocsForDay = day;

  // activityDoc is the one thing other players actively write to throughout
  // the day, so it's the one worth polling every cycle.
  activityDoc = await ensureActivityDoc(day);

  const reportDay = roundIsOver() ? day : day - 1;
  if (reportDay >= 1 && (settlementFetchedForDay !== reportDay || !settlementDoc)){
    const fetchedSettlement = await safeGet(dayKey(world.runId, 'settlement', reportDay), true);
    if (fetchedSettlement !== STORAGE_RETRY_LATER){ settlementDoc = fetchedSettlement; settlementFetchedForDay = reportDay; }
  } else if (reportDay < 1){
    settlementDoc = null;
  }

  // progress is only ever written by this account, so we only need to load
  // it once per session; reconcileProgress() updates the in-memory copy and
  // persists changes itself, no need to re-GET it every poll.
  if (!progressLoaded){ progress = await ensureProgress(); seasonProgress = await ensureSeasonProgress(); progressLoaded = true; }

  await refreshRoster();
  await electCommanderIfNeeded();
  await autoFallbackRally(day);
  await reconcileProgress();
}

async function autoFallbackRally(day){
  if (world.rallyEnabled === false) return; // Rally turned off for this round
  if (world.phase !== 'fog') return;
  let changed = false;
  const pending = {};
  for (const f of FACTIONS){
    if (!activityDoc.rally[f]){
      const myBattles = battlesDoc.activeBattles.filter(t => effectiveEligibleFactions(t, world.ownership, battlesDoc.activeBattles, world.currentDay).includes(f));
      if (!myBattles.length) continue;
      const rng = rngFor('rally', day, f);
      const scored = myBattles.map(t => ({ t, score: vpValueOf(t, day)*2 + bountyMultiplier(getBountyLevel(world.holdDays[t]||0))*3 + rng() }));
      scored.sort((a,b)=>b.score-a.score);
      const main = scored[0].t; const secondary = scored[1] ? scored[1].t : null;
      pending[f] = { main, secondary, split: secondary ? [75,25] : [100,0], auto: true };
      changed = true;
    }
  }
  if (!changed) return;
  const res = await mutateShared(dayKey(world.runId, 'activity', day), (doc) => {
    const d = doc || { deployed:{}, rally:{cinder:null,surge:null,bloom:null} };
    let any = false;
    const rally = { ...d.rally };
    FACTIONS.forEach(f => { if (pending[f] && !rally[f]){ rally[f] = pending[f]; any = true; } });
    if (!any) return null;
    return { ...d, rally };
  });
  if (res.ok && res.value && !res.skipped) activityDoc = res.value;
}

async function reconcileProgress(){
  const doneUpTo = roundIsOver() ? world.currentDay : world.currentDay - 1;
  if (doneUpTo <= progress.lastCountedDay) return;
  let changed = false;
  for (let d = progress.lastCountedDay+1; d <= doneUpTo; d++){
    const m = await safeGet(dayKey(world.runId, 'mystate', d), false);
    if (m === STORAGE_RETRY_LATER){
      // Don't know yet whether day d counted — stop here rather than guessing.
      // Advancing lastCountedDay past an unconfirmed day would permanently
      // lose that day's participation credit if it turns out we WERE locked
      // in; leaving it unadvanced just means we retry this same day (and any
      // after it) on the next reconcile pass instead.
      break;
    }
    if (m && m.locked){
      progress.participationDays += 1;
      progress.seasonContributionPower = round2(progress.seasonContributionPower + Object.values(m.deployedPower||{}).reduce((a,b)=>a+b,0));
      changed = true;
    }
    progress.lastCountedDay = d;
    changed = true;
  }
  if (changed) await safeSet(roundProgressKey(), progress, false);
}

/* =========================================================
   MANUAL PHASE CONTROLS
   Battle resolution used to run on a real-time countdown, which meant every
   connected client's timer converged on the exact same deadline — the
   single biggest source of simultaneous storage writes, and the main
   trigger behind rate-limit errors under real multiplayer load. Now both
   entering Fog and resolving the day are explicit actions any player can
   take, so a write only happens when a person actually clicks something.
========================================================= */
async function enterFogManually(){
  if (inFlightFogToggle || !world || world.phase !== 'battles') return;
  inFlightFogToggle = true;
  try{
    const fresh = await safeGet(worldKey(), true);
    if (!fresh || fresh === STORAGE_RETRY_LATER) return;
    if (fresh.phase === 'battles'){
      fresh.phase = 'fog';
      await safeSet(worldKey(), fresh, true);
    }
    world = fresh;
  } finally { inFlightFogToggle = false; render(); }
}
async function resolveDayManually(){
  if (inFlightResolve || !world) return;
  if (roundIsOver()) return;
  inFlightResolve = true;
  try{
    const fresh = await safeGet(worldKey(), true);
    if (fresh && fresh !== STORAGE_RETRY_LATER) world = fresh;
    if (roundIsOver()) return;
    await settleCurrentDay();
  } finally { inFlightResolve = false; render(); }
}

async function settleCurrentDay(){
  const day = world.currentDay;
  const sKey = dayKey(world.runId, 'settlement', day);
  let sDoc = await safeGet(sKey, true);
  if (sDoc === STORAGE_RETRY_LATER) return; // Can't confirm whether this day was already settled — skip this cycle, try again next tick
  if (sDoc){ settlementDoc = sDoc; await advanceAfterExternalSettlement(); return; }

  let bDoc = await safeGet(dayKey(world.runId, 'battles', day), true);
  if (!bDoc || bDoc === STORAGE_RETRY_LATER) bDoc = battlesDoc;
  let aDoc = await safeGet(dayKey(world.runId, 'activity', day), true);
  if (!aDoc || aDoc === STORAGE_RETRY_LATER) aDoc = activityDoc;

  const results = []; const newOwnership = {...world.ownership}; const rallyResults = {};
  bDoc.activeBattles.forEach(t => {
    const eff = effectiveEligibleFactions(t, world.ownership, bDoc.activeBattles, day);
    const powerMap = {};
    eff.forEach(f => {
      const base = (bDoc.baseline[t] && bDoc.baseline[t][f]) || 0;
      const dep = (aDoc.deployed[t] && aDoc.deployed[t][f]) || 0;
      powerMap[f] = round2(base + dep);
    });
    const prevOwner = world.ownership[t];
    const { winner, tie } = resolveBattle(powerMap, prevOwner);
    const prevHold = world.holdDays[t] || 0;
    let bonusVP = 0;
    if (winner !== prevOwner && winner) bonusVP = bountyBonusVP(getBountyLevel(prevHold));
    results.push({ t, powerMap, prevOwner, winner, tie, bonusVP });
    newOwnership[t] = winner;
    FACTIONS.forEach(f => {
      const r = aDoc.rally[f];
      if (r && (r.main === t || r.secondary === t)){
        rallyResults[f] = rallyResults[f] || {};
        // Distinguish "captured it from someone else" vs "successfully held
        // territory that was already ours" vs "lost it" — these previously
        // all collapsed into a single captured:true/false flag, so
        // defending your own Rally target displayed as "CAPTURED" instead
        // of something like "HELD", which reads backwards.
        const outcome = winner !== f ? 'lost' : (prevOwner === f ? 'held' : 'captured');
        if (r.main === t) rallyResults[f].main = { t, outcome }; else rallyResults[f].secondary = { t, outcome };
      }
    });
  });

  const newHoldDays = {...world.holdDays};
  bDoc.activeBattles.forEach(t => {
    const r = results.find(x=>x.t===t);
    if (r.winner !== r.prevOwner && r.winner) newHoldDays[t] = 1;
    else if (r.winner === r.prevOwner && r.winner) newHoldDays[t] = (world.holdDays[t]||0) + 1;
    else newHoldDays[t] = 0;
  });
  TERRITORIES.forEach(t => { if (!bDoc.activeBattles.includes(t) && world.ownership[t]) newHoldDays[t] = (world.holdDays[t]||0) + 1; });

  const vpGained = calculateDailyVP(newOwnership, day);
  const newVp = {...world.vp};
  FACTIONS.forEach(f => newVp[f] = round2(newVp[f] + vpGained[f]));
  results.forEach(r => { if (r.bonusVP > 0 && r.winner) newVp[r.winner] = round2(newVp[r.winner] + r.bonusVP); });

  const rng = rngFor('economy', day);
  const spend = Math.round(800 + rng()*2600);
  const prizeAdd = Math.round(spend*CONFIG.gmtSplit.prize), burnAdd = Math.round(spend*CONFIG.gmtSplit.burn), protoAdd = Math.round(spend*CONFIG.gmtSplit.protocol);

  const newCommanderRecord = JSON.parse(JSON.stringify(world.commanderRecord));
  Object.entries(rallyResults).forEach(([f,rr]) => {
    if (rr.main){ if (rr.main.outcome !== 'lost') newCommanderRecord[f].wins++; else newCommanderRecord[f].losses++; }
  });

  sDoc = { results, vpGained, rallyResults, commanders: world.commanders, settledAt: Date.now(), ownershipAfter: newOwnership };
  await safeSet(sKey, sDoc, true);
  settlementDoc = sDoc;

  const roundDone = day >= CONFIG.roundDays;
  const nextDay = roundDone ? day : day + 1;

  // Precompute next day's battles + the resulting repHistory here, and fold
  // repHistory into the SAME 'world' write below. This avoids a second
  // 'world' write immediately after this one (which is what was happening
  // right at the day rollover and made that moment the most write-heavy,
  // highest-contention point in the whole cycle).
  let nextBattlesDoc = null;
  let nextRepHistory = world.repHistory;
  if (!roundDone){
    nextBattlesDoc = generateBattlesDocPure(nextDay, newOwnership, newHoldDays, world.repHistory);
    nextRepHistory = advanceRepHistory(world.repHistory, nextBattlesDoc.activeBattles);
  }

  // At round end, bank the round winner into the season-long scoreboard.
  let newRoundWins = world.roundWins;
  if (roundDone){
    const winnerFaction = rankFactions(newVp, newOwnership)[0].f;
    newRoundWins = { ...world.roundWins, [winnerFaction]: (world.roundWins[winnerFaction] || 0) + 1 };
  }
  const isLastRound = world.round >= CONFIG.roundsPerSeason;

  // CAS, and re-apply on top of whatever the newest world is. This is the
  // most dangerous write in the game: a plain overwrite racing with someone's
  // donation or nomination could roll back an entire day's settlement.
  // prizePool/gmtBurned/protocolRevenue are applied as DELTAS so a concurrent
  // donation is added to rather than discarded.
  const settleRes = await mutateShared(worldKey(), (w) => {
    const base = w || world;
    if (base.currentDay !== day) return null; // someone already settled this day
    return {
      ...base, ownership: newOwnership, holdDays: newHoldDays, vp: newVp, repHistory: nextRepHistory,
      prizePool: base.prizePool + prizeAdd, gmtBurned: base.gmtBurned + burnAdd, protocolRevenue: base.protocolRevenue + protoAdd,
      commanderRecord: newCommanderRecord,
      roundWins: roundDone ? { ...base.roundWins, [rankFactions(newVp, newOwnership)[0].f]: (base.roundWins[rankFactions(newVp, newOwnership)[0].f] || 0) + 1 } : base.roundWins,
      currentDay: nextDay,
      phase: roundDone ? (isLastRound ? 'seasonEnd' : 'roundEnd') : 'battles',
    };
  });
  if (settleRes.ok && settleRes.value && !settleRes.skipped) world = settleRes.value;
  else if (settleRes.skipped){ await advanceAfterExternalSettlement(); return; }
  if (nextBattlesDoc){
    // Write the next day's battles doc now, under its final key, so the
    // upcoming ensureBattlesDoc() call in syncAll() finds it already there
    // and doesn't need to generate + write it again.
    await safeSet(dayKey(world.runId, 'battles', nextDay), nextBattlesDoc, true);
  }

  flashTiles = {}; results.forEach(r => { if (r.winner !== r.prevOwner) flashTiles[r.t] = true; });

  if (!roundDone){ await syncAll(); } else { computeRoundResult(); }
}

// Starts the next ROUND: fresh map, fresh VP, fresh prize pool, fresh
// commander election — but the same factions and the same season scoreboard.
async function startNextRound(){
  const next = freshRoundState(); // generated once so all clients don't each mint a different runId
  const res = await mutateShared(worldKey(), (w) => {
    if (!w || w.phase !== 'roundEnd') return null; // already advanced by someone else
    return { ...w, round: w.round + 1, ...next };
  });
  if (res.ok && res.value) world = res.value;
  const ok = res.ok;
  if (!ok){
    lastSyncError = { message: 'Could not start the next round. Please retry.', retry: () => { lastSyncError = null; startNextRound(); } };
    render(); return;
  }
  roundResult = null;
  progressLoaded = false; cachedDocsForDay = null; settlementFetchedForDay = null; settlementDoc = null;
  await syncAll();
  uiScreen = 'home';
  render();
}
async function advanceAfterExternalSettlement(){
  const fresh = await safeGet(worldKey(), true);
  if (fresh && fresh !== STORAGE_RETRY_LATER) world = fresh;
  await syncAll();
  if (world.phase === 'roundEnd' || world.phase === 'seasonEnd') computeRoundResult();
}

const RANK_TITLES = { 1: 'Champion', 2: 'Runner-Up', 3: 'Second Runner-Up' };
// Shared ranking used by both the live standings and round settlement, so the
// winner banked into roundWins can never disagree with what players saw.
// Tie rule: VP first; if still tied, the faction currently holding more
// territory ranks higher (reflects actual board control); if STILL tied
// (fully even VP and territory count), fall back to a fixed alphabetical
// order by faction id — deterministic and the same for every player, rather
// than silently depending on the order FACTIONS happens to be declared in.
function rankFactions(vp, ownership){
  const territoryCount = (f) => TERRITORIES.filter(t => ownership[t] === f).length;
  return FACTIONS
    .map(f => ({ f, vp: vp[f], territories: territoryCount(f) }))
    .sort((a,b) => (b.vp - a.vp) || (b.territories - a.territories) || a.f.localeCompare(b.f));
}
function computeRoundResult(){
  const standings = rankFactions(world.vp, world.ownership);
  const ranks = {}; standings.forEach((s,i)=>ranks[s.f]=i+1);
  const myRank = ranks[profile.faction];
  const share = CONFIG.rewardDistribution[myRank] || 0;
  const factionPool = Math.round(world.prizePool * share);
  const participationPool = Math.round(factionPool * CONFIG.poolSplit.participation);
  const contributionPool = factionPool - participationPool;
  const eligible = progress.participationDays >= CONFIG.participationThreshold;
  const estReward = eligible
    ? Math.round(participationPool/850 + contributionPool * (progress.seasonContributionPower / (progress.seasonContributionPower*300 + 40000)))
    : 0;
  const rankTitle = RANK_TITLES[myRank] || null;
  const isSeasonEnd = world.phase === 'seasonEnd';
  // Non-token rewards are awarded on the SEASON result (all 6 rounds), not
  // every week — a weekly badge would be worthless. Weekly rounds pay GMT.
  const seasonStandings = isSeasonEnd
    ? FACTIONS.map(f => ({ f, wins: world.roundWins[f] || 0 }))
        .sort((a,b) => (b.wins - a.wins) || a.f.localeCompare(b.f))
    : null;
  const seasonRank = seasonStandings ? (seasonStandings.findIndex(s => s.f === profile.faction) + 1) : null;
  const seasonRankTitle = seasonRank ? RANK_TITLES[seasonRank] : null;
  roundResult = {
    standings, myRank, factionPool, estReward, eligible, rankTitle,
    isSeasonEnd, seasonStandings, seasonRank,
    badge: (isSeasonEnd && eligible && seasonRankTitle) ? `${FACTION_META[profile.faction].name} S01 ${seasonRankTitle} Badge` : null,
    stepnVip: isSeasonEnd && eligible && !!seasonRankTitle,
    sneakerDesign: (isSeasonEnd && eligible && seasonRankTitle) ? seasonRankTitle : null,
  };
}

/* =========================================================
   PLAYER ACTIONS
========================================================= */
function computeAvailablePower(){ return applyGSTBoost(energyToPower(mystate.energyToday), mystate.gstBoostPercent); }
function totalDeployedMine(){ return Object.values(mystate.deployedPower).reduce((a,b)=>a+b,0); }
function remainingPower(){ return round2(computeAvailablePower() - totalDeployedMine()); }
function iAmEliminated(){ return !factionOwnsAny(profile.faction, world.ownership); }

async function deployPower(mainT, secT, splitPct){
  if (mystate.locked) return;
  const avail = remainingPower();
  const [mp, sp] = splitPct;
  const mainPower = round2(avail * mp/100);
  const secPower = secT ? round2(avail * sp/100) : 0;

  // Try writing to shared battle data first; only lock deployment locally
  // once that write succeeds, to avoid "looks deployed on my screen but no
  // one else can see it" inconsistency.
  // Deployment is the single hottest contended write: many players adding
  // power to the same day's doc at once. It goes through a dedicated atomic
  // database function that increments the value in place, so there is no
  // read-modify-write window at all and no deployment can be lost.
  const activityKey = dayKey(world.runId, 'activity', world.currentDay);
  const addOne = async (terr, amt) => {
    const { data, error } = await sbClient.rpc('kv_add_deploy', {
      p_key: fullKey(activityKey, true), p_territory: terr, p_faction: profile.faction, p_amount: amt,
    });
    if (error) throw error;
    return data;
  };
  let updatedDoc = null;
  try{
    updatedDoc = await addOne(mainT, mainPower);
    if (secT) updatedDoc = await addOne(secT, secPower);
  } catch(e){
    console.error('atomic deploy failed:', e);
    lastSyncError = { message: 'Your deployment did not sync to the shared battle. Please retry (your energy and choices are not lost).', retry: () => { lastSyncError = null; deployPower(mainT, secT, splitPct); } };
    render();
    return;
  }
  if (updatedDoc) activityDoc = updatedDoc;

  mystate.deployedPower[mainT] = round2((mystate.deployedPower[mainT]||0) + mainPower);
  if (secT) mystate.deployedPower[secT] = round2((mystate.deployedPower[secT]||0) + secPower);
  mystate.locked = true;
  const personalOk = await safeSet(dayKey(world.runId, 'mystate', world.currentDay), mystate, false);
  if (!personalOk){
    lastSyncError = { message: 'Your deployment counted toward the battle, but your personal record failed to save. It will retry automatically.', retry: () => { lastSyncError = null; safeSet(dayKey(world.runId,'mystate',world.currentDay), mystate, false).then(render); } };
  } else {
    lastSyncError = null;
  }
  uiScreen = 'home';
  render();
}
async function followRally(){
  if (mystate.locked) return;
  const r = activityDoc.rally[profile.faction];
  if (!r) return;
  mystate.followedRally = true;
  await deployPower(r.main, r.secondary, r.split);
}
/* =========================================================
   COMMANDER — nominate, elect, broadcast
   Term is one ROUND (7 days), not one day. A one-day term resets trust every
   morning: the commander pays no price for a bad call and nobody has a reason
   to remember them, which makes both the message board and any followership
   worthless. A week-long term lets a commander build a record.
   Selection is self-nomination + objective energy ranking (no voting) —
   voting between strangers with zero social graph is noise, and being drafted
   at random produces commanders who never wanted the job.
========================================================= */
function commanderEnergyThreshold(){
  // Must be in the top N% of your faction by recent energy to stand. Uses the
  // roster (everyone currently in this room) as the population.
  const mine = Object.values(roster || {}).filter(r => r.faction === profile.faction && typeof r.recentEnergy === 'number');
  if (!mine.length) return 0;
  const sorted = mine.map(r => r.recentEnergy).sort((a,b) => b - a);
  const idx = Math.max(0, Math.ceil(sorted.length * CONFIG.commanderTopPercent) - 1);
  return sorted[idx];
}
function isEligibleToNominate(){
  if (!world || !profile) return false;
  const c = (world.commanders || {})[profile.faction];
  if (c && c.playerId === LOCAL_PLAYER_ID) return false; // already commander
  // Term limit: can't serve more than N consecutive rounds, so the single
  // biggest runner in a faction can't hold the seat forever and freeze
  // everyone else out.
  const streak = (seasonProgress && seasonProgress.commanderStreak) || 0;
  if (streak >= CONFIG.commanderMaxConsecutiveRounds) return false;
  const myEnergy = (profile.recentEnergy || 0);
  return myEnergy >= commanderEnergyThreshold();
}
function myNomination(){
  const list = (world.commanderNominees || {})[profile.faction] || [];
  return list.find(n => n.playerId === LOCAL_PLAYER_ID) || null;
}
async function nominateSelf(){
  if (!isEligibleToNominate()) return;
  const entry = { playerId: LOCAL_PLAYER_ID, name: profile.name, energy: profile.recentEnergy || 0 };
  const res = await mutateShared(worldKey(), (w) => {
    if (!w) return null;
    const list = ((w.commanderNominees && w.commanderNominees[profile.faction]) || []).filter(n => n.playerId !== LOCAL_PLAYER_ID);
    list.push(entry);
    return { ...w, commanderNominees: { ...w.commanderNominees, [profile.faction]: list } };
  });
  if (!res.ok){
    lastSyncError = { message: 'Your nomination did not sync. Please retry.', retry: () => { lastSyncError = null; nominateSelf(); } };
    render(); return;
  }
  if (res.value) world = res.value;
  lastSyncError = null;
  await electCommanderIfNeeded();
  render();
}
// Highest recent energy among those who actually put their hand up wins.
// Deterministic, so every client computes the same winner from the same data.
function pickCommanderFrom(nominees){
  if (!nominees || !nominees.length) return null;
  const sorted = [...nominees].sort((a,b) => (b.energy - a.energy) || a.playerId.localeCompare(b.playerId));
  return sorted[0];
}
// NOMINATION WINDOW.
// Elections used to resolve the instant the first person nominated, which
// made it "first to click wins" rather than "highest energy wins" — nobody
// else ever got the chance to stand. Nominations now stay open for the whole
// of Day 1 and the winner is only locked in from Day 2 onward.
function nominationsOpen(){ return world && world.currentDay <= CONFIG.commanderNominationDays; }
async function electCommanderIfNeeded(){
  if (!world || nominationsOpen()) return;
  const res = await mutateShared(worldKey(), (w) => {
    if (!w) return null;
    let changed = false;
    const commanders = { ...w.commanders };
    FACTIONS.forEach(f => {
      if (commanders[f]) return;
      const winner = pickCommanderFrom(w.commanderNominees[f]);
      if (winner){ commanders[f] = { ...winner, electedRound: w.round }; changed = true; }
    });
    if (!changed) return null; // nothing to do — skip the write entirely
    return { ...w, commanders };
  });
  if (res.ok && res.value && !res.skipped) world = res.value;
  // Track our own consecutive-round streak locally, for the term limit.
  const mine = (world.commanders || {})[profile.faction];
  if (mine && mine.playerId === LOCAL_PLAYER_ID && seasonProgress && seasonProgress.lastCommanderRound !== world.round){
    seasonProgress.commanderStreak = ((seasonProgress.lastCommanderRound === world.round - 1) ? (seasonProgress.commanderStreak || 0) : 0) + 1;
    seasonProgress.lastCommanderRound = world.round;
    await safeSet(seasonProgressKey(), seasonProgress, false);
  }
}
function iAmCommander(){
  const c = world && (world.commanders || {})[profile.faction];
  return !!(c && c.playerId === LOCAL_PLAYER_ID);
}
async function publishCommanderMessage(text){
  if (!iAmCommander()) return;
  const msg = (text || '').slice(0, CONFIG.commanderMessageMaxChars);
  const res = await mutateShared(worldKey(), (w) => {
    if (!w) return null;
    return { ...w, commanderMessages: { ...w.commanderMessages, [profile.faction]: { text: msg, day: w.currentDay, at: Date.now() } } };
  });
  if (!res.ok){
    lastSyncError = { message: 'Your message did not sync. Please retry.', retry: () => { lastSyncError = null; publishCommanderMessage(msg); } };
    render(); return;
  }
  if (res.value) world = res.value;
  lastSyncError = null; commanderMsgInput = ''; render();
}
async function publishRally(main, sec, split){
  if (!iAmCommander()) return;
  const key = dayKey(world.runId, 'activity', world.currentDay);
  const res = await mutateShared(key, (doc) => {
    const d = doc || { deployed:{}, rally:{cinder:null,surge:null,bloom:null} };
    if (d.rally && d.rally[profile.faction]) return null; // already published — don't clobber
    return { ...d, rally: { ...d.rally, [profile.faction]: { main, secondary: sec, split } } };
  });
  if (!res.ok){
    lastSyncError = { message: 'Your Rally failed to publish. Please retry.', retry: () => { lastSyncError = null; publishRally(main, sec, split); } };
    render();
    return;
  }
  lastSyncError = null;
  if (res.value) activityDoc = res.value;
  render();
}
// The energy slider's oninput event fires on every pixel of drag movement —
// potentially dozens of times per second. Writing to storage on every one of
// those was the actual cause of hitting the message rate limit. Now input
// only updates local state + re-renders (no network call) and debounces the
// real write; a slider "release" (onchange) always flushes immediately so
// nothing is lost if the tab closes right after.
let energySaveTimer = null;
function setEnergy(v){
  if (mystate.locked) return;
  mystate.energyToday = parseFloat(v);
  render();
  clearTimeout(energySaveTimer);
  energySaveTimer = setTimeout(persistMyState, 500);
}
function commitEnergy(v){
  if (mystate.locked) return;
  mystate.energyToday = parseFloat(v);
  clearTimeout(energySaveTimer);
  persistMyState();
  render();
}
async function persistMyState(){
  await safeSet(dayKey(world.runId, 'mystate', world.currentDay), mystate, false);
}
async function setGST(pct){
  if (mystate.locked) return;
  mystate.gstBoostPercent = pct;
  await safeSet(dayKey(world.runId, 'mystate', world.currentDay), mystate, false);
  render();
}

function mmss(sec){ sec = Math.max(0, sec); const m = Math.floor(sec/60).toString().padStart(2,'0'); const s = Math.floor(sec%60).toString().padStart(2,'0'); return `${m}:${s}`; }
function ownerBadge(owner){

function renderMap(){
  const tiles = TERRITORIES.map(t => {
    const owner = world.ownership[t]; const isActive = battlesDoc.activeBattles.includes(t);
    // A/C/G are Capitals structurally — that identity doesn't change just
    // because someone else captured the tile. (Previously this only lit up
    // while still held by the original owning faction, so the CAP badge
    // would misleadingly vanish the moment a Capital changed hands.)
    const cap = (t==='A'||t==='C'||t==='G');
    const bounty = getBountyLevel(world.holdDays[t]||0);
    const flash = flashTiles[t] ? 'flash' : '';

    const [gx,gy] = POS[t];

// Read-only mini-map for looking back at a past day's territory ownership —
// no click handlers, no active-battle pulsing, no bounty pips (those aren't
// preserved historically), just who owned what after that day's settlement.
function renderHistoryMap(ownership){
  const tiles = TERRITORIES.map(t => {
    const owner = ownership[t];
    const ownerClass = owner ? `owner-${owner}` : '';
    const [gx,gy] = POS[t];
    return `<div class="tile ${ownerClass}" style="grid-column:${gx+1}; grid-row:${gy+1}; cursor:default;">
      <span class="tid" style="font-size:10px; opacity:0.6;">${t}</span>
      <span class="tname">${territoryLabel(t)}</span>
    </div>`;
  }).join('');
  return `<div class="map-wrap"><div class="map-grid">${tiles}</div></div>`;
}
function phaseBanner(){
  if (world.phase === 'fog'){

// Advertised from DAY 1, not sprung as a surprise on day 7 — players only
// get to plan around the final showdown (securing an adjacent tile, saving

function kingmakerBanner(){
  const finalDay = CONFIG.roundDays;
  const isToday = isFinalDay(world.currentDay);
  const mult = CONFIG.finalDayKingmakerMultiplier;
  if (isToday){
    return `<div class="elim-banner" style="border-color:rgba(242,194,69,0.5); background:linear-gradient(135deg, rgba(242,194,69,0.16), rgba(242,194,69,0.02));">
      <div class="et" style="color:var(--gold);">🔥 FINAL DAY — ${territoryLabel('E').toUpperCase()} ×${mult}</div>

  }
  const daysLeft = finalDay - world.currentDay;
  return `<div class="card" style="padding:10px 14px; border-color:rgba(242,194,69,0.25);">
    <div class="muted" style="font-size:12px;">🔥 <b style="color:var(--gold);">Day ${finalDay} showdown:</b> ${territoryLabel('E')} will be worth ×${mult} VP and open to all teams — ${daysLeft} ${daysLeft===1?'day':'days'} away.</div>

}
function eliminatedBanner(){

/* ---------- TERRITORY MODAL ---------- */
function modalTerritory(t){
  const owner = world.ownership[t]; const isActive = battlesDoc.activeBattles.includes(t);
  const bLvl = getBountyLevel(world.holdDays[t]||0);
  const eligible = effectiveEligibleFactions(t, world.ownership, battlesDoc.activeBattles, world.currentDay);
  let statusMap = {};
  if (isActive && world.phase !== 'fog'){
    const powerMap = {};
    eligible.forEach(f => {
      const base = (battlesDoc.baseline[t] && battlesDoc.baseline[t][f]) || 0;
      const dep = (activityDoc.deployed[t] && activityDoc.deployed[t][f]) || 0;
      powerMap[f] = round2(base+dep);
    });
    statusMap = calculateBattleStatus(powerMap);
  }
  return `
  <div class="modal-backdrop" onclick="closeModalIfBackdrop(event)">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="card-title">BATTLE FOR ${territoryLabel(t)} ${t==='E'?'· HIGH-VALUE TERRITORY':''}</div>
      <div class="row-between" style="margin-bottom:10px;"><div>VP today: <b>${vpValueOf(t, world.currentDay)}</b>${t==='E'&&isFinalDay(world.currentDay)?` <span class="chip-small" style="color:var(--gold);">FINAL DAY ×${CONFIG.finalDayKingmakerMultiplier}</span>`:''}</div>${ownerBadge(owner)}</div>
      ${bLvl>0 ? `<div class="muted" style="margin-bottom:10px;">🎯 BOUNTY Lv${bLvl} — held ${world.holdDays[t]} days. Capture reward: +${bountyBonusVP(bLvl)} VP</div>` : ''}
      <div class="divider"></div>
      ${isActive ? `
        <div class="card-title">PARTICIPATING FACTIONS</div>
        ${eligible.map(f => {
          const m = FACTION_META[f]; const st = world.phase==='fog' ? null : statusMap[f];
          const notOwner = !factionOwnsAny(f, world.ownership);
          return `<div class="row-between" style="padding:6px 0;">
            <span><span class="dot" style="background:${m.color}"></span>${m.name}${notOwner?' <span class="chip-small">COMEBACK</span>':''}</span>
            ${world.phase==='fog' ? `<span class="chip-small">HIDDEN</span>` : statusPill(st)}
          </div>`;
        }).join('')}
        <div class="divider"></div>
        <div class="row-between" style="margin-bottom:12px;"><span class="muted">Status</span><span class="mono">${world.phase==='fog' ? 'FOG — awaiting resolve' : 'OPEN — awaiting resolve'}</span></div>
        <button class="btn btn-primary" onclick="closeModal(); goScreen('deploy'); prefillDeploy('${t}')" ${mystate.locked?'disabled':''}>
          ${mystate.locked ? 'POWER ALREADY DEPLOYED' : 'DEPLOY POWER HERE'}
        </button>
      ` : `<div class="empty-note">Not an active battle today.</div>`}
    </div>
  </div>`;
}

/* ---------- RUN ---------- */
function screenRun(){

  return `
  <div class="card">
    <div class="card-title">SIMULATE TODAY'S RUN</div>

    <div class="row-between" style="margin-top:6px;"><span><b>POWER EARNED</b></span><span class="big-num mono" style="font-size:22px;">⚡ ${fmt1(boosted)}</span></div>

    <div class="debug-grid">
      ${CONFIG.gstTiers.map(pct => `<div class="gst-tier ${mystate.gstBoostPercent===pct?'selected':''}" onclick="setGST(${pct})">${pct===0?'None':'+'+pct+'%'}</div>`).join('')}

/* ---------- DEPLOY ---------- */
let deployState = { main: null, secondary: null, splitIdx: 1 };
function prefillDeploy(t){ deployState.main = t; render(); }
function screenDeploy(){
  const avail = remainingPower();
  if (mystate.locked){
    return `<div class="card" style="text-align:center;">
      <div class="card-title">DEPLOYMENT LOCKED</div>
      <div class="muted">Power cannot be withdrawn after deployment.</div><div class="divider"></div>
      ${Object.entries(mystate.deployedPower).map(([t,p]) => `<div class="row-between"><span>${territoryLabel(t)}</span><span class="mono">⚡ ${fmt1(p)}</span></div>`).join('')}
    </div>`;
  }
  if (!battlesDoc.activeBattles.length) return `<div class="card"><div class="empty-note">No active battles to deploy to today.</div></div>`;

  const eliminated = iAmEliminated();
  const battles = eliminated
    ? battlesDoc.activeBattles
    : battlesDoc.activeBattles.filter(t => getEligibleFactions(t, world.ownership).includes(profile.faction));
  if (!battles.length) return `<div class="card"><div class="empty-note">Your faction has no eligible battles today (no adjacent access).</div></div>`;

  const main = deployState.main && battles.includes(deployState.main) ? deployState.main : battles[0];
  if (eliminated){
    const mainPower = avail;
    return `
    <div class="elim-banner"><div class="et">⚔ LAST STAND COMEBACK</div>
      <div class="muted" style="margin-top:4px;">Your faction holds no territory right now. Choose one open battle to attack (one target only — all your power goes there).</div></div>
    <div class="card">
      <div class="card-title">CHOOSE YOUR TARGET</div>
      ${battles.map(t => `<div class="terr-select ${main===t?'selected':''}" onclick="setDeployMain('${t}')">
        <div><b class="display">${territoryLabel(t)}</b> ${ownerBadge(world.ownership[t])}</div><div class="muted">${vpValueOf(t, world.currentDay)} VP</div></div>`).join('')}
    </div>
    <div class="card">
      <div class="row-between"><span>Available</span><span class="mono">${fmt1(avail)}</span></div>
      <div class="row-between"><span>${territoryLabel(main)} (all power)</span><span class="mono">⚡ ${fmt1(mainPower)}</span></div>
      <div class="divider"></div>
      <div class="muted" style="font-size:12px; margin-bottom:10px;">Deployment is final. Power cannot be withdrawn after deployment.</div>
      <button class="btn btn-primary" onclick="confirmDeploy('${main}', null, [100,0])" ${avail<=0?'disabled':''}>CONFIRM DEPLOYMENT</button>
    </div>`;
  }
  const secondaryOptions = battles.filter(t=>t!==main);
  const secondary = deployState.secondary && secondaryOptions.includes(deployState.secondary) ? deployState.secondary : null;
  const split = CONFIG.splitPresets[deployState.splitIdx];
  const mainPower = round2(avail*split[0]/100); const secPower = secondary ? round2(avail*split[1]/100) : 0;
  return `
  <div class="card"><div class="card-title">MAIN BATTLE</div>
    ${battles.map(t => `<div class="terr-select ${main===t?'selected':''}" onclick="setDeployMain('${t}')">
      <div><b class="display">${territoryLabel(t)}</b> ${ownerBadge(world.ownership[t])}</div><div class="muted">${vpValueOf(t, world.currentDay)} VP</div></div>`).join('')}
  </div>
  <div class="card"><div class="card-title">OPTIONAL SECONDARY BATTLE</div>
    <div class="terr-select ${!secondary?'selected':''}" onclick="setDeploySecondary(null)"><div>None — 100% to Main</div></div>
    ${secondaryOptions.map(t => `<div class="terr-select ${secondary===t?'selected':''}" onclick="setDeploySecondary('${t}')">
      <div><b class="display">${territoryLabel(t)}</b> ${ownerBadge(world.ownership[t])}</div><div class="muted">${vpValueOf(t, world.currentDay)} VP</div></div>`).join('')}
  </div>
  ${secondary ? `<div class="card"><div class="card-title">ALLOCATION SPLIT</div>
    <div class="debug-grid" style="grid-template-columns:1fr 1fr 1fr;">
      ${CONFIG.splitPresets.map((p,i) => `<div class="split-opt ${deployState.splitIdx===i?'selected':''}" onclick="setSplit(${i})">${p[0]}/${p[1]}</div>`).join('')}
    </div></div>` : ''}
  <div class="card"><div class="card-title">RESULT</div>
    <div class="row-between"><span>Available</span><span class="mono">${fmt1(avail)}</span></div>
    <div class="row-between"><span>${territoryLabel(main)} (Main)</span><span class="mono">⚡ ${fmt1(mainPower)}</span></div>
    ${secondary ? `<div class="row-between"><span>${territoryLabel(secondary)} (Secondary)</span><span class="mono">⚡ ${fmt1(secPower)}</span></div>` : ''}
    <div class="divider"></div>
    <div class="muted" style="font-size:12px; margin-bottom:10px;">Deployment is final. Power cannot be withdrawn after deployment.</div>
    <button class="btn btn-primary" onclick="confirmDeploy('${main}', ${secondary?`'${secondary}'`:null}, [${split[0]},${split[1]}])" ${avail<=0?'disabled':''}>CONFIRM DEPLOYMENT</button>
  </div>`;
}
function setDeployMain(t){ deployState.main = t; if(deployState.secondary===t) deployState.secondary=null; render(); }
function setDeploySecondary(t){ deployState.secondary = t; if(!t) deployState.splitIdx = 0; else if(deployState.splitIdx===0) deployState.splitIdx=1; render(); }
function setSplit(i){ deployState.splitIdx = i; render(); }
function confirmDeploy(main, sec, split){ deployPower(main, sec, split); deployState = {main:null, secondary:null, splitIdx:1}; }

/* ---------- RALLY ---------- */
let rallyPublishState = { main:null, secondary:null, splitIdx:1 };
let commanderMsgInput = '';
function screenRally(){
  if (world.rallyEnabled === false){
    return `<div class="card" style="text-align:center;">
      <div class="card-title">RALLY IS OFF</div>
      <div class="muted">The Commander/Rally feature is disabled for this round (an admin turned it off in the debug panel — handy when a faction only has one player, since Rally has no one to coordinate). Deploy your power directly from the Deploy tab instead.</div>
    </div>`;
  }
  const m = FACTION_META[profile.faction];
  const commander = (world.commanders || {})[profile.faction];
  const battles = battlesDoc.activeBattles.filter(t => effectiveEligibleFactions(t, world.ownership, battlesDoc.activeBattles, world.currentDay).includes(profile.faction));
  const msg = (world.commanderMessages || {})[profile.faction];

  // --- No commander elected for this round yet: show the nomination stand ---
  if (!commander){
    const nominees = (world.commanderNominees || {})[profile.faction] || [];
    const mine = myNomination();
    const eligible = isEligibleToNominate();
    const threshold = commanderEnergyThreshold();
    const streak = (seasonProgress && seasonProgress.commanderStreak) || 0;
    return `
    <div class="card">
      <div class="card-title">👑 COMMANDER ELECTION — ROUND ${world.round}</div>
      <div class="muted" style="line-height:1.6;">Commanders serve for the <b>whole round (7 days)</b>. Anyone in the top ${Math.round(CONFIG.commanderTopPercent*100)}% of ${m.name} by recent energy can stand. Highest recent energy among those who stand wins.</div>
    </div>
    <div class="card">
      <div class="card-title">STANDING FOR ELECTION (${nominees.length})</div>
      ${nominees.length ? nominees.slice().sort((a,b)=>b.energy-a.energy).map(n => `
        <div class="row-between" style="padding:5px 0;">
          <span>${n.name}${n.playerId===LOCAL_PLAYER_ID?' (you)':''}</span>
          <span class="mono">${fmt1(n.energy)} energy</span>
        </div>`).join('') : `<div class="empty-note">Nobody has stood yet.</div>`}
      <div class="divider"></div>
      <div class="muted" style="font-size:12px; margin-bottom:8px;">Your recent energy: <b class="mono">${fmt1(profile.recentEnergy||0)}</b> · Needed to stand: <b class="mono">${fmt1(threshold)}</b></div>
      ${streak >= CONFIG.commanderMaxConsecutiveRounds ? `<div class="muted" style="font-size:12px; color:var(--gold);">You've served ${streak} rounds in a row — sit this one out (max ${CONFIG.commanderMaxConsecutiveRounds}).</div>` : ''}
      ${mine ? `<div class="muted" style="text-align:center;">✅ You're standing. The winner is decided once elections resolve.</div>`
             : `<button class="btn btn-primary" onclick="nominateSelf()" ${!eligible?'disabled':''}>STAND FOR COMMANDER</button>`}
    </div>`;
  }

  const isMe = commander.playerId === LOCAL_PLAYER_ID;
  const rally = activityDoc.rally[profile.faction];

  const commanderCard = `
  <div class="rally-card" style="border-color:${m.color};">
    <div class="row-between" style="margin-bottom:6px;">
      <span class="display" style="color:${m.color}; font-weight:700; letter-spacing:1px;">👑 ${commander.name}${isMe?' (you)':''}</span>
      <span class="chip-small">ROUND ${world.round}</span>
    </div>
    <div class="muted" style="font-size:12px;">Record this round: ${world.commanderRecord[profile.faction].wins}W – ${world.commanderRecord[profile.faction].losses}L</div>
    ${msg && msg.text ? `<div class="divider"></div><div style="font-size:13px; line-height:1.5;">💬 ${msg.text}</div><div class="muted" style="font-size:11px; margin-top:4px;">— posted day ${msg.day}</div>` : ''}
  </div>`;

  // --- Commander's own view: message board + rally publishing ---
  if (isMe){
    const remaining = CONFIG.commanderMessageMaxChars - commanderMsgInput.length;
    const msgCard = `
    <div class="card">
      <div class="card-title">BROADCAST TO YOUR TEAM</div>
      <div class="muted" style="font-size:12px; margin-bottom:6px;">One short message your whole team sees. Update it any day of the round.</div>
      <input id="cmd-msg-input" class="name-input" maxlength="${CONFIG.commanderMessageMaxChars}" placeholder="e.g. Day 3: Blue left Find Satoshi thin — hit it tomorrow" value="${commanderMsgInput}" oninput="commanderMsgInput=this.value; updateCmdMsgCount();" />
      <div class="row-between" style="margin-top:6px;">
        <span class="muted" id="cmd-msg-count" style="font-size:11px;">${remaining} characters left</span>
        <button class="btn btn-primary btn-small" onclick="publishCommanderMessage(commanderMsgInput)" ${!commanderMsgInput.trim()?'disabled':''}>POST</button>
      </div>
    </div>`;

    if (!rally){
      if (!battles.length) return commanderCard + msgCard + `<div class="card"><div class="empty-note">No eligible battles to rally today.</div></div>`;
      const main = rallyPublishState.main && battles.includes(rallyPublishState.main) ? rallyPublishState.main : battles[0];
      const secOpts = battles.filter(t=>t!==main);
      const secondary = rallyPublishState.secondary && secOpts.includes(rallyPublishState.secondary) ? rallyPublishState.secondary : null;
      const split = CONFIG.splitPresets[rallyPublishState.splitIdx];
      return commanderCard + msgCard + `
      <div class="card"><div class="card-title">TODAY'S RALLY — MAIN TERRITORY</div>
        ${battles.map(t => `<div class="terr-select ${main===t?'selected':''}" onclick="rMain('${t}')"><div><b class="display">${territoryLabel(t)}</b> ${ownerBadge(world.ownership[t])}</div><div class="muted">${vpValueOf(t, world.currentDay)} VP</div></div>`).join('')}
      </div>
      <div class="card"><div class="card-title">SECONDARY (OPTIONAL)</div>
        <div class="terr-select ${!secondary?'selected':''}" onclick="rSec(null)">None</div>
        ${secOpts.map(t => `<div class="terr-select ${secondary===t?'selected':''}" onclick="rSec('${t}')"><div><b class="display">${territoryLabel(t)}</b></div></div>`).join('')}
      </div>
      ${secondary ? `<div class="card"><div class="card-title">SPLIT</div>
        <div class="debug-grid" style="grid-template-columns:1fr 1fr 1fr;">
          ${CONFIG.splitPresets.map((p,i)=>`<div class="split-opt ${rallyPublishState.splitIdx===i?'selected':''}" onclick="rSplit(${i})">${p[0]}/${p[1]}</div>`).join('')}
        </div></div>` : ''}
      <button class="btn btn-primary" onclick="doPublish('${main}', ${secondary?`'${secondary}'`:null}, [${split[0]},${split[1]}])">PUBLISH RALLY</button>`;
    }
    return commanderCard + msgCard + `<div class="card"><div class="empty-note">Today's rally is published and locked.</div></div>`;
  }

  // --- Normal player's view ---
  if (!rally){
    return commanderCard + `<div class="card"><div class="empty-note">${commander.name} hasn't published today's Rally yet — check back shortly.</div></div>`;
  }
  return commanderCard + `
  <div class="rally-card" style="border-color:${m.color};">
    <div class="display" style="color:${m.color}; font-weight:700; letter-spacing:1px; margin-bottom:8px;">TODAY'S RALLY</div>
    <div class="row-between"><span class="muted">MAIN</span><span><b>${territoryLabel(rally.main)}</b> — ${rally.split[0]}%</span></div>
    ${rally.secondary ? `<div class="row-between"><span class="muted">SUPPORT</span><span><b>${territoryLabel(rally.secondary)}</b> — ${rally.split[1]}%</span></div>` : ''}
    ${rally.auto ? `<div class="muted" style="font-size:11px; margin-top:6px;">(auto-generated)</div>` : ''}
  </div>

function screenHistory(){

  let mapSection = '';
  if (historyDay){
    if (historyLoading){
      mapSection = `<div class="card"><div class="empty-note">Loading Day ${historyDay}…</div></div>`;
    } else if (historyDoc && historyDoc.ownershipAfter){
      mapSection = `<div class="card">

async function dbgSimulateTeammate(){
  if (!battlesDoc.activeBattles.length) return;
  const t = battlesDoc.activeBattles[Math.floor(Math.random()*battlesDoc.activeBattles.length)];
  const key = dayKey(world.runId, 'activity', world.currentDay);
  let fresh = await safeGet(key, true); if (!fresh || fresh === STORAGE_RETRY_LATER) fresh = activityDoc;
  fresh.deployed[t] = fresh.deployed[t] || {};

  await safeSet(key, fresh, true); activityDoc = fresh; render();
}

function render(){
  try{ renderInner(); }
  catch(e){
    // A last-resort safety net: if literally anything else in render()
    // throws (a screen function, a modal, etc.), show that clearly instead
    // of silently leaving the page frozen and unresponsive to every
    // subsequent click — which is exactly what an uncaught throw here used
    // to do, with no visible sign anything had gone wrong.
    console.error('render() failed:', e);
    const root = document.getElementById('root');
    if (root){
      root.innerHTML = `<div style="padding:24px; color:#e7ecf3; font-family:sans-serif; background:#0a0d12; min-height:100vh; box-sizing:border-box;">
        <h3 style="color:#ff4d4d; margin-top:0;">Something broke while updating the screen</h3>
        <p style="opacity:0.85; font-size:13px; word-break:break-word;">${(e && e.message) ? e.message : 'Unknown error'}</p>
        <button class="btn btn-primary" style="margin-top:14px;" onclick="location.reload()">RELOAD</button>
        <p style="opacity:0.3; font-size:10px; font-family:monospace; margin-top:16px;">${APP_BUILD}</p>
      </div>`;
    }
  }
}

      <div class="muted" style="margin:10px 0 4px; font-size:12px;">anon public API key</div>
      <input class="name-input" placeholder="eyJhbGc..." value="${setupKeyInput}" oninput="setupKeyInput=this.value; updateSetupButtonState();" />
      <button id="setup-connect-btn" class="btn btn-primary" style="margin-top:16px;" onclick="submitSetupForm()" ${(!setupUrlInput.trim()||!setupKeyInput.trim())?'disabled':''}>SAVE & CONNECT</button>
      <div style="text-align:center; margin-top:14px; font-size:10px; opacity:0.35; font-family:monospace;">${APP_BUILD}</div>
    </div></div>`;
    return;
  }
  if (bootPhase === 'config_missing'){
    const brokenKeys = !!supabaseInitError;
    document.getElementById('root').innerHTML = `<div class="onboard-wrap"><div class="onboard-card">
      <div class="card-title" style="margin-bottom:8px; color:var(--danger);">SETUP NEEDED</div>
      <div class="display" style="font-size:18px; font-weight:700; margin-bottom:10px;">Your Supabase connection isn't working</div>
      <div class="muted" style="line-height:1.6;">
        ${brokenKeys
          ? `Connecting failed with: <br><code style="color:var(--danger); font-size:11px;">${supabaseInitError}</code><br><br>The saved Project URL or anon key looks malformed.`
          : `The Supabase library didn't load (check your internet connection and reload).`}
      </div>
      <button class="btn btn-outline" style="margin-top:16px;" onclick="forgetSupabaseConfig()">RE-ENTER SUPABASE DETAILS</button>
      <div style="text-align:center; margin-top:14px; font-size:10px; opacity:0.35; font-family:monospace;">${APP_BUILD}</div>
    </div></div>`;
    return;
  }
  if (bootPhase === 'loading'){
    document.getElementById('root').innerHTML = `<div class="loading-wrap">Connecting to the Run Kingdom world…<br><span style="font-size:10px; opacity:0.4; font-family:monospace;">${APP_BUILD}</span></div>`;
    return;
  }
  if (bootPhase === 'onboarding'){
    // renderSyncError() must be included here: without it, ANY failure during
    // join (bad schema, network, storage) produced a completely silent
    // no-op — the button looked dead with no explanation anywhere.
    document.getElementById('root').innerHTML = renderSyncError() + renderOnboarding();
    return;
  }
  if (dataStale){
    document.getElementById('root').innerHTML = `
      ${renderTopbar()}
      <div class="content"><div class="card" style="text-align:center;">
        <div class="card-title">SYNCING</div>
        <div class="muted">A new day just began — loading the new battlefield…</div>
      </div></div>
      ${renderBottomNav()}`;
    return;
  }
  let body = '';
  if (uiScreen === 'home') body = screenHome();
  else if (uiScreen === 'run') body = screenRun();
  else if (uiScreen === 'deploy') body = screenDeploy();
  else if (uiScreen === 'rally') body = screenRally();
  else if (uiScreen === 'report') body = screenReport();
  else if (uiScreen === 'season') body = screenSeason();
  else if (uiScreen === 'history') body = screenHistory();
  else body = screenHome();

  document.getElementById('root').innerHTML = `
    ${renderTopbar()}
    <div class="content">${renderSyncError()}${body}</div>
    ${renderBottomNav()}
    <div class="fab" onclick="toggleDebug()">⚙️</div>
    ${activeModal ? modalTerritory(activeModal) : ''}
    ${safeRenderDebug()}
  `;
}
// If renderDebug() itself throws for any reason, this stops it from taking
// the ENTIRE render() call down with it. Without this isolation, a single
// bad reference inside the debug panel's HTML would silently break every
// future render() call app-wide the moment debugOpen became true — meaning
// EVERY button anywhere (Resolve Day, Deploy, the gear icon itself, all of
// it) would stop visibly responding, since render() throwing partway through
// leaves the DOM frozen at whatever it looked like before the click, with
// no error shown. This was almost certainly the real cause behind "nothing
// works anymore after touching the gear icon".
function safeRenderDebug(){
  try{ return renderDebug(); }
  catch(e){
    console.error('renderDebug() failed — closing the debug panel so the rest of the app keeps working:', e);
    debugOpen = false;
    return '';
  }
}

/* =========================================================
   LOOPS + INIT
========================================================= */
function startLoops(){
  // No more real-time countdown to track locally — battle resolution is a
  // manual action now, so we only need the background poll to pick up
  // other players' moves (deploys, rallies, someone else resolving the day).
  scheduleNextPoll();
}
// Self-rescheduling (rather than setInterval) so a slow sync never overlaps
// with the next one, plus a random jitter per client so many people opening
// this at once don't all hit the storage backend in the same instant.
function scheduleNextPoll(){
  const jitter = Math.random() * 2000;
  setTimeout(async () => {
    try{ await syncAll(); render(); } finally { scheduleNextPoll(); }
  }, CONFIG.pollMs + jitter);
}
render();
boot();
</script>
</body>
</html>
