<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Run Kingdom Lite · Online Multiplayer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<!-- Supabase JS client (free tier) — this is what makes the multiplayer world persist and sync across everyone playing. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#0a0d12; --panel:#12161d; --panel-2:#181e27; --panel-3:#1f2631; --border:#252d3a;
  --text:#e7ecf3; --text-dim:#8894a6; --text-dim2:#5c6675;
  --cinder:#ff5a3c; --cinder-dim:#4a2318;
  --surge:#34aeff; --surge-dim:#123048;
  --bloom:#57d97a; --bloom-dim:#164027;
  --neutral:#3b4250; --neutral-dim:#1c212a;
  --gold:#f2c245; --danger:#ff4d4d; --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh;}
.mono{font-family:'Space Mono',monospace;}
.display{font-family:'Chakra Petch',sans-serif;}
#root{
  max-width:480px; margin:0 auto; min-height:100vh;
  background:radial-gradient(ellipse 600px 300px at 50% -10%, rgba(52,174,255,0.07), transparent), var(--bg);
  display:flex; flex-direction:column; position:relative;
  border-left:1px solid var(--border); border-right:1px solid var(--border);
}
.topbar{padding:14px 16px 10px; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:20;
  background:rgba(10,13,18,0.92); backdrop-filter:blur(6px);}
.topbar-row{display:flex; justify-content:space-between; align-items:baseline;}
.season-label{font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:12px; letter-spacing:2px; color:var(--text-dim);}
.day-label{font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:13px; letter-spacing:1px; color:var(--gold);}
.live-dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--bloom); margin-right:5px; animation:livePulse 1.6s ease-in-out infinite;}
@keyframes livePulse{0%,100%{opacity:1;} 50%{opacity:0.3;}}
.standings-row{display:flex; gap:10px; margin-top:8px;}
.standing-chip{flex:1; display:flex; align-items:center; justify-content:space-between; padding:6px 8px; border-radius:10px;
  font-family:'Space Mono',monospace; font-size:11px; border:1px solid var(--border); background:var(--panel);}
.standing-chip.me{box-shadow:0 0 0 1px currentColor inset;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block; margin-right:6px;}
.content{flex:1; padding:16px 16px 100px; overflow-y:auto;}
.card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:14px;}
.card-title{font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:12px; letter-spacing:2px; color:var(--text-dim);
  margin:0 0 10px; text-transform:uppercase;}
.big-num{font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:30px;}
.prize-box{background:linear-gradient(135deg, rgba(242,194,69,0.12), rgba(242,194,69,0.02)); border:1px solid rgba(242,194,69,0.35);
  border-radius:var(--radius); padding:14px 16px; margin-bottom:14px;}
.prize-label{font-family:'Chakra Petch',sans-serif; font-size:11px; letter-spacing:2px; color:var(--gold); font-weight:700;}
.prize-num{font-family:'Space Mono',monospace; font-size:24px; font-weight:700; color:var(--gold); margin-top:2px;}
.map-wrap{position:relative; margin:6px auto 4px; width:270px;}
.map-grid{display:grid; grid-template-columns:repeat(3,84px); grid-template-rows:repeat(3,84px); gap:9px; position:relative; z-index:2;}
.tile{border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer;
  position:relative; border:2px solid var(--neutral-dim); background:var(--neutral-dim);
  transition:background 0.6s ease, border-color 0.6s ease, transform 0.25s ease; color:var(--text);}
.tile:active{transform:scale(0.95);}
.tile .tid{font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:15px;}
.tile .tname{font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:10.5px; line-height:1.15; text-align:center; padding:0 4px; margin-top:2px;}
.tile .tvp{font-family:'Space Mono',monospace; font-size:10px; opacity:0.75; margin-top:2px;}
.tile.owner-cinder{background:linear-gradient(145deg, var(--cinder-dim), #2c140d); border-color:var(--cinder);}
.tile.owner-surge{background:linear-gradient(145deg, var(--surge-dim), #0d2032); border-color:var(--surge);}
.tile.owner-bloom{background:linear-gradient(145deg, var(--bloom-dim), #0e2718); border-color:var(--bloom);}
.tile .cap{position:absolute; top:4px; right:6px; font-size:9px; opacity:0.6; font-family:'Space Mono',monospace;}
.tile .bounty-pip{position:absolute; bottom:4px; left:6px; font-size:9px; font-family:'Space Mono',monospace; color:var(--gold);}
.tile.flash{animation:flashCap 0.9s ease;}
@keyframes flashCap{0%{transform:scale(1);} 35%{transform:scale(1.14); filter:brightness(1.8);} 100%{transform:scale(1); filter:brightness(1);}}
.tile.active-battle{animation:pulseBattle 1.3s ease-in-out infinite;}
@keyframes pulseBattle{
  0%,100%{box-shadow:0 0 0 2px rgba(242,194,69,0.3), 0 0 12px rgba(242,194,69,0.25); border-color:var(--gold);}
  50%{box-shadow:0 0 0 5px rgba(242,194,69,0.6), 0 0 26px rgba(242,194,69,0.65); border-color:#fff3cf;}
}
.btn{font-family:'Chakra Petch',sans-serif; font-weight:700; letter-spacing:0.5px; font-size:14px; border-radius:11px;
  border:none; padding:13px 18px; cursor:pointer; width:100%; transition:transform 0.15s ease, filter 0.15s ease;}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--gold); color:#171200;}
.btn-primary:disabled{background:#40403a; color:#7c7c72; cursor:not-allowed;}
.btn-outline{background:transparent; border:1px solid var(--border); color:var(--text);}
.btn-outline.selected{border-color:var(--gold); color:var(--gold); background:rgba(242,194,69,0.08);}
.btn-small{font-size:12px; padding:9px 12px; width:auto;}
.btn-row{display:flex; gap:8px;}
.btn-row .btn{flex:1;}
.bottomnav{position:sticky; bottom:0; z-index:20; display:flex; border-top:1px solid var(--border);
  background:rgba(10,13,18,0.96); backdrop-filter:blur(6px);}
.navitem{flex:1; text-align:center; padding:10px 4px 12px; cursor:pointer; color:var(--text-dim2);

.navitem .navicon{font-size:18px; display:block; margin-bottom:2px;}
.navitem.active{color:var(--gold); border-top-color:var(--gold);}
.pill{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:20px; font-family:'Space Mono',monospace;

.pill.leading{color:#1c3d1f; background:var(--bloom);}
.pill.close{color:#3d3512; background:var(--gold);}
.pill.behind{color:var(--text-dim); background:var(--panel-3); border-color:var(--border);}
.row-between{display:flex; justify-content:space-between; align-items:center;}
.muted{color:var(--text-dim); font-size:13px;}
.divider{height:1px; background:var(--border); margin:12px 0;}
input[type=range]{-webkit-appearance:none; width:100%; height:6px; border-radius:4px; background:var(--panel-3); outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:var(--gold);
  border:3px solid #171200; cursor:pointer; box-shadow:0 0 0 4px rgba(242,194,69,0.18);}
.fog-banner{background:linear-gradient(135deg, rgba(52,174,255,0.1), rgba(87,217,122,0.05)); border:1px solid var(--border);

.fog-banner .fogtitle{font-family:'Chakra Petch',sans-serif; font-weight:700; letter-spacing:2px; color:var(--surge); font-size:13px;}
.fog-timer{font-family:'Space Mono',monospace; font-size:26px; font-weight:700; margin-top:6px;}
.modal-backdrop{position:fixed; inset:0; background:rgba(6,8,11,0.75); z-index:50; display:flex; align-items:flex-end;
  justify-content:center; backdrop-filter:blur(3px);}
.modal-sheet{width:100%; max-width:480px; background:var(--panel); border-top-left-radius:22px; border-top-right-radius:22px;
  border:1px solid var(--border); border-bottom:none; padding:20px 18px 26px; max-height:88vh; overflow-y:auto; animation:sheetUp 0.25s ease;}
@keyframes sheetUp{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.modal-handle{width:36px; height:4px; background:var(--border); border-radius:3px; margin:0 auto 14px;}
.split-opt{border:1px solid var(--border); border-radius:10px; padding:10px; text-align:center; cursor:pointer;
  font-family:'Space Mono',monospace; font-size:13px;}
.split-opt.selected{border-color:var(--gold); color:var(--gold); background:rgba(242,194,69,0.08);}
.terr-select{display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border:1px solid var(--border);
  border-radius:10px; margin-bottom:8px; cursor:pointer;}
.terr-select.selected{border-color:var(--gold);}
.terr-select.disabled{opacity:0.35; cursor:not-allowed;}
.badge-owner{font-size:10px; padding:2px 7px; border-radius:20px; font-family:'Space Mono',monospace;}
.badge-cinder{background:var(--cinder-dim); color:var(--cinder);}
.badge-surge{background:var(--surge-dim); color:var(--surge);}
.badge-bloom{background:var(--bloom-dim); color:var(--bloom);}
.badge-neutral{background:var(--panel-3); color:var(--text-dim);}
.debug-drawer{position:fixed; inset:0 0 0 auto; width:88%; max-width:400px; background:var(--panel); z-index:60;
  border-left:1px solid var(--border); padding:18px; overflow-y:auto; animation:slideIn 0.2s ease;}
@keyframes slideIn{from{transform:translateX(20px); opacity:0;} to{transform:translateX(0); opacity:1;}}
.debug-backdrop{position:fixed; inset:0; background:rgba(6,8,11,0.6); z-index:59;}
.debug-section{margin-bottom:16px;}
.debug-section h4{font-family:'Chakra Petch',sans-serif; font-size:11px; letter-spacing:1.5px; color:var(--gold);
  margin:0 0 8px; text-transform:uppercase;}
.debug-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.fab{position:fixed; bottom:78px; right:calc(50% - 240px + 16px); z-index:30; width:44px; height:44px; border-radius:50%;
  background:var(--panel-3); border:1px solid var(--border); color:var(--text-dim); display:flex; align-items:center;
  justify-content:center; cursor:pointer; font-size:16px;}
@media (max-width:520px){ .fab{right:16px;} }
.energy-readout{text-align:center; padding:14px 0;}
.chip-small{font-size:10px; padding:3px 8px; border-radius:20px; background:var(--panel-3); color:var(--text-dim); font-family:'Space Mono',monospace;}
.rally-card{border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:12px;}
.gst-tier{border:1px solid var(--border); border-radius:9px; padding:8px; text-align:center; font-family:'Space Mono',monospace; font-size:12px; cursor:pointer;}
.gst-tier.selected{border-color:var(--gold); color:var(--gold); background:rgba(242,194,69,0.08);}
.empty-note{color:var(--text-dim2); font-size:12px; text-align:center; padding:10px;}
.elim-banner{background:linear-gradient(135deg, rgba(255,90,60,0.14), rgba(255,90,60,0.02)); border:1px solid rgba(255,90,60,0.4);
  border-radius:var(--radius); padding:14px; margin-bottom:14px; text-align:center;}
.elim-banner .et{font-family:'Chakra Petch',sans-serif; font-weight:700; letter-spacing:1px; color:var(--cinder); font-size:13px;}
.onboard-wrap{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px;}
.onboard-card{width:100%; max-width:400px; background:var(--panel); border:1px solid var(--border); border-radius:18px; padding:24px;}
.team-pick{display:flex; flex-direction:column; gap:10px; margin:14px 0;}
.team-opt{display:flex; align-items:center; gap:10px; padding:14px; border:2px solid var(--border); border-radius:12px; cursor:pointer;}
.team-opt.selected{border-color:var(--gold); background:rgba(242,194,69,0.06);}
.team-opt .swatch{width:20px; height:20px; border-radius:50%;}
.name-input{width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border); background:var(--panel-3);
  color:var(--text); font-family:'Inter',sans-serif; font-size:14px; margin-top:8px;}
.loading-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; color:var(--text-dim); font-family:'Chakra Petch',sans-serif;}
.sync-error{background:rgba(255,77,77,0.12); border:1px solid rgba(255,77,77,0.4); border-radius:12px; padding:12px 14px;
  margin-bottom:14px; font-size:13px;}
.sync-error .se-title{color:var(--danger); font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:12px; letter-spacing:1px; margin-bottom:4px;}
.sync-error .se-row{display:flex; gap:8px; margin-top:8px;}
</style>

<body>
<div id="root"></div>

<script>
/* =========================================================
   SUPABASE CONFIG
   You do NOT need to edit this file to set this up — that's on purpose.
   Editing HTML source with a rich-text editor (e.g. macOS TextEdit's
   default "rich text" mode, not its plain-text mode) is a common way to
   silently corrupt a file — smart quotes, stripped tags, etc. — with no
   error message at all, just a blank page. So instead: deploy this file
   completely unmodified, then open it and paste your Supabase Project URL
   and anon public key into the on-screen setup form the first time it
   loads. That gets saved safely in your browser (no file editing, ever).

   The two constants below are only an OPTIONAL advanced shortcut, for
   someone comfortable editing code who wants every visitor pre-configured
   without seeing the setup form. Leave them as-is if you're not sure.
========================================================= */
const SUPABASE_URL_HARDCODED = 'YOUR_SUPABASE_PROJECT_URL';
const SUPABASE_ANON_KEY_HARDCODED = 'YOUR_SUPABASE_ANON_PUBLIC_KEY';

// Safety net: if ANY unexpected error happens while the script is first
// loading — before the game has managed to render anything at all — show
// that error on screen instead of leaving a silent blank/black page. This
// is registered as early as possible, before any of the riskier setup code
// below (like connecting to Supabase) runs.
window.addEventListener('error', function(e){
  const root = document.getElementById('root');
  if (root && !root.innerHTML.trim()){
    const msg = (e && e.message) ? e.message : 'Unknown error';
    root.innerHTML = '<div style="padding:24px; color:#e7ecf3; font-family:sans-serif; background:#0a0d12; min-height:100vh; box-sizing:border-box;">'
      + '<h3 style="color:#ff4d4d; margin-top:0;">Something went wrong loading the game</h3>'
      + '<p style="opacity:0.85; font-size:13px; word-break:break-word;">' + msg + '</p>'
      + '<p style="opacity:0.6; font-size:12px;">Press F12 to see the full error in your browser console. If you hand-edited this file, try re-downloading a fresh copy instead of editing it — see the setup form / DEPLOYMENT_GUIDE.md.</p>'
      + '</div>';
  }
});

/* =========================================================
   RUN KINGDOM · CONFIG
========================================================= */
const CONFIG = {
  seed: 88172,
  seasonDays: 7,
  // Battle resolution is manual (any player can trigger it via the Resolve
  // Day button) rather than on a real-time countdown — this avoids many
  // clients' timers racing to hit the same deadline simultaneously, which
  // was contributing to storage rate-limit errors under multiplayer load.
  // Realtime (Postgres websocket push) is the primary sync mechanism now —
  // this poll is only a safety net for a missed realtime message, so it can
  // run much less often than it did in the Claude-artifact/polling-only version.
  pollMs: 20000,             // base polling interval (jitter added per-client below)
  heartbeatMs: 45000,        // how often we refresh our own "last seen" in the roster
  onlineWindowMs: 100000,    // someone counts as "online now" if seen within this window
  energy: { min: 0, max: 90, step: 0.2 }, // slider UI range; the power curve itself has no upper cap (see energyToPower)
  splitPresets: [[100,0],[75,25],[50,50]],
  maxActiveBattlesPerDay: 3,
  vpBase: { normal: 1, center: 2 },
  // Smoothed for a 7-day season: gentle 1.0 -> 2.0x ramp instead of big 1/2/3/4x jumps.
  vpMultiplier: (day) => day <= 2 ? 1.0 : day <= 4 ? 1.25 : day <= 6 ? 1.5 : 2.0,
  // Smoothed thresholds/rewards for a 7-day season — smaller, more gradual bonuses
  // instead of the steep +1/+2/+3 VP and 1.25x/1.5x/1.75x jumps.
  bountyThresholds: [
    { min: 2, max: 3, level: 1, bonus: 1,   mult: 1.15 },
    { min: 4, max: 5, level: 2, bonus: 1.5, mult: 1.3 },
    { min: 6, max: 999, level: 3, bonus: 2, mult: 1.5 },
  ],
  gstTiers: [0, 5, 10, 15, 20],
  gmtSplit: { prize: 0.80, burn: 0.14, protocol: 0.06 },
  rewardDistribution: { 1: 0.55, 2: 0.30, 3: 0.15 },
  poolSplit: { participation: 0.40, contribution: 0.60 },
  participationThreshold: 4, // rescaled down from 8/14 days for a 7-day season
  startingPrizePool: 4200,
  seasonEntryFeeGMT: 5,
  startingWalletGMT: 10000,
};

const FACTIONS = ['cinder','surge','bloom'];
const FACTION_META = {
  cinder: { name: 'Red Running Team', short: 'Red Team', emoji: '🔴', color: 'var(--cinder)' },
  surge:  { name: 'Blue Running Team', short: 'Blue Team', emoji: '🔵', color: 'var(--surge)' },
  bloom:  { name: 'Green Running Team', short: 'Green Team', emoji: '🟢', color: 'var(--bloom)' },
};
const TERRITORIES = ['A','B','C','D','E','F','G','H','I'];
const TERRITORY_NAMES = {
  A: 'Gilgamesh', B: 'Black Cat', C: 'Gas City',
  D: 'Satoshi Gate', E: '👑 Kingmaker', F: 'Moonbase',
  G: 'Genesis', H: 'Degen Hollow', I: 'The Wasteland',
};
const territoryLabel = (t) => TERRITORY_NAMES[t] || t;
const ADJ = {
  A:['B','D'], B:['A','C','E'], C:['B','F'],
  D:['A','E','G'], E:['B','D','F','H'], F:['C','E','I'],
  G:['D','H'], H:['E','G','I'], I:['F','H'],
};
const POS = { A:[0,0],B:[1,0],C:[2,0], D:[0,1],E:[1,1],F:[2,1], G:[0,2],H:[1,2],I:[2,2] };
const baseVPof = (t) => t === 'E' ? CONFIG.vpBase.center : CONFIG.vpBase.normal;

/* =========================================================
   PURE GAME LOGIC (deterministic — safe under concurrent writers)
========================================================= */
function clamp(n,min,max){ return Math.max(min, Math.min(max,n)); }
function round2(n){ return Math.round(n*100)/100; }

function energyToPower(energy){
  // Only the lower bound is clamped — negative energy makes no sense. There's
  // deliberately no upper clamp: if a real day's Energy sync ever reports
  // more than the slider's 90 max (e.g. an unusually long run), we keep
  // applying the same 75-90 tier rate (1 Power per 6 Energy) rather than
  // freezing the reward at the Energy=90 value.
  const e = Math.max(CONFIG.energy.min, energy);
  let p;
  if (e <= 20) p = e/2;
  else if (e <= 40) p = 10 + (e-20)/3;
  else if (e <= 60) p = 16.6667 + (e-40)/4;
  else if (e <= 75) p = 21.6667 + (e-60)/5;
  else p = 24.6667 + (e-75)/6;
  return round2(p);
}
function applyGSTBoost(power, pct){ if (power <= 0) return 0; return round2(power * (1 + pct/100)); }

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashSeed(str){
  let h = 1779033703 ^ str.length;
  for (let i=0;i<str.length;i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  return (h ^ h >>> 16) >>> 0;
}
function rngFor(...parts){ return mulberry32(hashSeed(parts.join('|') + '|' + CONFIG.seed)); }

function factionOwnsAny(f, ownership){ return TERRITORIES.some(t => ownership[t] === f); }

function isFrontline(t, ownership){
  const owner = ownership[t]; const neighbors = ADJ[t];
  if (!owner) return neighbors.some(n => ownership[n]);
  return neighbors.some(n => ownership[n] && ownership[n] !== owner);
}
function getEligibleFrontlines(ownership){ return TERRITORIES.filter(t => isFrontline(t, ownership)); }
function getEligibleFactions(t, ownership){
  const owner = ownership[t]; const set = new Set();
  if (owner) set.add(owner);
  ADJ[t].forEach(n => { if (ownership[n]) set.add(ownership[n]); });
  return [...set];
}
// Rule 3: if a faction owns zero territories, it may attack any of today's open battles (adjacency not required)
function effectiveEligibleFactions(t, ownership, activeBattles){
  const set = new Set(getEligibleFactions(t, ownership));
  if (activeBattles.includes(t)){
    FACTIONS.forEach(f => { if (!factionOwnsAny(f, ownership)) set.add(f); });
  }
  return [...set];
}
function getBountyLevel(holdDays){
  for (const b of CONFIG.bountyThresholds) if (holdDays >= b.min && holdDays <= b.max) return b.level;
  return 0;
}
function bountyMultiplier(level){ return level === 0 ? 1.0 : CONFIG.bountyThresholds[level-1].mult; }
function bountyBonusVP(level){ return level === 0 ? 0 : CONFIG.bountyThresholds[level-1].bonus; }

function weightedPickWithoutReplacement(items, n, rng){
  const pool = items.map(i => ({...i})); const picked = [];
  while (picked.length < n && pool.length){
    const total = pool.reduce((s,i)=>s+i.weight,0);
    let r = rng() * total; let idx = 0;
    for (; idx < pool.length; idx++){ r -= pool[idx].weight; if (r <= 0) break; }
    idx = Math.min(idx, pool.length-1);
    picked.push(pool[idx]); pool.splice(idx,1);
  }
  return picked;
}
function selectActiveBattles(day, ownership, holdDays, repHistory){
  const candidates = getEligibleFrontlines(ownership);
  if (!candidates.length) return [];
  const weighted = candidates.map(t => {
    const level = getBountyLevel(holdDays[t] || 0);
    const bMult = bountyMultiplier(level);
    const h = repHistory[t] || [];
    const last = h[h.length-1], prev = h[h.length-2];
    let rep = 1.0; if (last && prev) rep = 0.15; else if (last) rep = 0.5;
    return { t, weight: 1 * bMult * rep };
  });
  const rng = rngFor('battles', day);
  let picked = weightedPickWithoutReplacement(weighted, Math.min(CONFIG.maxActiveBattlesPerDay, weighted.length), rng);
  const coveredFactions = new Set();
  picked.forEach(p => getEligibleFactions(p.t, ownership).forEach(f => coveredFactions.add(f)));
  const missing = FACTIONS.filter(f => !coveredFactions.has(f));
  if (missing.length){
    const alt = weighted.filter(w => !picked.find(p=>p.t===w.t))
      .filter(w => getEligibleFactions(w.t, ownership).some(f => missing.includes(f)))
      .sort((a,b)=>b.weight-a.weight)[0];
    if (alt && picked.length){
      const lowIdx = picked.map((p,i)=>({i, w:p.weight})).sort((a,b)=>a.w-b.w)[0].i;
      picked[lowIdx] = alt;
    }
  }
  return picked.map(p => p.t);
}
function generateBaselinePower(day, territory, faction){
  const rng = rngFor('power', day, territory, faction);
  return Math.round(3200 + rng() * 8600); // background power from other NPC runners
}
function calculateBattleStatus(powerMap){
  const entries = Object.entries(powerMap);
  if (!entries.length) return {};
  const max = Math.max(...entries.map(e=>e[1])); const out = {};
  entries.forEach(([f,p]) => { out[f] = p===max ? 'LEADING' : (p >= max*0.9 ? 'CLOSE' : 'BEHIND'); });
  return out;
}
function resolveBattle(powerMap, currentOwner){
  const entries = Object.entries(powerMap);
  if (!entries.length) return { winner: currentOwner, tie: false };
  const max = Math.max(...entries.map(e=>e[1]));
  const top = entries.filter(([,p]) => p === max).map(([f]) => f);
  if (top.length > 1) return { winner: currentOwner, tie: true };
  return { winner: top[0], tie: false };
}
function calculateDailyVP(ownership, day){
  const mult = CONFIG.vpMultiplier(day); const totals = { cinder:0, surge:0, bloom:0 };
  TERRITORIES.forEach(t => { const o = ownership[t]; if (o) totals[o] += baseVPof(t); });
  FACTIONS.forEach(f => totals[f] = totals[f]*mult);
  return totals;
}

/* =========================================================
   STORAGE HELPERS (shared = cross-player world / personal = this browser only)
========================================================= */
function sleep(ms){ return new Promise(res => setTimeout(res, ms)); }

// ---- Supabase client ----
// All game data lives in one simple table: kv_store(key text primary key,
// value jsonb, updated_at timestamptz). See schema.sql for the exact setup.
// This mirrors the same get/set-by-key model the rest of the game already
// expects, so none of the game logic below had to change — only this layer.
//
// ---- Resolve Supabase config: saved in this browser > embedded in an
// invite link's URL params (first visit) > the optional hardcoded constants
// above. This is what lets deployment work with zero file editing.
function readSupabaseConfig(){
  try{
    const params = new URLSearchParams(location.search);
    const urlFromLink = params.get('sb_url');
    const keyFromLink = params.get('sb_key');
    if (urlFromLink && keyFromLink){
      localStorage.setItem('rk_supabase_url', urlFromLink);
      localStorage.setItem('rk_supabase_key', keyFromLink);
      // Tidy the address bar so the key doesn't linger visibly there.
      history.replaceState({}, '', location.pathname + location.hash);
    }
  } catch(e){ /* URLSearchParams/history not available in some contexts — ignore */ }

  const savedUrl = localStorage.getItem('rk_supabase_url');
  const savedKey = localStorage.getItem('rk_supabase_key');
  if (savedUrl && savedKey) return { url: savedUrl, key: savedKey };

  if (SUPABASE_URL_HARDCODED && SUPABASE_ANON_KEY_HARDCODED
      && !SUPABASE_URL_HARDCODED.startsWith('YOUR_') && !SUPABASE_ANON_KEY_HARDCODED.startsWith('YOUR_')){
    return { url: SUPABASE_URL_HARDCODED, key: SUPABASE_ANON_KEY_HARDCODED };
  }
  return null;
}

// IMPORTANT: createClient() can throw SYNCHRONOUSLY if the URL/key look
// malformed. Since this file is a single <script>, an uncaught synchronous
// throw here would stop the ENTIRE script before it ever reaches
// render()/boot() at the bottom — the page would just stay blank/black
// with no error shown. Wrapping this in try/catch turns that into a clear
// on-screen "couldn't connect" message instead.
let supabase = null;
let supabaseInitError = null;
let resolvedSupabaseConfig = readSupabaseConfig();
function connectSupabase(cfg){
  supabase = null; supabaseInitError = null;
  if (!cfg || typeof window.supabase === 'undefined') return;
  try{
    supabase = window.supabase.createClient(cfg.url, cfg.key);
  } catch(e){
    supabase = null;
    supabaseInitError = (e && e.message) ? e.message : String(e);
    console.error('Supabase client failed to initialize:', e);
  }
}
connectSupabase(resolvedSupabaseConfig);

function buildInviteLink(){
  if (!resolvedSupabaseConfig) return null;
  const base = location.origin + location.pathname;
  return `${base}?sb_url=${encodeURIComponent(resolvedSupabaseConfig.url)}&sb_key=${encodeURIComponent(resolvedSupabaseConfig.key)}`;
}
function forgetSupabaseConfig(){
  localStorage.removeItem('rk_supabase_url');
  localStorage.removeItem('rk_supabase_key');
  location.reload();
}

// ---- Local player identity ----
// This app is a real standalone website now (not a Claude artifact), so a
// normal browser localStorage id is the right tool for "who is this browser"
// — it's what scopes "personal" data (your own energy, wallet, progress)
// separately from the shared world everyone sees. Same browser = same
// identity across visits; a different browser/device gets a new one.
function getLocalPlayerId(){
  let id = localStorage.getItem('rk_player_id');
  if (!id){
    id = 'p_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
    localStorage.setItem('rk_player_id', id);
  }
  return id;
}
const LOCAL_PLAYER_ID = getLocalPlayerId();
function fullKey(key, shared){ return shared ? key : `personal:${LOCAL_PLAYER_ID}:${key}`; }

// Storage reads/writes occasionally hit a transient network or backend
// error, which is very different from "this key genuinely does not exist
// yet". Misreading a transient error as "missing" could make a caller
// overwrite real data another player already wrote. So we distinguish the
// two: only return null once we're sure the key is missing; return
// STORAGE_RETRY_LATER when unsure, so callers keep their cached copy and
// try again on the next sync instead of resetting shared state.
const STORAGE_RETRY_LATER = '__STORAGE_RETRY_LATER__';
async function safeGet(key, shared, attempts){
  attempts = attempts || 3;
  const k = fullKey(key, shared);
  for (let i = 0; i < attempts; i++){
    try{
      const { data, error } = await supabase.from('kv_store').select('value').eq('key', k).maybeSingle();
      if (error) throw error;
      return data ? data.value : null; // no row = genuinely missing, no retry needed
    } catch(e){
      if (i === attempts - 1){ console.warn('storage read hit an error, will retry next sync:', k, e); return STORAGE_RETRY_LATER; }
      await sleep(250 * (i+1));
    }
  }
}
async function safeSet(key, value, shared, attempts){
  attempts = attempts || 3;
  const k = fullKey(key, shared);
  let lastErr = null;
  for (let i = 0; i < attempts; i++){
    try{
      const { error } = await supabase.from('kv_store').upsert({ key: k, value, updated_at: new Date().toISOString() });
      if (error) throw error;
      return true;
    } catch(e){ lastErr = e; }
    if (i < attempts - 1) await sleep(300 * (i+1));
  }
  console.warn('storage write did not persist after retries (will retry on next action/sync):', k, lastErr);
  return null;
}
function dayKey(runId, suffix, day){ return `${runId}-${suffix}-${day}`; }

/* =========================================================
   WORLD LIFECYCLE
========================================================= */
function makeInitialWorld(){
  const ownership = { A:'cinder', B:null, C:'surge', D:null, E:null, F:null, G:'bloom', H:null, I:null };
  const holdDays = {}; TERRITORIES.forEach(t => holdDays[t] = ownership[t] ? 1 : 0);
  return {
    runId: 'r' + Math.random().toString(36).slice(2,8),
    currentDay: 1, phase: 'battles',
    ownership, holdDays, vp: { cinder:0, surge:0, bloom:0 },
    repHistory: Object.fromEntries(TERRITORIES.map(t=>[t,[]])),
    prizePool: CONFIG.startingPrizePool, gmtBurned: 0, protocolRevenue: 0,
    commanderRecord: { cinder:{wins:0,losses:0}, surge:{wins:0,losses:0}, bloom:{wins:0,losses:0} },
    rallyEnabled: true, // any player can turn this off from the debug panel — useful while testing with only 1 player per faction, where Rally has no one to coordinate
  };
}

async function ensureBattlesDoc(day){
  const key = dayKey(world.runId, 'battles', day);
  let doc = await safeGet(key, true);
  if (doc && doc !== STORAGE_RETRY_LATER) return doc;
  // Battle generation is a pure function (same inputs always produce the same
  // result), so recomputing it here after a transient read failure is safe —
  // it can't conflict with a copy another player already saved.
  doc = generateBattlesDocPure(day, world.ownership, world.holdDays, world.repHistory);
  await safeSet(key, doc, true);
  const updatedRepHistory = advanceRepHistory(world.repHistory, doc.activeBattles);
  // Only write 'world' again if repHistory actually needs updating (it may
  // already have been folded into the settlement write that created this day —
  // see settleCurrentDay — so this is normally a no-op, saving a write.)
  if (JSON.stringify(updatedRepHistory) !== JSON.stringify(world.repHistory)){
    world = { ...world, repHistory: updatedRepHistory };
    await safeSet('world', world, true);
  }
  return doc;
}
function generateBattlesDocPure(day, ownership, holdDays, repHistory){
  const activeBattles = selectActiveBattles(day, ownership, holdDays, repHistory);
  const baseline = {};
  activeBattles.forEach(t => {
    baseline[t] = {};
    effectiveEligibleFactions(t, ownership, activeBattles).forEach(f => {
      baseline[t][f] = generateBaselinePower(day, t, f);
    });
  });
  return { activeBattles, baseline };
}
function advanceRepHistory(repHistory, activeBattles){
  const out = {};
  TERRITORIES.forEach(t => { const arr = (repHistory[t]||[]).slice(); arr.push(activeBattles.includes(t)); out[t] = arr.slice(-2); });
  return out;
}
async function ensureActivityDoc(day){
  const key = dayKey(world.runId, 'activity', day);
  let doc = await safeGet(key, true);
  if (doc && doc !== STORAGE_RETRY_LATER) return doc;
  if (doc === STORAGE_RETRY_LATER){
    // Can't confirm whether another player already wrote deploy/rally data —
    // never overwrite with a blank doc. Keep whatever's cached in memory (if
    // any) and re-check on the next sync.
    return activityDoc || { deployed:{}, rally:{cinder:null,surge:null,bloom:null}, commander:{cinder:null,surge:null,bloom:null} };
  }
  doc = { deployed:{}, rally:{cinder:null,surge:null,bloom:null}, commander:{cinder:null,surge:null,bloom:null} };
  await safeSet(key, doc, true);
  return doc;
}
async function ensureMyState(day){
  const key = dayKey(world.runId, 'mystate', day);
  let doc = await safeGet(key, false);
  if (doc && doc !== STORAGE_RETRY_LATER) return doc;
  if (doc === STORAGE_RETRY_LATER){
    return mystate || { energyToday: round2(rngFor('energy', day, profile.name)()*60 + 6), gstBoostPercent: 0, locked: false, deployedPower: {}, followedRally: null };
  }
  doc = { energyToday: round2(rngFor('energy', day, profile.name)()*60 + 6), gstBoostPercent: 0, locked: false, deployedPower: {}, followedRally: null };
  await safeSet(key, doc, false);
  return doc;
}
async function ensureProgress(){
  const key = `${world.runId}-progress`;
  let doc = await safeGet(key, false);
  if (doc && doc !== STORAGE_RETRY_LATER) return doc;
  if (doc === STORAGE_RETRY_LATER){
    return progress || { participationDays: 0, seasonContributionPower: 0, contributionRank: Math.floor(20 + Math.random()*480), lastCountedDay: 0, gmtBalance: CONFIG.startingWalletGMT - CONFIG.seasonEntryFeeGMT, totalDonated: 0, paidEntryFee: true };
  }
  // First time we're seeing this player in this season (this runId) — this is
  // also the moment the mocked Season Entry fee is paid: everyone starts with
  // a mock 10,000 GMT balance and 5 GMT is deducted right away to join.
  const rankRng = rngFor('rank', profile.name, world.runId);
  doc = {
    participationDays: 0, seasonContributionPower: 0,
    contributionRank: Math.floor(20 + rankRng()*480), lastCountedDay: 0,
    gmtBalance: CONFIG.startingWalletGMT - CONFIG.seasonEntryFeeGMT,
    totalDonated: 0, paidEntryFee: true,
  };
  await safeSet(key, doc, false);
  return doc;
}

async function donateGMT(amount){
  amount = Math.round(amount);
  if (!progress || !world || amount <= 0 || amount > progress.gmtBalance) return;
  progress.gmtBalance = round2(progress.gmtBalance - amount);
  progress.totalDonated = round2((progress.totalDonated||0) + amount);
  await safeSet(`${world.runId}-progress`, progress, false);

  const fresh = await safeGet('world', true);
  const base = (fresh && fresh !== STORAGE_RETRY_LATER) ? fresh : world;
  const prizeAdd = Math.round(amount * CONFIG.gmtSplit.prize);
  const burnAdd = Math.round(amount * CONFIG.gmtSplit.burn);
  const protoAdd = amount - prizeAdd - burnAdd; // remainder, so the three parts always sum exactly to the donation
  const updated = { ...base, prizePool: base.prizePool + prizeAdd, gmtBurned: base.gmtBurned + burnAdd, protocolRevenue: base.protocolRevenue + protoAdd };
  const saved = await safeSet('world', updated, true);
  if (saved) world = updated;
  render();
}

/* =========================================================
   ROSTER — "who's playing" presence list
   One shared doc, keyed by player name, holding {faction, lastSeen}. We only
   write to it: once when you join, and afterward at most once every
   CONFIG.heartbeatMs (piggybacked on the regular poll, not a separate timer)
   — so a room full of people doesn't multiply into a write per person per
   poll. Everyone reads it every poll cycle (one cheap GET) to show a live
   headcount.
========================================================= */
let roster = null;
let lastHeartbeatAt = 0;

async function joinRoster(){
  const key = `${world.runId}-roster`;
  const fresh = await safeGet(key, true);
  const base = (fresh && fresh !== STORAGE_RETRY_LATER) ? fresh : (roster || {});
  base[profile.name] = { faction: profile.faction, lastSeen: Date.now() };
  const saved = await safeSet(key, base, true);
  if (saved) { roster = base; lastHeartbeatAt = Date.now(); }
}
async function refreshRoster(){
  const key = `${world.runId}-roster`;
  const fresh = await safeGet(key, true);
  if (fresh && fresh !== STORAGE_RETRY_LATER) roster = fresh;
  // Heartbeat: only write if it's actually been a while, and only touch our
  // own entry (read-modify-write against whatever we just fetched).
  if (Date.now() - lastHeartbeatAt > CONFIG.heartbeatMs){
    const base = roster ? {...roster} : {};
    base[profile.name] = { faction: profile.faction, lastSeen: Date.now() };
    const saved = await safeSet(key, base, true);
    if (saved){ roster = base; lastHeartbeatAt = Date.now(); }
  }
}
function rosterStats(){
  if (!roster) return { total: 0, online: 0, byFaction: {cinder:0,surge:0,bloom:0}, onlineByFaction: {cinder:0,surge:0,bloom:0}, entries: [] };
  const now = Date.now();
  const entries = Object.entries(roster).map(([name, r]) => ({ name, faction: r.faction, online: (now - r.lastSeen) <= CONFIG.onlineWindowMs }));
  const byFaction = {cinder:0,surge:0,bloom:0}, onlineByFaction = {cinder:0,surge:0,bloom:0};
  let online = 0;
  entries.forEach(e => {
    if (byFaction[e.faction] !== undefined) byFaction[e.faction]++;
    if (e.online){ online++; if (onlineByFaction[e.faction] !== undefined) onlineByFaction[e.faction]++; }
  });
  entries.sort((a,b) => (b.online - a.online) || a.name.localeCompare(b.name));
  return { total: entries.length, online, byFaction, onlineByFaction, entries };
}

async function enterWorld(){
  world = await safeGet('world', true);
  // If this was just a transient read failure, wait and re-check before
  // concluding the world doesn't exist — otherwise we'd spin up a duplicate world.
  for (let i = 0; i < 3 && world === STORAGE_RETRY_LATER; i++){ await sleep(700); world = await safeGet('world', true); }
  if (!world || world === STORAGE_RETRY_LATER){
    world = makeInitialWorld();
    await safeSet('world', world, true);
    const check = await safeGet('world', true);
    if (check && check !== STORAGE_RETRY_LATER) world = check;
  }
  await syncAll();
  await joinRoster(); // announce ourselves once so we show up for others right away
  bootPhase = 'ready';
  render();
  startLoops();
  startRealtime();
}

/* =========================================================
   REALTIME — push updates instead of frequent polling
   Supabase's free tier includes Postgres realtime (a websocket that tells us
   the instant any row in kv_store changes). This is what actually makes
   this version "more stable" than polling a shared store: other players'
   moves show up within a second or two, and we don't need to hammer the
   database every few seconds to find out what changed. The regular poll
   loop (scheduleNextPoll) is kept, just at a much slower cadence, purely as
   a safety net in case a realtime message is ever missed (e.g. a brief
   disconnect).
========================================================= */
let realtimeChannel = null;
function startRealtime(){
  if (!supabase || realtimeChannel) return;
  realtimeChannel = supabase
    .channel('kv-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'kv_store' }, handleRealtimeChange)
    .subscribe();
}
function handleRealtimeChange(payload){
  const row = payload.new && payload.new.key ? payload.new : payload.old;
  if (!row || !row.key || !world) return;
  const key = row.key;
  const value = payload.new ? payload.new.value : null;
  // Only react to keys relevant to the season we're currently in — ignore
  // everyone else's personal keys and any leftover data from old runIds.
  if (key === 'world'){
    if (value) { world = value; render(); }
    return;
  }
  if (!key.startsWith(world.runId + '-')) return;
  if (key === dayKey(world.runId, 'activity', world.currentDay)){
    if (value) { activityDoc = value; render(); }
  } else if (key === dayKey(world.runId, 'battles', world.currentDay)){
    if (value) { battlesDoc = value; render(); }
  } else if (key === `${world.runId}-roster`){
    if (value) { roster = value; render(); }
  } else if (key.startsWith(dayKey(world.runId, 'settlement', ''))){
    // A new day just got settled somewhere else — re-sync everything (new
    // day's battles/activity docs, updated world) rather than trying to
    // patch every field by hand.
    syncAll().then(render);
  }
}

let cachedDocsForDay = null; // day number that battlesDoc/mystate were last loaded for
let settlementFetchedForDay = null; // reportDay we last fetched settlementDoc for
let progressLoaded = false;

async function syncAll(){
  const fresh = await safeGet('world', true);
  if (fresh && fresh !== STORAGE_RETRY_LATER) world = fresh;
  const day = world.currentDay;

  // battlesDoc and mystate only change when the day itself changes (both are
  // written once per day by this client's own actions or the settlement
  // flow), so there's no need to re-fetch them from storage on every poll —
  // that was a large, mostly-wasted share of our storage call volume.
  const dayChanged = cachedDocsForDay !== day;
  if (dayChanged || !battlesDoc) battlesDoc = await ensureBattlesDoc(day);
  if (dayChanged || !mystate) mystate = await ensureMyState(day);
  cachedDocsForDay = day;

  // activityDoc is the one thing other players actively write to throughout
  // the day, so it's the one worth polling every cycle.
  activityDoc = await ensureActivityDoc(day);

  const reportDay = world.phase === 'seasonEnd' ? day : day - 1;
  if (reportDay >= 1 && (settlementFetchedForDay !== reportDay || !settlementDoc)){
    const fetchedSettlement = await safeGet(dayKey(world.runId, 'settlement', reportDay), true);
    if (fetchedSettlement !== STORAGE_RETRY_LATER){ settlementDoc = fetchedSettlement; settlementFetchedForDay = reportDay; }
  } else if (reportDay < 1){
    settlementDoc = null;
  }

  // progress is only ever written by this account, so we only need to load
  // it once per session; reconcileProgress() updates the in-memory copy and
  // persists changes itself, no need to re-GET it every poll.
  if (!progressLoaded){ progress = await ensureProgress(); progressLoaded = true; }

  await refreshRoster();
  await autoFallbackRally(day);
  await reconcileProgress();
}

async function autoFallbackRally(day){
  if (world.rallyEnabled === false) return; // Rally turned off for this season
  if (world.phase !== 'fog') return;
  let changed = false;
  for (const f of FACTIONS){
    if (!activityDoc.rally[f]){
      const myBattles = battlesDoc.activeBattles.filter(t => effectiveEligibleFactions(t, world.ownership, battlesDoc.activeBattles).includes(f));
      if (!myBattles.length) continue;
      const rng = rngFor('rally', day, f);
      const scored = myBattles.map(t => ({ t, score: baseVPof(t)*2 + bountyMultiplier(getBountyLevel(world.holdDays[t]||0))*3 + rng() }));
      scored.sort((a,b)=>b.score-a.score);
      const main = scored[0].t; const secondary = scored[1] ? scored[1].t : null;
      activityDoc.rally[f] = { main, secondary, split: secondary ? [75,25] : [100,0], auto: true };
      changed = true;
    }
  }
  if (changed) await safeSet(dayKey(world.runId, 'activity', day), activityDoc, true);
}

async function reconcileProgress(){
  const doneUpTo = world.phase === 'seasonEnd' ? world.currentDay : world.currentDay - 1;
  if (doneUpTo <= progress.lastCountedDay) return;
  let changed = false;
  for (let d = progress.lastCountedDay+1; d <= doneUpTo; d++){
    const m = await safeGet(dayKey(world.runId, 'mystate', d), false);
    if (m && m.locked){
      progress.participationDays += 1;
      progress.seasonContributionPower = round2(progress.seasonContributionPower + Object.values(m.deployedPower||{}).reduce((a,b)=>a+b,0));
      changed = true;
    }
    progress.lastCountedDay = d;
    changed = true;
  }
  if (changed) await safeSet(`${world.runId}-progress`, progress, false);
}

/* =========================================================
   MANUAL PHASE CONTROLS
   Battle resolution used to run on a real-time countdown, which meant every
   connected client's timer converged on the exact same deadline — the
   single biggest source of simultaneous storage writes, and the main
   trigger behind rate-limit errors under real multiplayer load. Now both
   entering Fog and resolving the day are explicit actions any player can
   take, so a write only happens when a person actually clicks something.
========================================================= */
async function enterFogManually(){
  if (inFlightFogToggle || !world || world.phase !== 'battles') return;
  inFlightFogToggle = true;
  try{
    const fresh = await safeGet('world', true);
    if (!fresh || fresh === STORAGE_RETRY_LATER) return;
    if (fresh.phase === 'battles'){
      fresh.phase = 'fog';
      await safeSet('world', fresh, true);
    }
    world = fresh;
  } finally { inFlightFogToggle = false; render(); }
}
async function resolveDayManually(){
  if (inFlightResolve || !world) return;
  if (world.phase === 'seasonEnd') return;
  inFlightResolve = true;
  try{
    const fresh = await safeGet('world', true);
    if (fresh && fresh !== STORAGE_RETRY_LATER) world = fresh;
    if (world.phase === 'seasonEnd') return;
    await settleCurrentDay();
  } finally { inFlightResolve = false; render(); }
}

async function settleCurrentDay(){
  const day = world.currentDay;
  const sKey = dayKey(world.runId, 'settlement', day);
  let sDoc = await safeGet(sKey, true);
  if (sDoc === STORAGE_RETRY_LATER) return; // Can't confirm whether this day was already settled — skip this cycle, try again next tick
  if (sDoc){ settlementDoc = sDoc; await advanceAfterExternalSettlement(); return; }

  let bDoc = await safeGet(dayKey(world.runId, 'battles', day), true);
  if (!bDoc || bDoc === STORAGE_RETRY_LATER) bDoc = battlesDoc;
  let aDoc = await safeGet(dayKey(world.runId, 'activity', day), true);
  if (!aDoc || aDoc === STORAGE_RETRY_LATER) aDoc = activityDoc;

  const results = []; const newOwnership = {...world.ownership}; const rallyResults = {};
  bDoc.activeBattles.forEach(t => {
    const eff = effectiveEligibleFactions(t, world.ownership, bDoc.activeBattles);
    const powerMap = {};
    eff.forEach(f => {
      const base = (bDoc.baseline[t] && bDoc.baseline[t][f]) || 0;
      const dep = (aDoc.deployed[t] && aDoc.deployed[t][f]) || 0;
      powerMap[f] = round2(base + dep);
    });
    const prevOwner = world.ownership[t];
    const { winner, tie } = resolveBattle(powerMap, prevOwner);
    const prevHold = world.holdDays[t] || 0;
    let bonusVP = 0;
    if (winner !== prevOwner && winner) bonusVP = bountyBonusVP(getBountyLevel(prevHold));
    results.push({ t, powerMap, prevOwner, winner, tie, bonusVP });
    newOwnership[t] = winner;
    FACTIONS.forEach(f => {
      const r = aDoc.rally[f];
      if (r && (r.main === t || r.secondary === t)){
        rallyResults[f] = rallyResults[f] || {};
        const captured = winner === f;
        if (r.main === t) rallyResults[f].main = { t, captured }; else rallyResults[f].secondary = { t, captured };
      }
    });
  });

  const newHoldDays = {...world.holdDays};
  bDoc.activeBattles.forEach(t => {
    const r = results.find(x=>x.t===t);
    if (r.winner !== r.prevOwner && r.winner) newHoldDays[t] = 1;
    else if (r.winner === r.prevOwner && r.winner) newHoldDays[t] = (world.holdDays[t]||0) + 1;
    else newHoldDays[t] = 0;
  });
  TERRITORIES.forEach(t => { if (!bDoc.activeBattles.includes(t) && world.ownership[t]) newHoldDays[t] = (world.holdDays[t]||0) + 1; });

  const vpGained = calculateDailyVP(newOwnership, day);
  const newVp = {...world.vp};
  FACTIONS.forEach(f => newVp[f] = round2(newVp[f] + vpGained[f]));
  results.forEach(r => { if (r.bonusVP > 0 && r.winner) newVp[r.winner] = round2(newVp[r.winner] + r.bonusVP); });

  const rng = rngFor('economy', day);
  const spend = Math.round(800 + rng()*2600);
  const prizeAdd = Math.round(spend*CONFIG.gmtSplit.prize), burnAdd = Math.round(spend*CONFIG.gmtSplit.burn), protoAdd = Math.round(spend*CONFIG.gmtSplit.protocol);

  const newCommanderRecord = JSON.parse(JSON.stringify(world.commanderRecord));
  Object.entries(rallyResults).forEach(([f,rr]) => {
    if (rr.main){ if (rr.main.captured) newCommanderRecord[f].wins++; else newCommanderRecord[f].losses++; }
  });

  sDoc = { results, vpGained, rallyResults, commanderNames: aDoc.commander, settledAt: Date.now(), ownershipAfter: newOwnership };
  await safeSet(sKey, sDoc, true);
  settlementDoc = sDoc;

  const seasonDone = day >= CONFIG.seasonDays;
  const nextDay = seasonDone ? day : day + 1;

  // Precompute next day's battles + the resulting repHistory here, and fold
  // repHistory into the SAME 'world' write below. This avoids a second
  // 'world' write immediately after this one (which is what was happening
  // right at the day rollover and made that moment the most write-heavy,
  // highest-contention point in the whole cycle).
  let nextBattlesDoc = null;
  let nextRepHistory = world.repHistory;
  if (!seasonDone){
    nextBattlesDoc = generateBattlesDocPure(nextDay, newOwnership, newHoldDays, world.repHistory);
    nextRepHistory = advanceRepHistory(world.repHistory, nextBattlesDoc.activeBattles);
  }

  world = {
    ...world, ownership: newOwnership, holdDays: newHoldDays, vp: newVp, repHistory: nextRepHistory,
    prizePool: world.prizePool + prizeAdd, gmtBurned: world.gmtBurned + burnAdd, protocolRevenue: world.protocolRevenue + protoAdd,
    commanderRecord: newCommanderRecord,
    currentDay: nextDay,
    phase: seasonDone ? 'seasonEnd' : 'battles',
  };
  await safeSet('world', world, true);
  if (nextBattlesDoc){
    // Write the next day's battles doc now, under its final key, so the
    // upcoming ensureBattlesDoc() call in syncAll() finds it already there
    // and doesn't need to generate + write it again.
    await safeSet(dayKey(world.runId, 'battles', nextDay), nextBattlesDoc, true);
  }

  flashTiles = {}; results.forEach(r => { if (r.winner !== r.prevOwner) flashTiles[r.t] = true; });

  if (!seasonDone){ await syncAll(); } else { computeSeasonResult(); }
}
async function advanceAfterExternalSettlement(){
  const fresh = await safeGet('world', true);
  if (fresh && fresh !== STORAGE_RETRY_LATER) world = fresh;
  await syncAll();
  if (world.phase === 'seasonEnd') computeSeasonResult();
}

const RANK_TITLES = { 1: 'Champion', 2: 'Runner-Up', 3: 'Second Runner-Up' };
function computeSeasonResult(){
  const standings = FACTIONS.map(f => ({ f, vp: world.vp[f] })).sort((a,b)=>b.vp-a.vp);
  const ranks = {}; standings.forEach((s,i)=>ranks[s.f]=i+1);
  const myRank = ranks[profile.faction];
  const share = CONFIG.rewardDistribution[myRank] || 0;
  const factionPool = Math.round(world.prizePool * share);
  const participationPool = Math.round(factionPool * CONFIG.poolSplit.participation);
  const contributionPool = factionPool - participationPool;
  const eligible = progress.participationDays >= CONFIG.participationThreshold;
  const estReward = eligible
    ? Math.round(participationPool/850 + contributionPool * (progress.seasonContributionPower / (progress.seasonContributionPower*300 + 40000)))
    : 0;
  const rankTitle = RANK_TITLES[myRank] || null;
  seasonResult = {
    standings, myRank, factionPool, estReward, eligible,
    badge: (eligible && rankTitle) ? `${FACTION_META[profile.faction].name} S01 ${rankTitle} Badge` : null,
    stepnVip: eligible && !!rankTitle,
    sneakerDesign: (eligible && rankTitle) ? rankTitle : null,
  };
}

/* =========================================================
   PLAYER ACTIONS
========================================================= */
function computeAvailablePower(){ return applyGSTBoost(energyToPower(mystate.energyToday), mystate.gstBoostPercent); }
function totalDeployedMine(){ return Object.values(mystate.deployedPower).reduce((a,b)=>a+b,0); }
function remainingPower(){ return round2(computeAvailablePower() - totalDeployedMine()); }
function iAmEliminated(){ return !factionOwnsAny(profile.faction, world.ownership); }

async function deployPower(mainT, secT, splitPct){
  if (mystate.locked) return;
  const avail = remainingPower();
  const [mp, sp] = splitPct;
  const mainPower = round2(avail * mp/100);
  const secPower = secT ? round2(avail * sp/100) : 0;

  // Try writing to shared battle data first; only lock deployment locally
  // once that write succeeds, to avoid "looks deployed on my screen but no
  // one else can see it" inconsistency.
  const activityKey = dayKey(world.runId, 'activity', world.currentDay);
  const fresh = await safeGet(activityKey, true) || activityDoc;
  fresh.deployed[mainT] = fresh.deployed[mainT] || {};
  fresh.deployed[mainT][profile.faction] = round2((fresh.deployed[mainT][profile.faction]||0) + mainPower);
  if (secT){
    fresh.deployed[secT] = fresh.deployed[secT] || {};
    fresh.deployed[secT][profile.faction] = round2((fresh.deployed[secT][profile.faction]||0) + secPower);
  }
  const sharedOk = await safeSet(activityKey, fresh, true);
  if (!sharedOk){
    lastSyncError = { message: 'Your deployment did not sync to the shared battle. Please retry (your energy and choices are not lost).', retry: () => { lastSyncError = null; deployPower(mainT, secT, splitPct); } };
    render();
    return;
  }
  activityDoc = fresh;

  mystate.deployedPower[mainT] = round2((mystate.deployedPower[mainT]||0) + mainPower);
  if (secT) mystate.deployedPower[secT] = round2((mystate.deployedPower[secT]||0) + secPower);
  mystate.locked = true;
  const personalOk = await safeSet(dayKey(world.runId, 'mystate', world.currentDay), mystate, false);
  if (!personalOk){
    lastSyncError = { message: 'Your deployment counted toward the battle, but your personal record failed to save. It will retry automatically.', retry: () => { lastSyncError = null; safeSet(dayKey(world.runId,'mystate',world.currentDay), mystate, false).then(render); } };
  } else {
    lastSyncError = null;
  }
  uiScreen = 'home';
  render();
}
async function followRally(){
  if (mystate.locked) return;
  const r = activityDoc.rally[profile.faction];
  if (!r) return;
  mystate.followedRally = true;
  await deployPower(r.main, r.secondary, r.split);
}
async function claimCommander(){
  const key = dayKey(world.runId, 'activity', world.currentDay);
  let fresh = await safeGet(key, true); if (!fresh || fresh === STORAGE_RETRY_LATER) fresh = activityDoc;
  if (!fresh.commander[profile.faction]){
    fresh.commander[profile.faction] = profile.name;
    const ok = await safeSet(key, fresh, true);
    if (!ok){
      lastSyncError = { message: 'Claiming Commander did not sync. Please retry.', retry: () => { lastSyncError = null; claimCommander(); } };
      render();
      return;
    }
    lastSyncError = null;
  }
  activityDoc = await safeGet(key, true) || fresh;
  render();
}
async function publishRally(main, sec, split){
  const key = dayKey(world.runId, 'activity', world.currentDay);
  let fresh = await safeGet(key, true); if (!fresh || fresh === STORAGE_RETRY_LATER) fresh = activityDoc;
  if (fresh.commander[profile.faction] !== profile.name) { activityDoc = fresh; render(); return; }
  if (fresh.rally[profile.faction]) { activityDoc = fresh; render(); return; }
  fresh.rally[profile.faction] = { main, secondary: sec, split };
  const ok = await safeSet(key, fresh, true);
  if (!ok){
    lastSyncError = { message: 'Your Rally failed to publish. Please retry.', retry: () => { lastSyncError = null; publishRally(main, sec, split); } };
    render();
    return;
  }
  lastSyncError = null;
  activityDoc = fresh;
  render();
}
// The energy slider's oninput event fires on every pixel of drag movement —
// potentially dozens of times per second. Writing to storage on every one of
// those was the actual cause of hitting the message rate limit. Now input
// only updates local state + re-renders (no network call) and debounces the
// real write; a slider "release" (onchange) always flushes immediately so
// nothing is lost if the tab closes right after.
let energySaveTimer = null;
function setEnergy(v){
  if (mystate.locked) return;
  mystate.energyToday = parseFloat(v);
  render();
  clearTimeout(energySaveTimer);
  energySaveTimer = setTimeout(persistMyState, 500);
}
function commitEnergy(v){
  if (mystate.locked) return;
  mystate.energyToday = parseFloat(v);
  clearTimeout(energySaveTimer);
  persistMyState();
  render();
}
async function persistMyState(){
  await safeSet(dayKey(world.runId, 'mystate', world.currentDay), mystate, false);
}
async function setGST(pct){
  if (mystate.locked) return;
  mystate.gstBoostPercent = pct;

}

/* ---------- RUN ---------- */

/* ---------- DEPLOY ---------- */
let deployState = { main: null, secondary: null, splitIdx: 1 };
function prefillDeploy(t){ deployState.main = t; render(); }
function screenDeploy(){
  const avail = remainingPower();
  if (mystate.locked){
    return `<div class="card" style="text-align:center;">
      <div class="card-title">DEPLOYMENT LOCKED</div>
      <div class="muted">Power cannot be withdrawn after deployment.</div><div class="divider"></div>
      ${Object.entries(mystate.deployedPower).map(([t,p]) => `<div class="row-between"><span>${territoryLabel(t)}</span><span class="mono">⚡ ${fmt1(p)}</span></div>`).join('')}
    </div>`;
  }
  if (!battlesDoc.activeBattles.length) return `<div class="card"><div class="empty-note">No active battles to deploy to today.</div></div>`;

  const eliminated = iAmEliminated();
  const battles = eliminated
    ? battlesDoc.activeBattles
    : battlesDoc.activeBattles.filter(t => getEligibleFactions(t, world.ownership).includes(profile.faction));
  if (!battles.length) return `<div class="card"><div class="empty-note">Your faction has no eligible battles today (no adjacent access).</div></div>`;

  const main = deployState.main && battles.includes(deployState.main) ? deployState.main : battles[0];
  if (eliminated){
    const mainPower = avail;
    return `
    <div class="elim-banner"><div class="et">⚔ LAST STAND COMEBACK</div>
      <div class="muted" style="margin-top:4px;">Your faction holds no territory right now. Choose one open battle to attack (one target only — all your power goes there).</div></div>
    <div class="card">
      <div class="card-title">CHOOSE YOUR TARGET</div>
      ${battles.map(t => `<div class="terr-select ${main===t?'selected':''}" onclick="setDeployMain('${t}')">
        <div><b class="display">${territoryLabel(t)}</b> ${ownerBadge(world.ownership[t])}</div><div class="muted">${baseVPof(t)} VP</div></div>`).join('')}
    </div>
    <div class="card">
      <div class="row-between"><span>Available</span><span class="mono">${fmt1(avail)}</span></div>
      <div class="row-between"><span>${territoryLabel(main)} (all power)</span><span class="mono">⚡ ${fmt1(mainPower)}</span></div>
      <div class="divider"></div>
      <div class="muted" style="font-size:12px; margin-bottom:10px;">Deployment is final. Power cannot be withdrawn after deployment.</div>
      <button class="btn btn-primary" onclick="confirmDeploy('${main}', null, [100,0])" ${avail<=0?'disabled':''}>CONFIRM DEPLOYMENT</button>
    </div>`;
  }
  const secondaryOptions = battles.filter(t=>t!==main);
  const secondary = deployState.secondary && secondaryOptions.includes(deployState.secondary) ? deployState.secondary : null;
  const split = CONFIG.splitPresets[deployState.splitIdx];
  const mainPower = round2(avail*split[0]/100); const secPower = secondary ? round2(avail*split[1]/100) : 0;
  return `
  <div class="card"><div class="card-title">MAIN BATTLE</div>
    ${battles.map(t => `<div class="terr-select ${main===t?'selected':''}" onclick="setDeployMain('${t}')">
      <div><b class="display">${territoryLabel(t)}</b> ${ownerBadge(world.ownership[t])}</div><div class="muted">${baseVPof(t)} VP</div></div>`).join('')}
  </div>
  <div class="card"><div class="card-title">OPTIONAL SECONDARY BATTLE</div>
    <div class="terr-select ${!secondary?'selected':''}" onclick="setDeploySecondary(null)"><div>None — 100% to Main</div></div>
    ${secondaryOptions.map(t => `<div class="terr-select ${secondary===t?'selected':''}" onclick="setDeploySecondary('${t}')">
      <div><b class="display">${territoryLabel(t)}</b> ${ownerBadge(world.ownership[t])}</div><div class="muted">${baseVPof(t)} VP</div></div>`).join('')}
  </div>
  ${secondary ? `<div class="card"><div class="card-title">ALLOCATION SPLIT</div>
    <div class="debug-grid" style="grid-template-columns:1fr 1fr 1fr;">
      ${CONFIG.splitPresets.map((p,i) => `<div class="split-opt ${deployState.splitIdx===i?'selected':''}" onclick="setSplit(${i})">${p[0]}/${p[1]}</div>`).join('')}
    </div></div>` : ''}
  <div class="card"><div class="card-title">RESULT</div>
    <div class="row-between"><span>Available</span><span class="mono">${fmt1(avail)}</span></div>
    <div class="row-between"><span>${territoryLabel(main)} (Main)</span><span class="mono">⚡ ${fmt1(mainPower)}</span></div>
    ${secondary ? `<div class="row-between"><span>${territoryLabel(secondary)} (Secondary)</span><span class="mono">⚡ ${fmt1(secPower)}</span></div>` : ''}
    <div class="divider"></div>
    <div class="muted" style="font-size:12px; margin-bottom:10px;">Deployment is final. Power cannot be withdrawn after deployment.</div>
    <button class="btn btn-primary" onclick="confirmDeploy('${main}', ${secondary?`'${secondary}'`:null}, [${split[0]},${split[1]}])" ${avail<=0?'disabled':''}>CONFIRM DEPLOYMENT</button>
  </div>`;
}
function setDeployMain(t){ deployState.main = t; if(deployState.secondary===t) deployState.secondary=null; render(); }
function setDeploySecondary(t){ deployState.secondary = t; if(!t) deployState.splitIdx = 0; else if(deployState.splitIdx===0) deployState.splitIdx=1; render(); }
function setSplit(i){ deployState.splitIdx = i; render(); }
function confirmDeploy(main, sec, split){ deployPower(main, sec, split); deployState = {main:null, secondary:null, splitIdx:1}; }

/* ---------- RALLY ---------- */
let rallyPublishState = { main:null, secondary:null, splitIdx:1 };
function screenRally(){
  if (world.rallyEnabled === false){
    return `<div class="card" style="text-align:center;">
      <div class="card-title">RALLY IS OFF</div>
      <div class="muted">The Commander/Rally feature is disabled for this season (an admin turned it off in the debug panel — handy when a faction only has one player, since Rally has no one to coordinate). Deploy your power directly from the Deploy tab instead.</div>
    </div>`;
  }
  const myComm = activityDoc.commander[profile.faction];
  const battles = battlesDoc.activeBattles.filter(t => effectiveEligibleFactions(t, world.ownership, battlesDoc.activeBattles).includes(profile.faction));
  if (!myComm){
    return `<div class="card"><div class="card-title">NO COMMANDER YET TODAY</div>
      <div class="muted" style="margin-bottom:10px;">Be the first to claim it and publish today's Rally for ${FACTION_META[profile.faction].name}.</div>
      <button class="btn btn-primary" onclick="claimCommander()" ${!battles.length?'disabled':''}>BECOME TODAY'S COMMANDER</button>
      ${!battles.length ? `<div class="muted" style="margin-top:8px;">No eligible battles today.</div>` : ''}
    </div>`;
  }
  if (myComm === profile.name && !activityDoc.rally[profile.faction]){
    if (!battles.length) return `<div class="card"><div class="empty-note">No eligible battles to rally today.</div></div>`;
    const main = rallyPublishState.main && battles.includes(rallyPublishState.main) ? rallyPublishState.main : battles[0];
    const secOpts = battles.filter(t=>t!==main);
    const secondary = rallyPublishState.secondary && secOpts.includes(rallyPublishState.secondary) ? rallyPublishState.secondary : null;
    const split = CONFIG.splitPresets[rallyPublishState.splitIdx];
    return `
    <div class="card"><div class="card-title">👑 YOU ARE TODAY'S COMMANDER</div>
      <div class="muted">Publish one Rally for your faction. It locks for the day once published.</div></div>
    <div class="card"><div class="card-title">MAIN TERRITORY</div>
      ${battles.map(t => `<div class="terr-select ${main===t?'selected':''}" onclick="rMain('${t}')"><div><b class="display">${territoryLabel(t)}</b> ${ownerBadge(world.ownership[t])}</div><div class="muted">${baseVPof(t)} VP</div></div>`).join('')}
    </div>
    <div class="card"><div class="card-title">SECONDARY (OPTIONAL)</div>
      <div class="terr-select ${!secondary?'selected':''}" onclick="rSec(null)">None</div>
      ${secOpts.map(t => `<div class="terr-select ${secondary===t?'selected':''}" onclick="rSec('${t}')"><div><b class="display">${territoryLabel(t)}</b></div></div>`).join('')}
    </div>
    ${secondary ? `<div class="card"><div class="card-title">SPLIT</div>
      <div class="debug-grid" style="grid-template-columns:1fr 1fr 1fr;">
        ${CONFIG.splitPresets.map((p,i)=>`<div class="split-opt ${rallyPublishState.splitIdx===i?'selected':''}" onclick="rSplit(${i})">${p[0]}/${p[1]}</div>`).join('')}
      </div></div>` : ''}
    <button class="btn btn-primary" onclick="doPublish('${main}', ${secondary?`'${secondary}'`:null}, [${split[0]},${split[1]}])">PUBLISH RALLY</button>`;
  }
  if (!activityDoc.rally[profile.faction]){
    return `<div class="card"><div class="empty-note">Commander ${myComm} hasn't published a Rally yet — check back shortly.</div></div>`;
  }
  const r = activityDoc.rally[profile.faction]; const m = FACTION_META[profile.faction];
  return `
  <div class="rally-card" style="border-color:${m.color};">
    <div class="display" style="color:${m.color}; font-weight:700; letter-spacing:1px; margin-bottom:8px;">${m.emoji} ${m.name} RALLY</div>
    <div class="row-between"><span class="muted">MAIN</span><span><b>${territoryLabel(r.main)}</b> — ${r.split[0]}%</span></div>
    ${r.secondary ? `<div class="row-between"><span class="muted">SUPPORT</span><span><b>${territoryLabel(r.secondary)}</b> — ${r.split[1]}%</span></div>` : ''}
    <div class="divider"></div>
    <div class="muted" style="font-size:12px;">Commander: ${myComm}${r.auto?' (auto-generated)':''}</div>
    <div class="muted" style="font-size:12px;">Record: ${world.commanderRecord[profile.faction].wins}W – ${world.commanderRecord[profile.faction].losses}L</div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" onclick="followRally()" ${mystate.locked?'disabled':''}>FOLLOW RALLY</button>
    <button class="btn btn-outline" onclick="goScreen('deploy')" ${mystate.locked?'disabled':''}>CUSTOM DEPLOY</button>
  </div>
  ${mystate.locked ? `<div class="muted" style="text-align:center; margin-top:10px;">Power already deployed today.</div>` : ''}`;
}
function rMain(t){ rallyPublishState.main=t; if(rallyPublishState.secondary===t) rallyPublishState.secondary=null; render(); }
function rSec(t){ rallyPublishState.secondary=t; if(!t) rallyPublishState.splitIdx=0; else if(rallyPublishState.splitIdx===0) rallyPublishState.splitIdx=1; render(); }
function rSplit(i){ rallyPublishState.splitIdx=i; render(); }
function doPublish(main, sec, split){ publishRally(main, sec, split); rallyPublishState={main:null,secondary:null,splitIdx:1}; }

    ${s.rallyResults[profile.faction].secondary ? `<div>SUPPORT — ${territoryLabel(s.rallyResults[profile.faction].secondary.t)} ${s.rallyResults[profile.faction].secondary.captured ? '✅ CAPTURED' : '❌ LOST'}</div>` : ''}

        <div class="team-opt ${onboardFaction===f?'selected':''}" onclick="pickTeam('${f}')">
          <span class="swatch" style="background:${m.color};"></span>
          <div><b>${m.emoji} ${m.name}</b></div>
        </div>`; }).join('')}
    </div>
    <button class="btn btn-primary" onclick="submitOnboarding()" ${!onboardFaction?'disabled':''}>JOIN GAME</button>
  </div></div>`;
}
function pickTeam(f){ onboardFaction = f; render(); }

/* =========================================================
   MODALS + NAV
========================================================= */
function goScreen(id){ uiScreen = id; activeModal = null; render(); }
function openTerritory(t){ activeModal = t; render(); }
function closeModal(){ activeModal = null; render(); }
function closeModalIfBackdrop(e){ if (e.target.classList.contains('modal-backdrop')) closeModal(); }

/* =========================================================
   DEBUG PANEL (testing/debug tools for the shared multiplayer world)
========================================================= */
function toggleDebug(){ debugOpen = !debugOpen; render(); }
async function dbgToggleRally(){
  const fresh = await safeGet('world', true); if (!fresh || fresh === STORAGE_RETRY_LATER) return;
  fresh.rallyEnabled = fresh.rallyEnabled === false ? true : false;
  await safeSet('world', fresh, true); world = fresh; render();
}
async function dbgSimulateTeammate(){
  if (!battlesDoc.activeBattles.length) return;
  const t = battlesDoc.activeBattles[Math.floor(Math.random()*battlesDoc.activeBattles.length)];
  const key = dayKey(world.runId, 'activity', world.currentDay);
  let fresh = await safeGet(key, true); if (!fresh || fresh === STORAGE_RETRY_LATER) fresh = activityDoc;
  fresh.deployed[t] = fresh.deployed[t] || {};
  const amount = Math.round(400 + Math.random()*2200);
  fresh.deployed[t][profile.faction] = round2((fresh.deployed[t][profile.faction]||0) + amount);
  await safeSet(key, fresh, true); activityDoc = fresh; render();
}
function dbgCopyInviteLink(){
  const link = buildInviteLink();
  if (!link) return;
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(link).then(() => alert('Invite link copied! Send it to colleagues — opening it auto-fills their Supabase connection.'));
  } else {
    prompt('Copy this invite link:', link);
  }
}
async function dbgResetSeason(){
  const fresh = makeInitialWorld();
  await safeSet('world', fresh, true);
  world = fresh;
  seasonResult = null;
  progress = null;
  progressLoaded = false; // force a re-fetch under the new runId (was a pre-existing gap — otherwise progress stayed null forever after reset)
  settlementDoc = null;
  settlementFetchedForDay = null;
  cachedDocsForDay = null;
  roster = null;
  lastHeartbeatAt = 0;
  await syncAll();
  await joinRoster();
  uiScreen = 'home';
  render();
}
function renderDebug(){
  if (!debugOpen) return '';
  return `
  <div class="debug-backdrop" onclick="toggleDebug()"></div>
  <div class="debug-drawer">
    <div class="row-between" style="margin-bottom:14px;">
      <div class="card-title" style="margin:0;">DEMO DEBUG PANEL</div>
      <span class="close-x" style="position:static;" onclick="toggleDebug()">✕</span>
    </div>
    <div class="debug-section">
      <h4>My Info</h4>
      <div class="muted">Name: ${profile.name}</div>
      <div class="muted">Faction: ${FACTION_META[profile.faction].name}</div>
      <div class="muted" style="margin:8px 0 4px;">Energy Today: ${fmt1(mystate.energyToday)}</div>
    </div>
    <div class="debug-section">
      <h4>Season State</h4>
      <div class="muted">Day ${world.currentDay} / ${CONFIG.seasonDays} · Phase: ${({battles:'Battles',fog:'Fog',seasonEnd:'Season End'})[world.phase]||world.phase}</div>
      <div class="muted" style="margin-top:4px; font-size:11px;">Fog and Resolve Day are now on the Home screen — any player can trigger them.</div>
    </div>
    <div class="debug-section">
      <h4>Rally (affects all players)</h4>
      <div class="muted" style="margin-bottom:6px;">Currently: ${world.rallyEnabled === false ? 'OFF' : 'ON'}. Useful to turn off while testing with only one player per faction.</div>
      <button class="btn btn-outline btn-small" onclick="dbgToggleRally()">${world.rallyEnabled === false ? 'Turn Rally ON' : 'Turn Rally OFF'}</button>
    </div>
    <div class="debug-section">
      <h4>Simulate Teammate (affects all players)</h4>
      <div class="muted" style="margin-bottom:6px;">Active: ${battlesDoc.activeBattles.join(', ') || '—'}</div>
      <button class="btn btn-outline btn-small" onclick="dbgSimulateTeammate()">Simulate a Teammate Deploying</button>
    </div>
    <div class="debug-section">
      <h4>Reset (affects all players)</h4>
      <button class="btn btn-outline" onclick="dbgResetSeason()">Reset Full Season</button>
    </div>
    <div class="debug-section">
      <h4>Supabase Connection</h4>
      <button class="btn btn-outline btn-small" onclick="dbgCopyInviteLink()">Copy Invite Link (pre-configured)</button>
      <div class="muted" style="margin:8px 0 4px; font-size:11px;">Copies a link with your Supabase details embedded, so colleagues who open it don't have to fill in the setup form themselves.</div>
      <button class="btn btn-outline btn-small" style="margin-top:6px;" onclick="forgetSupabaseConfig()">Forget This Connection</button>
    </div>
  </div>`;
}

/* =========================================================
   ROOT RENDER
========================================================= */
function render(){
  if (bootPhase === 'setup_form'){
    document.getElementById('root').innerHTML = `<div class="onboard-wrap"><div class="onboard-card">
      <div class="card-title" style="margin-bottom:4px;">RUN KINGDOM · FIRST-TIME SETUP</div>
      <div class="display" style="font-size:18px; font-weight:700; margin-bottom:6px;">Connect to your Supabase project</div>
      <div class="muted" style="line-height:1.6; margin-bottom:14px;">
        Paste the two values from your Supabase project's <b>Settings → API</b> page. This is saved in your browser and only needs doing once — see DEPLOYMENT_GUIDE.md if you haven't created a free Supabase project yet.
      </div>
      <div class="muted" style="margin-bottom:4px; font-size:12px;">Project URL</div>
      <input class="name-input" placeholder="https://xxxx.supabase.co" value="${setupUrlInput}" oninput="setupUrlInput=this.value" />
      <div class="muted" style="margin:10px 0 4px; font-size:12px;">anon public API key</div>
      <input class="name-input" placeholder="eyJhbGc..." value="${setupKeyInput}" oninput="setupKeyInput=this.value" />
      <button class="btn btn-primary" style="margin-top:16px;" onclick="submitSetupForm()" ${(!setupUrlInput.trim()||!setupKeyInput.trim())?'disabled':''}>SAVE & CONNECT</button>
    </div></div>`;
    return;
  }
  if (bootPhase === 'config_missing'){
    const brokenKeys = !!supabaseInitError;
    document.getElementById('root').innerHTML = `<div class="onboard-wrap"><div class="onboard-card">
      <div class="card-title" style="margin-bottom:8px; color:var(--danger);">SETUP NEEDED</div>
      <div class="display" style="font-size:18px; font-weight:700; margin-bottom:10px;">Your Supabase connection isn't working</div>
      <div class="muted" style="line-height:1.6;">
        ${brokenKeys
          ? `Connecting failed with: <br><code style="color:var(--danger); font-size:11px;">${supabaseInitError}</code><br><br>The saved Project URL or anon key looks malformed.`
          : `The Supabase library didn't load (check your internet connection and reload).`}
      </div>
      <button class="btn btn-outline" style="margin-top:16px;" onclick="forgetSupabaseConfig()">RE-ENTER SUPABASE DETAILS</button>
    </div></div>`;
    return;
  }
  if (bootPhase === 'loading'){
    document.getElementById('root').innerHTML = `<div class="loading-wrap">Connecting to the Run Kingdom world…</div>`;
    return;
  }
  if (bootPhase === 'onboarding'){
    document.getElementById('root').innerHTML = renderOnboarding();
    return;
  }
  let body = '';
  if (uiScreen === 'home') body = screenHome();
  else if (uiScreen === 'run') body = screenRun();
  else if (uiScreen === 'deploy') body = screenDeploy();
  else if (uiScreen === 'rally') body = screenRally();
  else if (uiScreen === 'report') body = screenReport();
  else if (uiScreen === 'season') body = screenSeason();
  else if (uiScreen === 'history') body = screenHistory();
  else body = screenHome();

  document.getElementById('root').innerHTML = `
    ${renderTopbar()}
    <div class="content">${renderSyncError()}${body}</div>
    ${renderBottomNav()}
    <div class="fab" onclick="toggleDebug()">⚙️</div>
    ${activeModal ? modalTerritory(activeModal) : ''}
    ${renderDebug()}
  `;
}

/* =========================================================
   LOOPS + INIT
========================================================= */
function startLoops(){
  // No more real-time countdown to track locally — battle resolution is a
  // manual action now, so we only need the background poll to pick up
  // other players' moves (deploys, rallies, someone else resolving the day).
  scheduleNextPoll();
}
// Self-rescheduling (rather than setInterval) so a slow sync never overlaps
// with the next one, plus a random jitter per client so many people opening
// this at once don't all hit the storage backend in the same instant.
function scheduleNextPoll(){
  const jitter = Math.random() * 2000;
  setTimeout(async () => {
    try{ await syncAll(); render(); } finally { scheduleNextPoll(); }
  }, CONFIG.pollMs + jitter);
}
render();
boot();
</script>
