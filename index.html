<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Run Kingdom Lite · Online Multiplayer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<!-- Supabase JS client (free tier) — this is what makes the multiplayer world persist and sync across everyone playing. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#0a0d12; --panel:#12161d; --panel-2:#181e27; --panel-3:#1f2631; --border:#252d3a;
  --text:#e7ecf3; --text-dim:#8894a6; --text-dim2:#5c6675;
  --cinder:#ff5a3c; --cinder-dim:#4a2318;
  --surge:#34aeff; --surge-dim:#123048;
  --bloom:#57d97a; --bloom-dim:#164027;
  --neutral:#3b4250; --neutral-dim:#1c212a;
  --gold:#f2c245; --danger:#ff4d4d; --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh;}
.mono{font-family:'Space Mono',monospace;}
.display{font-family:'Chakra Petch',sans-serif;}
#root{
  max-width:480px; margin:0 auto; min-height:100vh;
  background:radial-gradient(ellipse 600px 300px at 50% -10%, rgba(52,174,255,0.07), transparent), var(--bg);
  display:flex; flex-direction:column; position:relative;
  border-left:1px solid var(--border); border-right:1px solid var(--border);
}
.topbar{padding:14px 16px 10px; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:20;
  background:rgba(10,13,18,0.92); backdrop-filter:blur(6px);}
.topbar-row{display:flex; justify-content:space-between; align-items:baseline;}
.season-label{font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:12px; letter-spacing:2px; color:var(--text-dim);}
.day-label{font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:13px; letter-spacing:1px; color:var(--gold);}
.live-dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--bloom); margin-right:5px; animation:livePulse 1.6s ease-in-out infinite;}
@keyframes livePulse{0%,100%{opacity:1;} 50%{opacity:0.3;}}
.standings-row{display:flex; gap:10px; margin-top:8px;}
.standing-chip{flex:1; display:flex; align-items:center; justify-content:space-between; padding:6px 8px; border-radius:10px;
  font-family:'Space Mono',monospace; font-size:11px; border:1px solid var(--border); background:var(--panel);}
.standing-chip.me{box-shadow:0 0 0 1px currentColor inset;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block; margin-right:6px;}
.content{flex:1; padding:16px 16px 100px; overflow-y:auto;}
.card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:14px;}
.card-title{font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:12px; letter-spacing:2px; color:var(--text-dim);
  margin:0 0 10px; text-transform:uppercase;}
.big-num{font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:30px;}
.prize-box{background:linear-gradient(135deg, rgba(242,194,69,0.12), rgba(242,194,69,0.02)); border:1px solid rgba(242,194,69,0.35);
  border-radius:var(--radius); padding:14px 16px; margin-bottom:14px;}
.prize-label{font-family:'Chakra Petch',sans-serif; font-size:11px; letter-spacing:2px; color:var(--gold); font-weight:700;}
.prize-num{font-family:'Space Mono',monospace; font-size:24px; font-weight:700; color:var(--gold); margin-top:2px;}
.map-wrap{position:relative; margin:6px auto 4px; width:270px;}
.map-grid{display:grid; grid-template-columns:repeat(3,84px); grid-template-rows:repeat(3,84px); gap:9px; position:relative; z-index:2;}
.tile{border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer;
  position:relative; border:2px solid var(--neutral-dim); background:var(--neutral-dim);
  transition:background 0.6s ease, border-color 0.6s ease, transform 0.25s ease; color:var(--text);}
.tile:active{transform:scale(0.95);}
.tile .tid{font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:15px;}
.tile .tname{font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:10.5px; line-height:1.15; text-align:center; padding:0 4px; margin-top:2px;}
.tile .tvp{font-family:'Space Mono',monospace; font-size:10px; opacity:0.75; margin-top:2px;}
.tile.owner-cinder{background:linear-gradient(145deg, var(--cinder-dim), #2c140d); border-color:var(--cinder);}
.tile.owner-surge{background:linear-gradient(145deg, var(--surge-dim), #0d2032); border-color:var(--surge);}
.tile.owner-bloom{background:linear-gradient(145deg, var(--bloom-dim), #0e2718); border-color:var(--bloom);}
.tile .cap{position:absolute; top:4px; right:6px; font-size:9px; opacity:0.6; font-family:'Space Mono',monospace;}
.tile .bounty-pip{position:absolute; bottom:4px; left:6px; font-size:9px; font-family:'Space Mono',monospace; color:var(--gold);}
.tile.flash{animation:flashCap 0.9s ease;}
@keyframes flashCap{0%{transform:scale(1);} 35%{transform:scale(1.14); filter:brightness(1.8);} 100%{transform:scale(1); filter:brightness(1);}}
.tile.active-battle{animation:pulseBattle 1.3s ease-in-out infinite;}
@keyframes pulseBattle{
  0%,100%{box-shadow:0 0 0 2px rgba(242,194,69,0.3), 0 0 12px rgba(242,194,69,0.25); border-color:var(--gold);}
  50%{box-shadow:0 0 0 5px rgba(242,194,69,0.6), 0 0 26px rgba(242,194,69,0.65); border-color:#fff3cf;}
}
.btn{font-family:'Chakra Petch',sans-serif; font-weight:700; letter-spacing:0.5px; font-size:14px; border-radius:11px;
  border:none; padding:13px 18px; cursor:pointer; width:100%; transition:transform 0.15s ease, filter 0.15s ease;}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--gold); color:#171200;}
.btn-primary:disabled{background:#40403a; color:#7c7c72; cursor:not-allowed;}
.btn-outline{background:transparent; border:1px solid var(--border); color:var(--text);}
.btn-outline.selected{border-color:var(--gold); color:var(--gold); background:rgba(242,194,69,0.08);}
.btn-small{font-size:12px; padding:9px 12px; width:auto;}
.btn-row{display:flex; gap:8px;}
.btn-row .btn{flex:1;}
.bottomnav{position:sticky; bottom:0; z-index:20; display:flex; border-top:1px solid var(--border);
  background:rgba(10,13,18,0.96); backdrop-filter:blur(6px);}
.navitem{flex:1; text-align:center; padding:10px 4px 12px; cursor:pointer; color:var(--text-dim2);
  font-family:'Chakra Petch',sans-serif; font-size:10px; letter-spacing:1px; font-weight:700; border-top:2px solid transparent;}
.navitem .navicon{font-size:18px; display:block; margin-bottom:2px;}
.navitem.active{color:var(--gold); border-top-color:var(--gold);}
.pill{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:20px; font-family:'Space Mono',monospace;
  font-size:11px; font-weight:700; border:1px solid var(--border);}
.pill.leading{color:#1c3d1f; background:var(--bloom);}
.pill.close{color:#3d3512; background:var(--gold);}
.pill.behind{color:var(--text-dim); background:var(--panel-3); border-color:var(--border);}
.row-between{display:flex; justify-content:space-between; align-items:center;}
.muted{color:var(--text-dim); font-size:13px;}
.divider{height:1px; background:var(--border); margin:12px 0;}
input[type=range]{-webkit-appearance:none; width:100%; height:6px; border-radius:4px; background:var(--panel-3); outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:var(--gold);
  border:3px solid #171200; cursor:pointer; box-shadow:0 0 0 4px rgba(242,194,69,0.18);}
.fog-banner{background:linear-gradient(135deg, rgba(52,174,255,0.1), rgba(87,217,122,0.05)); border:1px solid var(--border);
  border-radius:var(--radius); padding:16px; text-align:center; margin-bottom:14px;}
.fog-banner .fogtitle{font-family:'Chakra Petch',sans-serif; font-weight:700; letter-spacing:2px; color:var(--surge); font-size:13px;}
.fog-timer{font-family:'Space Mono',monospace; font-size:26px; font-weight:700; margin-top:6px;}
.modal-backdrop{position:fixed; inset:0; background:rgba(6,8,11,0.75); z-index:50; display:flex; align-items:flex-end;
  justify-content:center; backdrop-filter:blur(3px);}
.modal-sheet{width:100%; max-width:480px; background:var(--panel); border-top-left-radius:22px; border-top-right-radius:22px;
  border:1px solid var(--border); border-bottom:none; padding:20px 18px 26px; max-height:88vh; overflow-y:auto; animation:sheetUp 0.25s ease;}
@keyframes sheetUp{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.modal-handle{width:36px; height:4px; background:var(--border); border-radius:3px; margin:0 auto 14px;}
.split-opt{border:1px solid var(--border); border-radius:10px; padding:10px; text-align:center; cursor:pointer;
  font-family:'Space Mono',monospace; font-size:13px;}
.split-opt.selected{border-color:var(--gold); color:var(--gold); background:rgba(242,194,69,0.08);}
.terr-select{display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border:1px solid var(--border);
  border-radius:10px; margin-bottom:8px; cursor:pointer;}
.terr-select.selected{border-color:var(--gold);}
.terr-select.disabled{opacity:0.35; cursor:not-allowed;}
.badge-owner{font-size:10px; padding:2px 7px; border-radius:20px; font-family:'Space Mono',monospace;}
.badge-cinder{background:var(--cinder-dim); color:var(--cinder);}
.badge-surge{background:var(--surge-dim); color:var(--surge);}
.badge-bloom{background:var(--bloom-dim); color:var(--bloom);}
.badge-neutral{background:var(--panel-3); color:var(--text-dim);}
.debug-drawer{position:fixed; top:0; bottom:0;
  /* Anchored to the RIGHT EDGE OF THE GAME CONTENT (#root, centered, max-width 480px),
     not to the physical browser window edge. On a wide desktop window the game itself
     is a narrow centered column with a lot of empty space on both sides — anchoring
     to the raw viewport edge (the old `inset:0 0 0 auto`) made the drawer slide in far
     off to the side, outside where anyone would actually be looking, which looked
     exactly like "clicking the gear icon does nothing". max() clamps back to the
     ordinary right-aligned mobile behavior once the viewport is narrower than #root. */
  right:max(0px, calc(50% - 240px));
  width:88%; max-width:400px; background:var(--panel); z-index:60;
  border-left:1px solid var(--border); padding:18px; overflow-y:auto; animation:slideIn 0.2s ease;}
@keyframes slideIn{from{transform:translateX(20px); opacity:0;} to{transform:translateX(0); opacity:1;}}
.debug-backdrop{position:fixed; inset:0; background:rgba(0,0,0,0.72); z-index:59;}
.debug-section{margin-bottom:16px;}
.debug-section h4{font-family:'Chakra Petch',sans-serif; font-size:11px; letter-spacing:1.5px; color:var(--gold);
  margin:0 0 8px; text-transform:uppercase;}
.debug-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.fab{position:fixed; bottom:78px; right:calc(50% - 240px + 16px); z-index:30; width:44px; height:44px; border-radius:50%;
  background:var(--panel-3); border:1px solid var(--border); color:var(--text-dim); display:flex; align-items:center;
  justify-content:center; cursor:pointer; font-size:16px;}
@media (max-width:520px){ .fab{right:16px;} }
.energy-readout{text-align:center; padding:14px 0;}
.chip-small{font-size:10px; padding:3px 8px; border-radius:20px; background:var(--panel-3); color:var(--text-dim); font-family:'Space Mono',monospace;}
.rally-card{border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:12px;}
.gst-tier{border:1px solid var(--border); border-radius:9px; padding:8px; text-align:center; font-family:'Space Mono',monospace; font-size:12px; cursor:pointer;}
.gst-tier.selected{border-color:var(--gold); color:var(--gold); background:rgba(242,194,69,0.08);}
.empty-note{color:var(--text-dim2); font-size:12px; text-align:center; padding:10px;}
.elim-banner{background:linear-gradient(135deg, rgba(255,90,60,0.14), rgba(255,90,60,0.02)); border:1px solid rgba(255,90,60,0.4);
  border-radius:var(--radius); padding:14px; margin-bottom:14px; text-align:center;}
.elim-banner .et{font-family:'Chakra Petch',sans-serif; font-weight:700; letter-spacing:1px; color:var(--cinder); font-size:13px;}
.onboard-wrap{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px;}
.onboard-card{width:100%; max-width:400px; background:var(--panel); border:1px solid var(--border); border-radius:18px; padding:24px;}
.team-pick{display:flex; flex-direction:column; gap:10px; margin:14px 0;}
.team-opt{display:flex; align-items:center; gap:10px; padding:14px; border:2px solid var(--border); border-radius:12px; cursor:pointer;}
.team-opt.selected{border-color:var(--gold); background:rgba(242,194,69,0.06);}
.team-opt .swatch{width:20px; height:20px; border-radius:50%;}
.name-input{width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border); background:var(--panel-3);
  color:var(--text); font-family:'Inter',sans-serif; font-size:14px; margin-top:8px;}
.loading-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; color:var(--text-dim); font-family:'Chakra Petch',sans-serif;}
.sync-error{background:rgba(255,77,77,0.12); border:1px solid rgba(255,77,77,0.4); border-radius:12px; padding:12px 14px;
  margin-bottom:14px; font-size:13px;}
.sync-error .se-title{color:var(--danger); font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:12px; letter-spacing:1px; margin-bottom:4px;}
.sync-error .se-row{display:flex; gap:8px; margin-top:8px;}
</style>

<body>
<div id="root"></div>

<script>
/* =========================================================
   SUPABASE CONFIG
   You do NOT need to edit this file to set this up — that's on purpose.
   Editing HTML source with a rich-text editor (e.g. macOS TextEdit's
   default "rich text" mode, not its plain-text mode) is a common way to
   silently corrupt a file — smart quotes, stripped tags, etc. — with no
   error message at all, just a blank page. So instead: deploy this file
   completely unmodified, then open it and paste your Supabase Project URL
   and anon public key into the on-screen setup form the first time it
   loads. That gets saved safely in your browser (no file editing, ever).

   The two constants below are only an OPTIONAL advanced shortcut, for
   someone comfortable editing code who wants every visitor pre-configured
   without seeing the setup form. Leave them as-is if you're not sure.
========================================================= */
const SUPABASE_URL_HARDCODED = 'YOUR_SUPABASE_PROJECT_URL';
const SUPABASE_ANON_KEY_HARDCODED = 'YOUR_SUPABASE_ANON_PUBLIC_KEY';

// A visible build marker — shown small in the corner of the loading/setup
// screens. Purely a debugging aid: if you ever see a blank page and aren't
// sure whether you're looking at a fresh copy of this file or an old one
// (e.g. one that got corrupted by a rich-text editor and just renamed),
// compare this string against what's mentioned in the chat. If the page is
// blank enough that you can't even see this stamp, the file most likely
// isn't the one you think it is — try a completely fresh download instead
// of reusing/renaming any previously-edited copy.
const APP_BUILD = 'rk-v0.2.5-territory-names-2026-09-01';

// Safety net: if ANY unexpected error happens while the script is first
// loading — before the game has managed to render anything at all — show
// that error on screen instead of leaving a silent blank/black page. This
// is registered as early as possible, before any of the riskier setup code
// below (like connecting to Supabase) runs.
window.addEventListener('error', function(e){
  const root = document.getElementById('root');
  if (root && !root.innerHTML.trim()){
    const msg = (e && e.message) ? e.message : 'Unknown error';
    root.innerHTML = '<div style="padding:24px; color:#e7ecf3; font-family:sans-serif; background:#0a0d12; min-height:100vh; box-sizing:border-box;">'
      + '<h3 style="color:#ff4d4d; margin-top:0;">Something went wrong loading the game</h3>'
      + '<p style="opacity:0.85; font-size:13px; word-break:break-word;">' + msg + '</p>'
      + '<p style="opacity:0.6; font-size:12px;">Press F12 to see the full error in your browser console. If you hand-edited this file, try re-downloading a fresh copy instead of editing it — see the setup form / DEPLOYMENT_GUIDE.md.</p>'
      + '<p style="opacity:0.3; font-size:10px; font-family:monospace;">' + APP_BUILD + '</p>'
      + '</div>';
  }
});

/* =========================================================
   RUN KINGDOM · CONFIG
========================================================= */
const CONFIG = {
  seed: 88172,
  // ---- Season / Round structure ----
  // A SEASON is a 6-week container whose only job is to keep faction
  // assignment stable — factions are assigned once at season start and never
  // reshuffled for all 6 weeks, so team identity actually accumulates.
  // A ROUND is one week (7 days) and is the real competitive unit: it has its
  // own map, VP, prize pool, winner and rewards (this is what used to be
  // called a "season" before the structure was split in two).
  roundDays: 7,
  roundsPerSeason: 6,
  // Battle resolution is manual (any player can trigger it via the Resolve
  // Day button) rather than on a real-time countdown — this avoids many
  // clients' timers racing to hit the same deadline simultaneously, which
  // was contributing to storage rate-limit errors under multiplayer load.
  // Realtime (Postgres websocket push) is the primary sync mechanism now —
  // this poll is only a safety net for a missed realtime message, so it can
  // run much less often than it did in the Claude-artifact/polling-only version.
  pollMs: 20000,             // base polling interval (jitter added per-client below)
  heartbeatMs: 45000,        // how often we refresh our own "last seen" in the roster
  onlineWindowMs: 100000,    // someone counts as "online now" if seen within this window
  energy: { min: 0, max: 90, step: 0.2 }, // slider UI range; the power curve itself has no upper cap (see energyToPower)
  splitPresets: [[100,0],[75,25],[50,50]],
  maxActiveBattlesPerDay: 3,
  vpBase: { normal: 1, center: 2 },
  // Smoothed for a 7-day round: gentle 1.0 -> 2.0x ramp instead of big 1/2/3/4x jumps.
  vpMultiplier: (day) => day <= 2 ? 1.0 : day <= 4 ? 1.25 : day <= 6 ? 1.5 : 2.0,
  // ---- Final-day structural comeback point ----
  // On the last day of a round, Kingmaker (E) is worth 3x and is FORCED to be
  // an active battle. This is a transparent, published rule (shown from day 1)
  // rather than a hidden balancing nudge — it creates one genuine "all in"
  // decisive fight instead of secretly boosting whoever is losing.
  finalDayKingmakerMultiplier: 3,
  bountyThresholds: [
    { min: 2, max: 3, level: 1, bonus: 1,   mult: 1.15 },
    { min: 4, max: 5, level: 2, bonus: 1.5, mult: 1.3 },
    { min: 6, max: 999, level: 3, bonus: 2, mult: 1.5 },
  ],
  gstTiers: [0, 5, 10, 15, 20],
  // 90% prize / 4% burn / 6% protocol — total rake down to 10% (was 20%), so
  // the game reads as an entertainment spend rather than a losing investment.
  gmtSplit: { prize: 0.90, burn: 0.04, protocol: 0.06 },
  // Flattened from 55/30/15 so the last-place faction (who already lost) isn't
  // also hit with the harshest economic loss — that combination is the single
  // most likely reason for a player to quit outright.
  rewardDistribution: { 1: 0.50, 2: 0.32, 3: 0.18 },
  poolSplit: { participation: 0.40, contribution: 0.60 },
  participationThreshold: 4, // days within a round
  startingPrizePool: 4200,
  seasonEntryFeeGMT: 5,
  startingWalletGMT: 10000,
  // ---- Commander ----
  commanderTopPercent: 0.20,      // must be in your faction's top 20% by last-7-day energy to stand
  commanderMaxConsecutiveRounds: 2,
  commanderMessageMaxChars: 80,
  // Nominations stay open through this many days at the start of each round.
  // Without a window, whoever nominated first was instantly elected and
  // nobody else ever got to stand — "first to click" instead of "highest energy".
  commanderNominationDays: 1,
};

const FACTIONS = ['cinder','surge','bloom'];
const FACTION_META = {
  cinder: { name: 'Red Running Team', short: 'Red Team', emoji: '🔴', color: 'var(--cinder)' },
  surge:  { name: 'Blue Running Team', short: 'Blue Team', emoji: '🔵', color: 'var(--surge)' },
  bloom:  { name: 'Green Running Team', short: 'Green Team', emoji: '🟢', color: 'var(--bloom)' },
};
const TERRITORIES = ['A','B','C','D','E','F','G','H','I'];
const TERRITORY_NAMES = {
  A: 'Alpha Gate', B: 'Black Cat 🐈\u200d⬛', C: 'Charm City',
  D: 'Diamond District 💎', E: 'Energy Core 👑', F: 'Find Satoshi',
  G: 'Gilgamesh Domination', H: 'Haus Haven', I: 'ID Plaza',
};
const territoryLabel = (t) => TERRITORY_NAMES[t] || t;
const rallyOutcomeLabel = (outcome) => outcome === 'captured' ? '✅ CAPTURED' : outcome === 'held' ? '🛡️ HELD' : '❌ LOST';
const ADJ = {
  A:['B','D'], B:['A','C','E'], C:['B','F'],
  D:['A','E','G'], E:['B','D','F','H'], F:['C','E','I'],
  G:['D','H'], H:['E','G','I'], I:['F','H'],
};
const POS = { A:[0,0],B:[1,0],C:[2,0], D:[0,1],E:[1,1],F:[2,1], G:[0,2],H:[1,2],I:[2,2] };
const baseVPof = (t) => t === 'E' ? CONFIG.vpBase.center : CONFIG.vpBase.normal;

/* =========================================================
   PURE GAME LOGIC (deterministic — safe under concurrent writers)
========================================================= */
function clamp(n,min,max){ return Math.max(min, Math.min(max,n)); }
function round2(n){ return Math.round(n*100)/100; }

function energyToPower(energy){
  // Only the lower bound is clamped — negative energy makes no sense. There's
  // deliberately no upper clamp: if a real day's Energy sync ever reports
  // more than the slider's 90 max (e.g. an unusually long run), we keep
  // applying the same 75-90 tier rate (1 Power per 6 Energy) rather than
  // freezing the reward at the Energy=90 value.
  const e = Math.max(CONFIG.energy.min, energy);
  let p;
  if (e <= 20) p = e/2;
  else if (e <= 40) p = 10 + (e-20)/3;
  else if (e <= 60) p = 16.6667 + (e-40)/4;
  else if (e <= 75) p = 21.6667 + (e-60)/5;
  else p = 24.6667 + (e-75)/6;
  return round2(p);

function mulberry32(a){

    a |= 0; a = a + 0x6D2B79F5 | 0;

function factionOwnsAny(f, ownership){ return TERRITORIES.some(t => ownership[t] === f); }

  return neighbors.some(n => ownership[n] && ownership[n] !== owner);
}

  const owner = ownership[t]; const set = new Set();
  if (owner) set.add(owner);

  return [...set];
}

function effectiveEligibleFactions(t, ownership, activeBattles, day){
  const set = new Set(getEligibleFactions(t, ownership));
  if (activeBattles.includes(t)){
    FACTIONS.forEach(f => { if (!factionOwnsAny(f, ownership)) set.add(f); });
  }
  // FINAL DAY KINGMAKER: every faction can commit to E regardless of
  // adjacency. Without this, forcing E open on the last day could produce a
  // battle almost nobody is allowed to join (E may not border their land),
  // which would quietly defeat the whole point of the decisive showdown.
  if (t === 'E' && isFinalDay(day) && activeBattles.includes('E')){

function getBountyLevel(holdDays){

function weightedPickWithoutReplacement(items, n, rng){
  const pool = items.map(i => ({...i})); const picked = [];
  while (picked.length < n && pool.length){
    const total = pool.reduce((s,i)=>s+i.weight,0);
    let r = rng() * total; let idx = 0;
    for (; idx < pool.length; idx++){ r -= pool[idx].weight; if (r <= 0) break; }
    idx = Math.min(idx, pool.length-1);
    picked.push(pool[idx]); pool.splice(idx,1);

function selectActiveBattles(day, ownership, holdDays, repHistory){
  const candidates = getEligibleFrontlines(ownership);
  if (!candidates.length) return [];
  const weighted = candidates.map(t => {
    const level = getBountyLevel(holdDays[t] || 0);
    const bMult = bountyMultiplier(level);
    const h = repHistory[t] || [];
    const last = h[h.length-1], prev = h[h.length-2];
    let rep = 1.0; if (last && prev) rep = 0.15; else if (last) rep = 0.5;
    return { t, weight: 1 * bMult * rep };
  });
  const rng = rngFor('battles', day);
  let picked = weightedPickWithoutReplacement(weighted, Math.min(CONFIG.maxActiveBattlesPerDay, weighted.length), rng);

  // "Meaningful participation" means an OFFENSIVE opportunity — a chance to
  // contest a tile you don't already own. Being merely eligible to defend a
  // tile you already hold doesn't count as a real choice: if that's the only
  // thing on offer, you have zero decisions to make that day. Without this
  // distinction, a faction boxed into a single starting Capital could be
  // "covered" purely because it can defend that Capital, even when none of
  // today's picks touch its border — leaving it with nothing to actually do.
  const offensiveEligible = (f, t) => ownership[t] !== f && getEligibleFactions(t, ownership).includes(f);
  const coverageOf = (battleList) => {
    const covered = new Set();
    battleList.forEach(t => FACTIONS.forEach(f => { if (offensiveEligible(f, t)) covered.add(f); }));
    return covered;
  };

  const missing = FACTIONS.filter(f => !coverageOf(picked.map(p=>p.t)).has(f));
  const protectedIdx = new Set(); // slots already used to fix a faction this call — don't undo them
  for (const f of missing){
    if (coverageOf(picked.map(p=>p.t)).has(f)) continue; // an earlier swap may have incidentally covered this one too
    const alt = weighted
      .filter(w => !picked.find(p => p.t === w.t))
      .filter(w => offensiveEligible(f, w.t))
      .sort((a,b) => b.weight - a.weight)[0];
    if (!alt || !picked.length) continue;
    const swappable = picked.map((p,i)=>({i, w:p.weight})).filter(x => !protectedIdx.has(x.i));
    if (!swappable.length) continue;
    const lowIdx = swappable.sort((a,b)=>a.w-b.w)[0].i;
    picked[lowIdx] = alt;
    protectedIdx.add(lowIdx);

  // battle would simply not happen on most rounds, since battle selection is
  // weighted-random and E is not guaranteed to be drawn. E is always eligible
  // on the final day even if it isn't currently a frontline, so the advertised
  // "final day showdown" rule is never a no-op.
  if (isFinalDay(day) && !result.includes('E')){
    if (result.length >= CONFIG.maxActiveBattlesPerDay) result[result.length - 1] = 'E';
    else result.push('E');
  }

}

}
function calculateBattleStatus(powerMap){
  const entries = Object.entries(powerMap);
  if (!entries.length) return {};
  const max = Math.max(...entries.map(e=>e[1])); const out = {};
  entries.forEach(([f,p]) => { out[f] = p===max ? 'LEADING' : (p >= max*0.9 ? 'CLOSE' : 'BEHIND'); });
  return out;
}
function resolveBattle(powerMap, currentOwner){
  const entries = Object.entries(powerMap);
  if (!entries.length) return { winner: currentOwner, tie: false };
  const max = Math.max(...entries.map(e=>e[1]));
  const top = entries.filter(([,p]) => p === max).map(([f]) => f);
  if (top.length > 1) return { winner: currentOwner, tie: true };
  return { winner: top[0], tie: false };
}
function isFinalDay(day){ return day >= CONFIG.roundDays; }

function roundIsOver(){ return world && (world.phase === 'roundEnd' || world.phase === 'seasonEnd'); }

// base value. Kept as a standalone helper so both VP scoring and the UI
// (which advertises this from day 1) read from exactly the same rule.
function vpValueOf(t, day){
  const base = baseVPof(t);

function calculateDailyVP(ownership, day){
  const mult = CONFIG.vpMultiplier(day); const totals = { cinder:0, surge:0, bloom:0 };

function sleep(ms){ return new Promise(res => setTimeout(res, ms)); }

// ---- Supabase client ----
// All game data lives in one simple table: kv_store(key text primary key,
// value jsonb, updated_at timestamptz). See schema.sql for the exact setup.
// This mirrors the same get/set-by-key model the rest of the game already
// expects, so none of the game logic below had to change — only this layer.
//
// ---- Resolve Supabase config: saved in this browser > embedded in an
// invite link's URL params (first visit) > the optional hardcoded constants
// above. This is what lets deployment work with zero file editing.
// ---- Resolve config from an invite link, if this is a first visit via one ----
// All of sb_url/sb_key/room are read from ONE combined pass over the URL, and
// the cleanup (removing them from the visible address) happens exactly once
// at the end — reading them in separate functions with separate
// history.replaceState() calls would have the first call wipe out params the
// second call still needed to see.
//
// These live in the URL FRAGMENT (after '#'), not the query string (after
// '?'). A browser never sends the fragment portion of a URL to the server in
// the actual HTTP request — so putting the anon key there means it can't
// show up in server access logs, CDN logs, or Referer headers the way a
// query-string value could. (It's still visible in the browser's own local
// history, which is unavoidable for any link-embedded credential — but that's
// a much smaller exposure surface than every hop of server-side logging.)
function consumeInviteLinkParams(){
  try{
    const raw = location.hash ? location.hash.slice(1) : '';
    if (!raw) return;
    const params = new URLSearchParams(raw);
    const urlFromLink = params.get('sb_url');
    const keyFromLink = params.get('sb_key');
    const roomFromLink = params.get('room');
    let consumedAnything = false;
    if (urlFromLink && keyFromLink){
      localStorage.setItem('rk_supabase_url', urlFromLink);
      localStorage.setItem('rk_supabase_key', keyFromLink);
      consumedAnything = true;
    }
    if (roomFromLink){
      saveRoomCode(roomFromLink.toUpperCase());
      consumedAnything = true;
    }
    if (consumedAnything){
      // Tidy the address bar so nothing sensitive lingers there visibly.
      history.replaceState({}, '', location.pathname + location.search);
    }
  } catch(e){ /* URLSearchParams/history not available in some contexts — ignore */ }
}
consumeInviteLinkParams();

function normalizeSupabaseProjectUrl(raw){
  let s = String(raw || '').trim();
  // Strip accidental wrapping quotes copied from docs/editors.
  s = s.replace(/^["'`]+|["'`]+$/g, '').trim();
  if (!s) return '';

  // If someone pasted a Supabase dashboard project URL, recover the project ref.
  // Example: https://supabase.com/dashboard/project/abcdefgh/settings/api
  try{
    const dash = new URL(s);
    const m = dash.pathname.match(/\/project\/([a-z0-9-]+)/i);
    if (dash.hostname === 'supabase.com' && m && m[1]){
      return `https://${m[1]}.supabase.co`;
    }
  } catch(e){}

  // createClient() expects the PROJECT ORIGIN only. If /rest/v1, /auth/v1,
  // /storage/v1, a query string, hash, or a trailing slash was pasted,
  // reduce it safely back to https://<project>.supabase.co. This is the fix
  // for "Invalid path specified in request URL" — that error comes from
  // Supabase's gateway when the base URL already has a path segment on it
  // (most commonly /rest/ copied from the wrong field in the dashboard), so
  // every subsequent request doubles up the path.
  try{
    const u = new URL(s);
    if (u.protocol !== 'https:' && u.protocol !== 'http:') return '';
    return u.origin;
  } catch(e){
    return '';
  }
}

  const savedUrlRaw = localStorage.getItem('rk_supabase_url');
  const savedKey = (localStorage.getItem('rk_supabase_key') || '').trim();

  if (savedUrl && savedKey){
    // Self-heal URLs saved by older builds (e.g. ones ending in /rest/v1).
    if (savedUrlRaw !== savedUrl) localStorage.setItem('rk_supabase_url', savedUrl);
    return { url: savedUrl, key: savedKey };

      && !SUPABASE_URL_HARDCODED.startsWith('YOUR_') && !SUPABASE_ANON_KEY_HARDCODED.startsWith('YOUR_')){

  const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no O/0/I/1 — avoids ambiguous characters when read aloud or typed

// Storage reads/writes occasionally hit a transient network or backend
// error, which is very different from "this key genuinely does not exist
// yet". Misreading a transient error as "missing" could make a caller
// overwrite real data another player already wrote. So we distinguish the
// two: only return null once we're sure the key is missing; return
// STORAGE_RETRY_LATER when unsure, so callers keep their cached copy and
// try again on the next sync instead of resetting shared state.
const STORAGE_RETRY_LATER = '__STORAGE_RETRY_LATER__';
async function safeGet(key, shared, attempts){
  const r = await safeGetVersioned(key, shared, attempts);
  if (r === STORAGE_RETRY_LATER) return STORAGE_RETRY_LATER;
  return r ? r.value : null;
}
// Reads value AND version together. The version is what makes safe concurrent
// writes possible: we hand it back on write so the database can reject our
// update if someone else changed the row in the meantime.
async function safeGetVersioned(key, shared, attempts){
  attempts = attempts || 3;
  const k = fullKey(key, shared);
  for (let i = 0; i < attempts; i++){
    try{
      const { data, error } = await sbClient.from('kv_store').select('value,version').eq('key', k).maybeSingle();
      if (error) throw error;
      return data ? { value: data.value, version: data.version } : null; // no row = genuinely missing
    } catch(e){
      if (i === attempts - 1){ console.warn('storage read hit an error, will retry next sync:', k, e); return STORAGE_RETRY_LATER; }
      await sleep(250 * (i+1));
    }
  }
}

/* ---------------------------------------------------------
   mutateShared — THE safe way to change any shared document.
   Every shared write used to be a blind read-modify-write, so two players
   acting at the same moment silently clobbered each other (both read the same
   JSON, both wrote, last writer won). That lost deployments and donations,
   and on `world` it could even roll back an entire day's settlement.
   This reads value+version, applies your mutator, then asks the database to
   write ONLY IF the version is unchanged. If someone beat us to it, we re-read
   and re-apply on top of their newer state instead of overwriting it.
--------------------------------------------------------- */
async function mutateShared(key, mutator, attempts){
  attempts = attempts || 5;
  const k = fullKey(key, true);
  for (let i = 0; i < attempts; i++){
    const cur = await safeGetVersioned(key, true);
    if (cur === STORAGE_RETRY_LATER) return { ok:false, reason:'read' };
    const base = cur ? cur.value : null;
    const expected = cur ? cur.version : -1; // -1 tells the DB "I believe this row doesn't exist yet"
    let next;
    try { next = mutator(base ? JSON.parse(JSON.stringify(base)) : null); }
    catch(e){ console.error('mutateShared mutator threw:', e); return { ok:false, reason:'mutator' }; }
    if (next === undefined || next === null) return { ok:true, value: base, version: expected, skipped:true };
    try{
      const { data, error } = await sbClient.rpc('kv_cas', { p_key:k, p_value:next, p_expected_version:expected });
      if (error) throw error;
      const row = Array.isArray(data) ? data[0] : data;
      if (row && row.ok) return { ok:true, value: next, version: row.out_version };
      // Someone else wrote first — loop and re-apply on top of their version.
      await sleep(60 * (i+1) + Math.random()*60);
    } catch(e){
      if (i === attempts - 1){ console.warn('mutateShared failed after retries:', k, e); return { ok:false, reason:'write' }; }
      await sleep(200 * (i+1));
    }
  }
  console.warn('mutateShared exhausted retries (heavy contention):', k);
  return { ok:false, reason:'contention' };
}
async function safeSet(key, value, shared, attempts){
  attempts = attempts || 3;
  const k = fullKey(key, shared);
  let lastErr = null;
  for (let i = 0; i < attempts; i++){
    try{
      const { error } = await sbClient.from('kv_store').upsert({ key: k, value, updated_at: new Date().toISOString() });
      if (error) throw error;
      return true;
    } catch(e){ lastErr = e; }
    if (i < attempts - 1) await sleep(300 * (i+1));
  }
  console.warn('storage write did not persist after retries (will retry on next action/sync):', k, lastErr);
  return null;
}

// Verifies the database has the schema this build requires. Without this the
// app "connects" fine and then fails on every single read/write, which looked
// to the user like buttons simply doing nothing. Fails loudly and specifically
// instead, naming the exact fix.
async function checkSchema(){
  try{
    const { error } = await sbClient.from('kv_store').select('value,version').eq('key', '__preflight__').maybeSingle();
    if (error){
      const msg = (error.message || '').toLowerCase();
      if (msg.includes('version') || error.code === '42703') return { ok:false, why:'missing_version_column' };
      return { ok:false, why:'unreachable', detail: `${error.message} (Project base: ${resolvedSupabaseConfig ? resolvedSupabaseConfig.url : 'unknown'})` };
    }
  } catch(e){ return { ok:false, why:'unreachable', detail: (e && e.message) || String(e) }; }
  try{
    // Harmless probe: the expected version can never match, so this returns
    // "conflict" without writing anything. It only tells us the function exists.
    const { error } = await sbClient.rpc('kv_cas', { p_key:'__preflight__', p_value:{}, p_expected_version:-999999 });
    if (error) return { ok:false, why:'missing_functions', detail: error.message };
  } catch(e){ return { ok:false, why:'missing_functions', detail: (e && e.message) || String(e) }; }
  return { ok:true };
}

async function boot(){
  if (!sbClient){ bootPhase = resolvedSupabaseConfig ? 'config_missing' : 'setup_form'; render(); return; }
  const schema = await checkSchema();
  if (!schema.ok){ schemaProblem = schema; bootPhase = 'schema_outdated'; render(); return; }
  if (!roomCode){ bootPhase = 'room_form'; render(); return; }
  const p = await safeGet('profile', false);
  // STORAGE_RETRY_LATER is a truthy string, not a real profile object — treating
  // it as "we have a profile" would silently skip onboarding and later crash
  // anywhere profile.name/profile.faction gets read. Retry a few times before
  // falling back to onboarding, same as we already do for 'world' in enterWorld().
  if (p === STORAGE_RETRY_LATER){
    let retried = p;
    for (let i = 0; i < 3 && retried === STORAGE_RETRY_LATER; i++){ await sleep(600); retried = await safeGet('profile', false); }
    profile = (retried && retried !== STORAGE_RETRY_LATER) ? retried : null;
  } else {
    profile = p;
  }
  if (!profile){ bootPhase = 'onboarding'; render(); return; }
  await enterWorld();
}
