<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Run Kingdom Lite · Online Multiplayer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<!-- Supabase JS client (free tier) — this is what makes the multiplayer world persist and sync across everyone playing. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#0a0d12; --panel:#12161d; --panel-2:#181e27; --panel-3:#1f2631; --border:#252d3a;
  --text:#e7ecf3; --text-dim:#8894a6; --text-dim2:#5c6675;
  --cinder:#ff5a3c; --cinder-dim:#4a2318;
  --surge:#34aeff; --surge-dim:#123048;
  --bloom:#57d97a; --bloom-dim:#164027;
  --neutral:#3b4250; --neutral-dim:#1c212a;
  --gold:#f2c245; --danger:#ff4d4d; --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg); color:var(--text); font-family:'Inter','Noto Sans JP','Noto Sans KR',sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh;}
.mono{font-family:'Space Mono',monospace;}
.display{font-family:'Chakra Petch',sans-serif;}
#root{
  max-width:480px; margin:0 auto; min-height:100vh;
  background:radial-gradient(ellipse 600px 300px at 50% -10%, rgba(52,174,255,0.07), transparent), var(--bg);
  display:flex; flex-direction:column; position:relative;
  border-left:1px solid var(--border); border-right:1px solid var(--border);
}
.topbar{padding:14px 16px 10px; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:20;
  background:rgba(10,13,18,0.92); backdrop-filter:blur(6px);}
.topbar-row{display:flex; justify-content:space-between; align-items:baseline;}
.season-label{font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:12px; letter-spacing:2px; color:var(--text-dim);}
.day-label{font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:13px; letter-spacing:1px; color:var(--gold);}
.lang-toggle{font-family:'Space Mono',monospace; font-size:11px; font-weight:700; color:var(--text-dim); border:1px solid var(--border); border-radius:20px; padding:2px 10px; cursor:pointer; user-select:none; background:var(--panel-3);}
.lang-toggle:active{transform:scale(0.94);}
.lang-toggle{appearance:auto; max-width:110px;}
.topbar-tools{display:flex; align-items:center; gap:7px;}
.room-code-btn{font-family:'Space Mono',monospace; font-size:10px; font-weight:700; letter-spacing:1px; color:var(--gold);
  border:1px solid rgba(248,201,74,.42); border-radius:20px; padding:3px 8px; cursor:pointer; background:rgba(248,201,74,.08);}
.room-code-btn:active{transform:scale(.96);}
.live-dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--bloom); margin-right:5px; animation:livePulse 1.6s ease-in-out infinite;}
@keyframes livePulse{0%,100%{opacity:1;} 50%{opacity:0.3;}}
.standings-row{display:flex; gap:10px; margin-top:8px;}
.standing-chip{flex:1; display:flex; align-items:center; justify-content:space-between; padding:6px 8px; border-radius:10px;
  font-family:'Space Mono',monospace; font-size:11px; border:1px solid var(--border); background:var(--panel);}
.standing-chip.me{box-shadow:0 0 0 1px currentColor inset;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block; margin-right:6px;}
.content{flex:1; padding:16px 16px 100px; overflow-y:auto;}
.card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:14px;}
.card-title{font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:12px; letter-spacing:2px; color:var(--text-dim);
  margin:0 0 10px; text-transform:uppercase;}
.big-num{font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:30px;}
.prize-box{background:linear-gradient(135deg, rgba(242,194,69,0.12), rgba(242,194,69,0.02)); border:1px solid rgba(242,194,69,0.35);
  border-radius:var(--radius); padding:14px 16px; margin-bottom:14px;}
.prize-label{font-family:'Chakra Petch',sans-serif; font-size:11px; letter-spacing:2px; color:var(--gold); font-weight:700;}
.prize-num{font-family:'Space Mono',monospace; font-size:24px; font-weight:700; color:var(--gold); margin-top:2px;}
.map-wrap{position:relative; margin:6px auto 4px; width:270px;}
.map-grid{display:grid; grid-template-columns:repeat(3,84px); grid-template-rows:repeat(3,84px); gap:9px; position:relative; z-index:2;}
.tile{border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer;
  position:relative; border:2px solid var(--neutral-dim); background:var(--neutral-dim);
  transition:background 0.6s ease, border-color 0.6s ease, transform 0.25s ease; color:var(--text);}
.tile:active{transform:scale(0.95);}
.tile .tid{font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:15px;}
.tile .tname{font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:10.5px; line-height:1.15; text-align:center; padding:0 4px; margin-top:2px;}
.tile .tvp{font-family:'Space Mono',monospace; font-size:10px; opacity:0.75; margin-top:2px;}
.tile.owner-cinder{background:linear-gradient(145deg, var(--cinder-dim), #2c140d); border-color:var(--cinder);}
.tile.owner-surge{background:linear-gradient(145deg, var(--surge-dim), #0d2032); border-color:var(--surge);}
.tile.owner-bloom{background:linear-gradient(145deg, var(--bloom-dim), #0e2718); border-color:var(--bloom);}
.tile .cap{position:absolute; top:4px; right:6px; font-size:9px; opacity:0.6; font-family:'Space Mono',monospace;}
.tile .bounty-pip{position:absolute; bottom:4px; left:6px; font-size:9px; font-family:'Space Mono',monospace; color:var(--gold);}
.tile.flash{animation:flashCap 0.9s ease;}
@keyframes flashCap{0%{transform:scale(1);} 35%{transform:scale(1.14); filter:brightness(1.8);} 100%{transform:scale(1); filter:brightness(1);}}
.tile.active-battle{animation:pulseBattle 1.3s ease-in-out infinite;}
@keyframes pulseBattle{
  0%,100%{box-shadow:0 0 0 2px rgba(242,194,69,0.3), 0 0 12px rgba(242,194,69,0.25); border-color:var(--gold);}
  50%{box-shadow:0 0 0 5px rgba(242,194,69,0.6), 0 0 26px rgba(242,194,69,0.65); border-color:#fff3cf;}
}
.btn{font-family:'Chakra Petch',sans-serif; font-weight:700; letter-spacing:0.5px; font-size:14px; border-radius:11px;
  border:none; padding:13px 18px; cursor:pointer; width:100%; transition:transform 0.15s ease, filter 0.15s ease;}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--gold); color:#171200;}
.btn-primary:disabled{background:#40403a; color:#7c7c72; cursor:not-allowed;}
.btn-outline{background:transparent; border:1px solid var(--border); color:var(--text);}
.btn-outline.selected{border-color:var(--gold); color:var(--gold); background:rgba(242,194,69,0.08);}
.btn-small{font-size:12px; padding:9px 12px; width:auto;}
.btn-row{display:flex; gap:8px;}
.btn-row .btn{flex:1;}
.bottomnav{position:sticky; bottom:0; z-index:20; display:flex; border-top:1px solid var(--border);
  background:rgba(10,13,18,0.96); backdrop-filter:blur(6px);}
.navitem{flex:1; text-align:center; padding:10px 4px 12px; cursor:pointer; color:var(--text-dim2);
  font-family:'Chakra Petch',sans-serif; font-size:10px; letter-spacing:1px; font-weight:700; border-top:2px solid transparent;}
.navitem .navicon{font-size:18px; display:block; margin-bottom:2px;}
.navitem.active{color:var(--gold); border-top-color:var(--gold);}
.pill{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:20px; font-family:'Space Mono',monospace;
  font-size:11px; font-weight:700; border:1px solid var(--border);}
.pill.leading{color:#1c3d1f; background:var(--bloom);}
.pill.close{color:#3d3512; background:var(--gold);}
.pill.behind{color:var(--text-dim); background:var(--panel-3); border-color:var(--border);}
.row-between{display:flex; justify-content:space-between; align-items:center;}
.muted{color:var(--text-dim); font-size:13px;}
.divider{height:1px; background:var(--border); margin:12px 0;}
input[type=range]{-webkit-appearance:none; width:100%; height:6px; border-radius:4px; background:var(--panel-3); outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:var(--gold);
  border:3px solid #171200; cursor:pointer; box-shadow:0 0 0 4px rgba(242,194,69,0.18);}
.fog-banner{background:linear-gradient(135deg, rgba(52,174,255,0.1), rgba(87,217,122,0.05)); border:1px solid var(--border);
  border-radius:var(--radius); padding:16px; text-align:center; margin-bottom:14px;}
.fog-banner .fogtitle{font-family:'Chakra Petch',sans-serif; font-weight:700; letter-spacing:2px; color:var(--surge); font-size:13px;}
.fog-timer{font-family:'Space Mono',monospace; font-size:26px; font-weight:700; margin-top:6px;}
.modal-backdrop{position:fixed; inset:0; background:rgba(6,8,11,0.75); z-index:50; display:flex; align-items:flex-end;
  justify-content:center; backdrop-filter:blur(3px);}
.modal-sheet{width:100%; max-width:480px; background:var(--panel); border-top-left-radius:22px; border-top-right-radius:22px;
  border:1px solid var(--border); border-bottom:none; padding:20px 18px 26px; max-height:88vh; overflow-y:auto; animation:sheetUp 0.25s ease;}
@keyframes sheetUp{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.modal-handle{width:36px; height:4px; background:var(--border); border-radius:3px; margin:0 auto 14px;}
.split-opt{border:1px solid var(--border); border-radius:10px; padding:10px; text-align:center; cursor:pointer;
  font-family:'Space Mono',monospace; font-size:13px;}
.split-opt.selected{border-color:var(--gold); color:var(--gold); background:rgba(242,194,69,0.08);}
.terr-select{display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border:1px solid var(--border);
  border-radius:10px; margin-bottom:8px; cursor:pointer;}
.terr-select.selected{border-color:var(--gold);}
.terr-select.disabled{opacity:0.35; cursor:not-allowed;}
.badge-owner{font-size:10px; padding:2px 7px; border-radius:20px; font-family:'Space Mono',monospace;}
.badge-cinder{background:var(--cinder-dim); color:var(--cinder);}
.badge-surge{background:var(--surge-dim); color:var(--surge);}
.badge-bloom{background:var(--bloom-dim); color:var(--bloom);}
.badge-neutral{background:var(--panel-3); color:var(--text-dim);}
.debug-drawer{position:fixed; top:0; bottom:0;
  /* Anchored to the RIGHT EDGE OF THE GAME CONTENT (#root, centered, max-width 480px),
     not to the physical browser window edge. On a wide desktop window the game itself
     is a narrow centered column with a lot of empty space on both sides — anchoring
     to the raw viewport edge (the old `inset:0 0 0 auto`) made the drawer slide in far
     off to the side, outside where anyone would actually be looking, which looked
     exactly like "clicking the gear icon does nothing". max() clamps back to the
     ordinary right-aligned mobile behavior once the viewport is narrower than #root. */
  right:max(0px, calc(50% - 240px));
  width:88%; max-width:400px; background:var(--panel); z-index:60;
  border-left:1px solid var(--border); padding:18px; overflow-y:auto; animation:slideIn 0.2s ease;}
@keyframes slideIn{from{transform:translateX(20px); opacity:0;} to{transform:translateX(0); opacity:1;}}
.debug-backdrop{position:fixed; inset:0; background:rgba(0,0,0,0.72); z-index:59;}
.debug-section{margin-bottom:16px;}
.debug-section h4{font-family:'Chakra Petch',sans-serif; font-size:11px; letter-spacing:1.5px; color:var(--gold);
  margin:0 0 8px; text-transform:uppercase;}
.debug-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.fab{position:fixed; bottom:78px; right:calc(50% - 240px + 16px); z-index:30; width:44px; height:44px; border-radius:50%;
  background:var(--panel-3); border:1px solid var(--border); color:var(--text-dim); display:flex; align-items:center;
  justify-content:center; cursor:pointer; font-size:16px;}
@media (max-width:520px){ .fab{right:16px;} }
.energy-readout{text-align:center; padding:14px 0;}
.chip-small{font-size:10px; padding:3px 8px; border-radius:20px; background:var(--panel-3); color:var(--text-dim); font-family:'Space Mono',monospace;}
.rally-card{border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:12px;}
.gst-tier{border:1px solid var(--border); border-radius:9px; padding:8px; text-align:center; font-family:'Space Mono',monospace; font-size:12px; cursor:pointer;}
.gst-tier.selected{border-color:var(--gold); color:var(--gold); background:rgba(242,194,69,0.08);}
.empty-note{color:var(--text-dim2); font-size:12px; text-align:center; padding:10px;}
.elim-banner{background:linear-gradient(135deg, rgba(255,90,60,0.14), rgba(255,90,60,0.02)); border:1px solid rgba(255,90,60,0.4);
  border-radius:var(--radius); padding:14px; margin-bottom:14px; text-align:center;}
.elim-banner .et{font-family:'Chakra Petch',sans-serif; font-weight:700; letter-spacing:1px; color:var(--cinder); font-size:13px;}
.onboard-wrap{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px;}
.onboard-card{width:100%; max-width:400px; background:var(--panel); border:1px solid var(--border); border-radius:18px; padding:24px;}
.team-pick{display:flex; flex-direction:column; gap:10px; margin:14px 0;}
.team-opt{display:flex; align-items:center; gap:10px; padding:14px; border:2px solid var(--border); border-radius:12px; cursor:pointer;}
.team-opt.selected{border-color:var(--gold); background:rgba(242,194,69,0.06);}
.team-opt .swatch{width:20px; height:20px; border-radius:50%;}
.name-input{width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border); background:var(--panel-3);
  color:var(--text); font-family:'Inter',sans-serif; font-size:14px; margin-top:8px;}
.loading-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; color:var(--text-dim); font-family:'Chakra Petch',sans-serif;}
.sync-error{background:rgba(255,77,77,0.12); border:1px solid rgba(255,77,77,0.4); border-radius:12px; padding:12px 14px;
  margin-bottom:14px; font-size:13px;}
.sync-error .se-title{color:var(--danger); font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:12px; letter-spacing:1px; margin-bottom:4px;}
.sync-error .se-row{display:flex; gap:8px; margin-top:8px;}
</style>
</head>

function tr(key, vars){
  const table = I18N[LANG];
  let s = (table && table[key] !== undefined) ? table[key] : key;
  if (vars){ Object.keys(vars).forEach(k => { s = s.split('{'+k+'}').join(vars[k]); }); }
  return s;
}
function setLang(l){
  LANG = ['en','zh','ja','ko','tr','ru'].includes(l) ? l : 'en';
  try { localStorage.setItem('rk_lang', LANG); } catch(e){}
  document.documentElement.lang = ({en:'en',zh:'zh-CN',ja:'ja',ko:'ko',tr:'tr',ru:'ru'})[LANG] || 'en';
  render();
}

// Safety net: if ANY unexpected error happens while the script is first
// loading — before the game has managed to render anything at all — show
// that error on screen instead of leaving a silent blank/black page. This
// is registered as early as possible, before any of the riskier setup code
// below (like connecting to Supabase) runs.
window.addEventListener('error', function(e){
  const root = document.getElementById('root');
  if (root && !root.innerHTML.trim()){
    const msg = (e && e.message) ? e.message : 'Unknown error';
    root.innerHTML = '<div style="padding:24px; color:#e7ecf3; font-family:sans-serif; background:#0a0d12; min-height:100vh; box-sizing:border-box;">'
      + '<h3 style="color:#ff4d4d; margin-top:0;">Something went wrong loading the game</h3>'
      + '<p style="opacity:0.85; font-size:13px; word-break:break-word;">' + msg + '</p>'
      + '<p style="opacity:0.6; font-size:12px;">Press F12 to see the full error in your browser console. If you hand-edited this file, try re-downloading a fresh copy instead of editing it — see the setup form / DEPLOYMENT_GUIDE.md.</p>'
      + '<p style="opacity:0.3; font-size:10px; font-family:monospace;">' + APP_BUILD + '</p>'
      + '</div>';
  }
});

  // Battle resolution is manual (any player can trigger it via the Resolve
  // Day button) rather than on a real-time countdown — this avoids many
  // clients' timers racing to hit the same deadline simultaneously, which
  // was contributing to storage rate-limit errors under multiplayer load.
  // Realtime (Postgres websocket push) is the primary sync mechanism now —
  // this poll is only a safety net for a missed realtime message, so it can
  // run much less often than it did in the Claude-artifact/polling-only version.
  pollMs: 20000,             // base polling interval (jitter added per-client below)
  heartbeatMs: 45000,        // how often we refresh our own "last seen" in the roster
  onlineWindowMs: 100000,    // someone counts as "online now" if seen within this window
  energy: { min: 0, max: 90, step: 0.2 }, // slider UI range; the power curve itself has no upper cap (see energyToPower)
  splitPresets: [[100,0],[75,25],[50,50]],
  maxActiveBattlesPerDay: 3,
  vpBase: { normal: 1, center: 2 },
  // Smoothed for a 7-day round: gentle 1.0 -> 2.0x ramp instead of big 1/2/3/4x jumps.
  vpMultiplier: (day) => day <= 2 ? 1.0 : day <= 4 ? 1.25 : day <= 6 ? 1.5 : 2.0,
  // ---- Final-day structural comeback point ----
  // On the last day of a round, Kingmaker (E) is worth 3x and is FORCED to be
  // an active battle. This is a transparent, published rule (shown from day 1)
  // rather than a hidden balancing nudge — it creates one genuine "all in"
  // decisive fight instead of secretly boosting whoever is losing.
  finalDayKingmakerMultiplier: 3,
  bountyThresholds: [
    { min: 2, max: 3, level: 1, bonus: 1,   mult: 1.15 },
    { min: 4, max: 5, level: 2, bonus: 1.5, mult: 1.3 },
    { min: 6, max: 999, level: 3, bonus: 2, mult: 1.5 },
  ],
  // BUG FIX 2 — background NPC power used to be 3,200–11,800 while a real
  // player contributes roughly 8–30. Real deployment was therefore ~0.3% of a
  // battle's total and could never change an outcome: results were decided
  // entirely by the NPC roll. This range is now comparable to one real
  // player's contribution, so deployments actually decide battles. With many
  // real players a faction's combined power correctly outweighs the NPC

  npcPower: { min: 4, max: 40 },
  gstTiers: [0, 5, 10, 15, 20],
  // 90% prize / 4% burn / 6% protocol — total rake down to 10% (was 20%), so

  gmtSplit: { prize: 0.90, burn: 0.04, protocol: 0.06 },

  rewardDistribution: { 1: 0.50, 2: 0.32, 3: 0.18 },
  poolSplit: { participation: 0.40, contribution: 0.60 },
  participationThreshold: 4, // days within a round
  startingPrizePool: 4200,
  seasonEntryFeeGMT: 5,
  startingWalletGMT: 10000,
  // ---- Commander ----
  commanderTopPercent: 0.20,      // must be in your faction's top 20% by last-7-day energy to stand
  commanderMaxConsecutiveRounds: 2,
  commanderMessageMaxChars: 80,
  // Nominations stay open through this many days at the start of each round.
  // Without a window, whoever nominated first was instantly elected and

  commanderNominationDays: 1,
};

/* =========================================================
   PURE GAME LOGIC (deterministic — safe under concurrent writers)
========================================================= */
function clamp(n,min,max){ return Math.max(min, Math.min(max,n)); }
function round2(n){ return Math.round(n*100)/100; }

function energyToPower(energy){
  // Only the lower bound is clamped — negative energy makes no sense. There's
  // deliberately no upper clamp: if a real day's Energy sync ever reports
  // more than the slider's 90 max (e.g. an unusually long run), we keep
  // applying the same 75-90 tier rate (1 Power per 6 Energy) rather than
  // freezing the reward at the Energy=90 value.
  const e = Math.max(CONFIG.energy.min, energy);
  let p;
  if (e <= 20) p = e/2;
  else if (e <= 40) p = 10 + (e-20)/3;
  else if (e <= 60) p = 16.6667 + (e-40)/4;
  else if (e <= 75) p = 21.6667 + (e-60)/5;
  else p = 24.6667 + (e-75)/6;
  return round2(p);
}
function applyGSTBoost(power, pct){ if (power <= 0) return 0; return round2(power * (1 + pct/100)); }

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashSeed(str){
  let h = 1779033703 ^ str.length;
  for (let i=0;i<str.length;i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  return (h ^ h >>> 16) >>> 0;
}
function rngFor(...parts){ return mulberry32(hashSeed(parts.join('|') + '|' + CONFIG.seed)); }

function factionOwnsAny(f, ownership){ return TERRITORIES.some(t => ownership[t] === f); }

function isFrontline(t, ownership){
  const owner = ownership[t]; const neighbors = ADJ[t];
  if (!owner) return neighbors.some(n => ownership[n]);
  return neighbors.some(n => ownership[n] && ownership[n] !== owner);
}
function getEligibleFrontlines(ownership){ return TERRITORIES.filter(t => isFrontline(t, ownership)); }
function getEligibleFactions(t, ownership){
  const owner = ownership[t]; const set = new Set();
  if (owner) set.add(owner);
  ADJ[t].forEach(n => { if (ownership[n]) set.add(ownership[n]); });
  return [...set];
}
// Rule 3: if a faction owns zero territories, it may attack any of today's open battles (adjacency not required)
function effectiveEligibleFactions(t, ownership, activeBattles, day){
  const set = new Set(getEligibleFactions(t, ownership));
  if (activeBattles.includes(t)){
    FACTIONS.forEach(f => { if (!factionOwnsAny(f, ownership)) set.add(f); });
  }
  // FINAL DAY KINGMAKER: every faction can commit to E regardless of
  // adjacency. Without this, forcing E open on the last day could produce a
  // battle almost nobody is allowed to join (E may not border their land),
  // which would quietly defeat the whole point of the decisive showdown.
  if (t === 'E' && isFinalDay(day) && activeBattles.includes('E')){
    FACTIONS.forEach(f => set.add(f));
  }
  return [...set];
}
function getBountyLevel(holdDays){
  for (const b of CONFIG.bountyThresholds) if (holdDays >= b.min && holdDays <= b.max) return b.level;
  return 0;
}
function bountyMultiplier(level){ return level === 0 ? 1.0 : CONFIG.bountyThresholds[level-1].mult; }
function bountyBonusVP(level){ return level === 0 ? 0 : CONFIG.bountyThresholds[level-1].bonus; }

function weightedPickWithoutReplacement(items, n, rng){
  const pool = items.map(i => ({...i})); const picked = [];
  while (picked.length < n && pool.length){
    const total = pool.reduce((s,i)=>s+i.weight,0);
    let r = rng() * total; let idx = 0;
    for (; idx < pool.length; idx++){ r -= pool[idx].weight; if (r <= 0) break; }
    idx = Math.min(idx, pool.length-1);
    picked.push(pool[idx]); pool.splice(idx,1);
  }
  return picked;
}
function selectActiveBattles(day, ownership, holdDays, repHistory){
  const candidates = getEligibleFrontlines(ownership);
  if (!candidates.length) return [];
  const weighted = candidates.map(t => {
    const level = getBountyLevel(holdDays[t] || 0);
    const bMult = bountyMultiplier(level);
    const h = repHistory[t] || [];
    const last = h[h.length-1], prev = h[h.length-2];
    let rep = 1.0; if (last && prev) rep = 0.15; else if (last) rep = 0.5;
    return { t, weight: 1 * bMult * rep };
  });
  const rng = rngFor('battles', day);
  let picked = weightedPickWithoutReplacement(weighted, Math.min(CONFIG.maxActiveBattlesPerDay, weighted.length), rng);

  // "Meaningful participation" means an OFFENSIVE opportunity — a chance to
  // contest a tile you don't already own. Being merely eligible to defend a
  // tile you already hold doesn't count as a real choice: if that's the only
  // thing on offer, you have zero decisions to make that day. Without this
  // distinction, a faction boxed into a single starting Capital could be
  // "covered" purely because it can defend that Capital, even when none of
  // today's picks touch its border — leaving it with nothing to actually do.
  const offensiveEligible = (f, t) => ownership[t] !== f && getEligibleFactions(t, ownership).includes(f);
  const coverageOf = (battleList) => {
    const covered = new Set();
    battleList.forEach(t => FACTIONS.forEach(f => { if (offensiveEligible(f, t)) covered.add(f); }));
    return covered;
  };

  const missing = FACTIONS.filter(f => !coverageOf(picked.map(p=>p.t)).has(f));
  const protectedIdx = new Set(); // slots already used to fix a faction this call — don't undo them
  for (const f of missing){
    if (coverageOf(picked.map(p=>p.t)).has(f)) continue; // an earlier swap may have incidentally covered this one too
    const alt = weighted
      .filter(w => !picked.find(p => p.t === w.t))
      .filter(w => offensiveEligible(f, w.t))
      .sort((a,b) => b.weight - a.weight)[0];
    if (!alt || !picked.length) continue;
    const swappable = picked.map((p,i)=>({i, w:p.weight})).filter(x => !protectedIdx.has(x.i));
    if (!swappable.length) continue;
    const lowIdx = swappable.sort((a,b)=>a.w-b.w)[0].i;
    picked[lowIdx] = alt;
    protectedIdx.add(lowIdx);
  }

  let result = picked.map(p => p.t);
  // FINAL DAY: Kingmaker must be on the board. Without this the 3x decisive
  // battle would simply not happen on most rounds, since battle selection is
  // weighted-random and E is not guaranteed to be drawn. E is always eligible
  // on the final day even if it isn't currently a frontline, so the advertised
  // "final day showdown" rule is never a no-op.
  if (isFinalDay(day) && !result.includes('E')){
    if (result.length >= CONFIG.maxActiveBattlesPerDay) result[result.length - 1] = 'E';
    else result.push('E');
  }
  return result;
}
function generateBaselinePower(day, territory, faction, runId){
  // BUG FIX 1 — seed now includes runId. Previously the seed was only
  // (day, territory, faction), so the "random" background power was the
  // exact same number in every game, every room, forever: the same tile on
  // the same day always produced the identical winner regardless of what
  // any player did. Adding runId makes each round genuinely different.
  const rng = rngFor('power', runId || '', day, territory, faction);
  const { min, max } = CONFIG.npcPower;
  return round2(min + rng() * (max - min));
}
function calculateBattleStatus(powerMap){
  const entries = Object.entries(powerMap);
  if (!entries.length) return {};
  const max = Math.max(...entries.map(e=>e[1])); const out = {};
  entries.forEach(([f,p]) => { out[f] = p===max ? 'LEADING' : (p >= max*0.9 ? 'CLOSE' : 'BEHIND'); });
  return out;
}
function resolveBattle(powerMap, currentOwner){
  const entries = Object.entries(powerMap);
  if (!entries.length) return { winner: currentOwner, tie: false };
  const max = Math.max(...entries.map(e=>e[1]));
  // Zero power can never capture anything. Previously, a tile whose only
  // eligible attacker had 0 power was handed to that attacker unopposed —
  // `max` was 0, that faction was the unique "top" scorer, and it won. With
  // NPC power off and nobody playing, territory therefore changed hands on
  // its own every settlement, which looked exactly like the map moving by
  // itself. If nobody committed any power, nothing changes: the defender
  // holds and a neutral tile stays neutral.
  if (max <= 0) return { winner: currentOwner, tie: true };
  const top = entries.filter(([,p]) => p === max).map(([f]) => f);
  if (top.length > 1) return { winner: currentOwner, tie: true };
  return { winner: top[0], tie: false };
}
function isFinalDay(day){ return day >= CONFIG.roundDays; }
// True once the round's 7 days are fully settled — covers BOTH 'roundEnd'
// (rounds 1-5, next round still to come) and 'seasonEnd' (after round 6).
function roundIsOver(){ return world && (world.phase === 'roundEnd' || world.phase === 'seasonEnd'); }
// On the final day, Kingmaker (E) is worth finalDayKingmakerMultiplier x its
// base value. Kept as a standalone helper so both VP scoring and the UI
// (which advertises this from day 1) read from exactly the same rule.
function vpValueOf(t, day){
  const base = baseVPof(t);
  if (t === 'E' && isFinalDay(day)) return base * CONFIG.finalDayKingmakerMultiplier;
  return base;
}
function calculateDailyVP(ownership, day){
  const mult = CONFIG.vpMultiplier(day); const totals = { cinder:0, surge:0, bloom:0 };
  TERRITORIES.forEach(t => {
    const o = ownership[t]; if (!o) return;
    // Final-day Kingmaker already includes its published ×3 value in vpValueOf().
    // Do not apply the day multiplier a second time, otherwise the UI says 6 VP
    // while settlement awards 12 VP on Day 7.
    totals[o] += (t === 'E' && isFinalDay(day)) ? vpValueOf(t, day) : baseVPof(t) * mult;
  });
  return totals;
}

   STORAGE HELPERS (shared = cross-player world / personal = this browser only)
========================================================= */
function sleep(ms){ return new Promise(res => setTimeout(res, ms)); }

// ---- Supabase client ----
// All game data lives in one simple table: kv_store(key text primary key,
// value jsonb, updated_at timestamptz). See schema.sql for the exact setup.
// This mirrors the same get/set-by-key model the rest of the game already
// expects, so none of the game logic below had to change — only this layer.
//
// ---- Resolve Supabase config: saved in this browser > embedded in an
// invite link's URL params (first visit) > the optional hardcoded constants
// above. This is what lets deployment work with zero file editing.
// ---- Resolve config from an invite link, if this is a first visit via one ----
// All of sb_url/sb_key/room are read from ONE combined pass over the URL, and
// the cleanup (removing them from the visible address) happens exactly once
// at the end — reading them in separate functions with separate
// history.replaceState() calls would have the first call wipe out params the
// second call still needed to see.
//
// These live in the URL FRAGMENT (after '#'), not the query string (after
// '?'). A browser never sends the fragment portion of a URL to the server in
// the actual HTTP request — so putting the anon key there means it can't
// show up in server access logs, CDN logs, or Referer headers the way a
// query-string value could. (It's still visible in the browser's own local
// history, which is unavoidable for any link-embedded credential — but that's
// a much smaller exposure surface than every hop of server-side logging.)
function consumeInviteLinkParams(){
  try{
    const raw = location.hash ? location.hash.slice(1) : '';
    if (!raw) return;
    const params = new URLSearchParams(raw);
    const urlFromLink = params.get('sb_url');
    const keyFromLink = params.get('sb_key');
    const roomFromLink = params.get('room');
    let consumedAnything = false;
    if (urlFromLink && keyFromLink){
      localStorage.setItem('rk_supabase_url', urlFromLink);
      localStorage.setItem('rk_supabase_key', keyFromLink);
      consumedAnything = true;
    }
    if (roomFromLink){
      saveRoomCode(roomFromLink.toUpperCase());
      consumedAnything = true;
    }
    if (consumedAnything){
      // Tidy the address bar so nothing sensitive lingers there visibly.
      history.replaceState({}, '', location.pathname + location.search);
    }
  } catch(e){ /* URLSearchParams/history not available in some contexts — ignore */ }
}
consumeInviteLinkParams();

function normalizeSupabaseProjectUrl(raw){
  let s = String(raw || '').trim();
  // Strip accidental wrapping quotes copied from docs/editors.
  s = s.replace(/^["'`]+|["'`]+$/g, '').trim();
  if (!s) return '';

  // If someone pasted a Supabase dashboard project URL, recover the project ref.
  // Example: https://supabase.com/dashboard/project/abcdefgh/settings/api
  try{
    const dash = new URL(s);
    const m = dash.pathname.match(/\/project\/([a-z0-9-]+)/i);
    if (dash.hostname === 'supabase.com' && m && m[1]){
      return `https://${m[1]}.supabase.co`;
    }
  } catch(e){}

  // createClient() expects the PROJECT ORIGIN only. If /rest/v1, /auth/v1,
  // /storage/v1, a query string, hash, or a trailing slash was pasted,
  // reduce it safely back to https://<project>.supabase.co. This is the fix
  // for "Invalid path specified in request URL" — that error comes from
  // Supabase's gateway when the base URL already has a path segment on it
  // (most commonly /rest/ copied from the wrong field in the dashboard), so
  // every subsequent request doubles up the path.
  try{
    const u = new URL(s);
    if (u.protocol !== 'https:' && u.protocol !== 'http:') return '';
    return u.origin;
  } catch(e){
    return '';
  }
}

function readSupabaseConfig(){
  const savedUrlRaw = localStorage.getItem('rk_supabase_url');
  const savedKey = (localStorage.getItem('rk_supabase_key') || '').trim();
  const savedUrl = normalizeSupabaseProjectUrl(savedUrlRaw);
  if (savedUrl && savedKey){
    // Self-heal URLs saved by older builds (e.g. ones ending in /rest/v1).
    if (savedUrlRaw !== savedUrl) localStorage.setItem('rk_supabase_url', savedUrl);
    return { url: savedUrl, key: savedKey };
  }

  if (SUPABASE_URL_HARDCODED && SUPABASE_ANON_KEY_HARDCODED
      && !SUPABASE_URL_HARDCODED.startsWith('YOUR_') && !SUPABASE_ANON_KEY_HARDCODED.startsWith('YOUR_')){
    const hardcodedUrl = normalizeSupabaseProjectUrl(SUPABASE_URL_HARDCODED);
    if (hardcodedUrl) return { url: hardcodedUrl, key: SUPABASE_ANON_KEY_HARDCODED.trim() };
  }
  return null;
}

// IMPORTANT: createClient() can throw SYNCHRONOUSLY if the URL/key look
// malformed. Since this file is a single <script>, an uncaught synchronous
// throw here would stop the ENTIRE script before it ever reaches
// render()/boot() at the bottom — the page would just stay blank/black
// with no error shown. Wrapping this in try/catch turns that into a clear
// on-screen "couldn't connect" message instead.
// NOTE: our own client instance is intentionally named "sbClient", NOT
// "supabase" — the Supabase library itself defines a global called
// `supabase` (that's what `window.supabase.createClient` is), and a plain
// `let supabase = ...` in this script collides with that as a hard
// SyntaxError ("Identifier 'supabase' has already been declared"), which
// silently prevents the ENTIRE script from running (a parse error, not a
// catchable runtime exception — no try/catch or error handler can help
// with this one, which is why it looked like a totally blank page with
// nothing, not even our own error-reporting UI).
let sbClient = null;
let supabaseInitError = null;
let resolvedSupabaseConfig = readSupabaseConfig();
function connectSupabase(cfg){
  sbClient = null; supabaseInitError = null;
  if (!cfg || typeof window.supabase === 'undefined') return;
  try{
    sbClient = window.supabase.createClient(cfg.url, cfg.key, {
      auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:false }
    });
  } catch(e){
    sbClient = null;
    supabaseInitError = (e && e.message) ? e.message : String(e);
    console.error('Supabase client failed to initialize:', e);
  }
}
connectSupabase(resolvedSupabaseConfig);

function buildInviteLink(){
  if (!resolvedSupabaseConfig) return null;
  const base = location.origin + location.pathname;
  const parts = [`sb_url=${encodeURIComponent(resolvedSupabaseConfig.url)}`, `sb_key=${encodeURIComponent(resolvedSupabaseConfig.key)}`];
  if (roomCode) parts.push(`room=${encodeURIComponent(roomCode)}`);
  return `${base}#${parts.join('&')}`;
}
function forgetSupabaseConfig(){
  localStorage.removeItem('rk_supabase_url');
  localStorage.removeItem('rk_supabase_key');
  location.reload();
}
function forgetRoomCode(){
  localStorage.removeItem('rk_room_code');
  location.reload();
}

// Identity is issued by Supabase Auth. Anonymous sessions persist in this
// browser and receive the authenticated database role, so RLS can distinguish
// real users instead of trusting a locally invented id.
let LOCAL_PLAYER_ID = null;
let isRoomAdmin = false;
async function ensureAuthenticated(){
  const { data:sessionData, error:sessionError } = await sbClient.auth.getSession();
  if (sessionError) throw sessionError;
  let session = sessionData && sessionData.session;
  if (!session){
    const { data, error } = await sbClient.auth.signInAnonymously();
    if (error) throw error;
    session = data && data.session;
  }
  if (!session || !session.user) throw new Error('Anonymous sign-in did not return a user. Enable Anonymous Sign-Ins in Supabase Authentication settings.');
  LOCAL_PLAYER_ID = session.user.id;
  return session.user;
}

// ---- Room code ----
// Without this, every single person who connects a game to the same
// Supabase project lands in the exact same shared world — there was no way
// to run more than one concurrent game (different teams, repeated test
// sessions, etc.) on one project. A room code is just an extra prefix on
// every shared key, so different rooms are fully independent worlds even
// though they all live in the same `kv_store` table.
function getSavedRoomCode(){ return localStorage.getItem('rk_room_code') || null; }
function saveRoomCode(code){ localStorage.setItem('rk_room_code', code); }
function generateRoomCode(){
  const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no O/0/I/1 — avoids ambiguous characters when read aloud or typed
  let code = '';
  for (let i = 0; i < 5; i++) code += alphabet[Math.floor(Math.random() * alphabet.length)];
  return code;
}

function fullKey(key, shared){ return shared ? key : `personal:${LOCAL_PLAYER_ID}:${key}`; }

// Storage reads/writes occasionally hit a transient network or backend
// error, which is very different from "this key genuinely does not exist
// yet". Misreading a transient error as "missing" could make a caller
// overwrite real data another player already wrote. So we distinguish the
// two: only return null once we're sure the key is missing; return
// STORAGE_RETRY_LATER when unsure, so callers keep their cached copy and
// try again on the next sync instead of resetting shared state.
const STORAGE_RETRY_LATER = '__STORAGE_RETRY_LATER__';
async function safeGet(key, shared, attempts){
  const r = await safeGetVersioned(key, shared, attempts);
  if (r === STORAGE_RETRY_LATER) return STORAGE_RETRY_LATER;
  return r ? r.value : null;
}
// Reads value AND version together. The version is what makes safe concurrent
// writes possible: we hand it back on write so the database can reject our
// update if someone else changed the row in the meantime.
async function safeGetVersioned(key, shared, attempts){
  attempts = attempts || 3;
  const k = fullKey(key, shared);
  for (let i = 0; i < attempts; i++){
    try{
      const { data, error } = await sbClient.from('kv_store').select('value,version').eq('key', k).maybeSingle();
      if (error) throw error;
      return data ? { value: data.value, version: data.version } : null; // no row = genuinely missing
    } catch(e){
      if (i === attempts - 1){ console.warn('storage read hit an error, will retry next sync:', k, e); return STORAGE_RETRY_LATER; }
      await sleep(250 * (i+1));
    }
  }
}

/* ---------------------------------------------------------
   mutateShared — THE safe way to change any shared document.
   Every shared write used to be a blind read-modify-write, so two players
   acting at the same moment silently clobbered each other (both read the same
   JSON, both wrote, last writer won). That lost deployments and donations,
   and on `world` it could even roll back an entire day's settlement.
   This reads value+version, applies your mutator, then asks the database to
   write ONLY IF the version is unchanged. If someone beat us to it, we re-read
   and re-apply on top of their newer state instead of overwriting it.
--------------------------------------------------------- */
async function mutateShared(key, mutator, attempts){
  attempts = attempts || 5;
  const k = fullKey(key, true);
  for (let i = 0; i < attempts; i++){
    const cur = await safeGetVersioned(key, true);
    if (cur === STORAGE_RETRY_LATER) return { ok:false, reason:'read' };
    const base = cur ? cur.value : null;
    const expected = cur ? cur.version : -1; // -1 tells the DB "I believe this row doesn't exist yet"
    let next;
    try { next = mutator(base ? JSON.parse(JSON.stringify(base)) : null); }
    catch(e){ console.error('mutateShared mutator threw:', e); return { ok:false, reason:'mutator' }; }
    if (next === undefined || next === null) return { ok:true, value: base, version: expected, skipped:true };
    try{
      const { data, error } = await sbClient.rpc('kv_cas', { p_key:k, p_value:next, p_expected_version:expected });
      if (error) throw error;
      const row = Array.isArray(data) ? data[0] : data;
      if (row && row.ok) return { ok:true, value: next, version: row.out_version };
      // Someone else wrote first — loop and re-apply on top of their version.
      await sleep(60 * (i+1) + Math.random()*60);
    } catch(e){
      if (i === attempts - 1){ console.warn('mutateShared failed after retries:', k, e); return { ok:false, reason:'write' }; }
      await sleep(200 * (i+1));
    }
  }
  console.warn('mutateShared exhausted retries (heavy contention):', k);
  return { ok:false, reason:'contention' };
}
async function safeSet(key, value, shared, attempts){
  attempts = attempts || 3;
  const k = fullKey(key, shared);
  let lastErr = null;
  for (let i = 0; i < attempts; i++){
    try{
      let error = null;
      if (shared){
        ({ error } = await sbClient.rpc('rk_admin_set', { p_key:k, p_value:value }));
      } else {
        ({ error } = await sbClient.rpc('rk_set_personal', { p_key:k, p_value:value }));
      }
      if (error) throw error;
      return true;
    } catch(e){ lastErr = e; }
    if (i < attempts - 1) await sleep(300 * (i+1));
  }
  console.warn('storage write did not persist after retries (will retry on next action/sync):', k, lastErr);
  return null;
}

// Verifies the database has the schema this build requires. Without this the
// app "connects" fine and then fails on every single read/write, which looked
// to the user like buttons simply doing nothing. Fails loudly and specifically
// instead, naming the exact fix.
async function checkSchema(){
  try{
    const { data, error } = await sbClient.rpc('rk_schema_version');
    if (error) return { ok:false, why:'missing_functions', detail:error.message };
    if (data !== '0.5.2') return { ok:false, why:'missing_functions', detail:'Community schema v0.5.2 is required.' };
  } catch(e){ return { ok:false, why:'unreachable', detail:(e && e.message)||String(e) }; }
  return { ok:true };
}

async function boot(){
  if (!sbClient){ bootPhase = resolvedSupabaseConfig ? 'config_missing' : 'setup_form'; render(); return; }
  try{ await ensureAuthenticated(); }
  catch(e){ schemaProblem={ why:'auth', detail:(e&&e.message)||String(e) }; bootPhase='schema_outdated'; render(); return; }
  const schema = await checkSchema();
  if (!schema.ok){ schemaProblem = schema; bootPhase = 'schema_outdated'; render(); return; }
  if (!roomCode){ bootPhase = 'room_form'; render(); return; }
  try{
    const { error:joinError } = await sbClient.rpc('rk_join_room', { p_code:roomCode });
    if (joinError) throw joinError;
    const { data:info, error:infoError } = await sbClient.rpc('rk_session_info', { p_room:roomCode });
    if (infoError) throw infoError;
    isRoomAdmin = !!(info && info.role === 'admin');
  } catch(e){
    localStorage.removeItem('rk_room_code'); roomCode=null;
    lastSyncError={ message:tr('Room not found. Check the code, or create a new room.'), retry:()=>{ lastSyncError=null; } };
    bootPhase='room_form'; render(); return;
  }
  const p = await safeGet(profileKey(), false);
  // STORAGE_RETRY_LATER is a truthy string, not a real profile object — treating
  // it as "we have a profile" would silently skip onboarding and later crash
  // anywhere profile.name/profile.faction gets read. Retry a few times before
  // falling back to onboarding, same as we already do for 'world' in enterWorld().
  if (p === STORAGE_RETRY_LATER){
    let retried = p;
    for (let i = 0; i < 3 && retried === STORAGE_RETRY_LATER; i++){ await sleep(600); retried = await safeGet('profile', false); }
    profile = (retried && retried !== STORAGE_RETRY_LATER) ? retried : null;
  } else {
    profile = p;
  }
  if (!profile){ bootPhase = 'onboarding'; render(); return; }
  await enterWorld();
}

// Faction is ASSIGNED, never chosen. Self-selection reliably produces a death
// spiral (everyone piles onto last round's winner → strong gets stronger →
// weak factions quit). We balance by TOTAL RECENT ENERGY rather than by
// headcount, because energy is the real input to battle power — three equal
// headcounts with wildly different energy is not a fair board.
// Note this is entry-side fairness only; it is NOT the "secretly boost the
// losing faction" balancing that the design principles rule out.
function assignFaction(recentEnergy, factionEnergy){
  const totals = { ...(factionEnergy || { cinder:0, surge:0, bloom:0 }) };
  let best = FACTIONS[0];
  FACTIONS.forEach(f => { if ((totals[f] || 0) < (totals[best] || 0)) best = f; });
  return best;
}

async function submitOnboardingInner(){
  const name = (onboardName || '').trim() || ('Runner_' + Math.floor(1000+Math.random()*9000));
  // Pull the freshest season-level energy tallies so two people joining at
  // nearly the same time don't both get assigned to the same "lightest" faction.
  // This also CREATES the world if we're the first player in this room —
  // assignment can't happen without it.
  let fresh = await ensureWorldLoaded();
  if (!fresh){
    lastSyncError = { message: 'Could not reach the game world. If you just updated the game, re-run schema.sql in Supabase (SQL Editor) — the new version needs the version column and the kv_cas/kv_add_deploy/kv_assign_faction functions.', retry: () => { lastSyncError = null; submitOnboarding(); } };
    bootPhase = 'onboarding'; render(); return;
  }
  const recentEnergy = onboardRecentEnergy;
  // Pick the lightest faction AND book our energy into it in a single atomic
  // database call. Doing this as read-then-write in the client meant two
  // people joining at the same instant both saw the same "lightest" faction
  // and both got put there, and one of the two energy writes was then lost.
  let faction = null;
  try{
    const { data, error } = await sbClient.rpc('kv_assign_faction', { p_key: fullKey(worldKey(), true), p_energy: recentEnergy, p_name:name });
    if (error) throw error;
    faction = data;
  } catch(e){ console.warn('secure faction assignment failed:', e); }
  if (!faction) throw new Error('The server could not assign your faction. Please retry.');

  profile = { name, faction, recentEnergy, seasonId: fresh.seasonId };
  const okProfile = await safeSet(profileKey(), profile, false);
  if (!okProfile){
    lastSyncError = { message: 'Could not save your profile. Please retry.', retry: () => { lastSyncError = null; submitOnboarding(); } };
    bootPhase = 'onboarding'; render(); return;
  }
  bootPhase = 'loading'; render();
  await enterWorld();
}

async function ensureBattlesDoc(day){
  const key = dayKey(world.runId, 'battles', day);
  let doc = await safeGet(key, true);
  if (doc && doc !== STORAGE_RETRY_LATER) return doc;
  // Battle generation is a pure function (same inputs always produce the same
  // result), so recomputing it here after a transient read failure is safe —
  // it can't conflict with a copy another player already saved.
  doc = generateBattlesDocPure(day, world.ownership, world.holdDays, world.repHistory, world.npcPowerEnabled, world.runId);
  await safeSet(key, doc, true);
  const updatedRepHistory = advanceRepHistory(world.repHistory, doc.activeBattles);
  // Only write 'world' again if repHistory actually needs updating (it may
  // already have been folded into the settlement write that created this day —
  // see settleCurrentDay — so this is normally a no-op, saving a write.)
  if (JSON.stringify(updatedRepHistory) !== JSON.stringify(world.repHistory)){
    const rr = await mutateShared(worldKey(), (w) => {
      if (!w || w.runId !== world.runId || w.currentDay !== day) return null;
      return { ...w, repHistory: updatedRepHistory };
    });
    if (rr.ok && rr.value) world = rr.value;
  }
  return doc;
}
function generateBattlesDocPure(day, ownership, holdDays, repHistory, npcPowerEnabled, runId){
  const activeBattles = selectActiveBattles(day, ownership, holdDays, repHistory);
  const baseline = {};
  activeBattles.forEach(t => {
    baseline[t] = {};
    effectiveEligibleFactions(t, ownership, activeBattles, day).forEach(f => {
      // NPC/background power represents "everyone else in this faction who
      // isn't you" — it's what makes territories move even when you've only
      // deployed to one of them. Turning it off (debug panel) makes outcomes
      // depend ONLY on real deployed power, which is what solo testing
      // usually expects: nothing you didn't touch should change hands.
      baseline[t][f] = npcPowerEnabled === false ? 0 : generateBaselinePower(day, t, f, runId);
    });
  });
  return { activeBattles, baseline };
}
function advanceRepHistory(repHistory, activeBattles){
  const out = {};
  TERRITORIES.forEach(t => { const arr = (repHistory[t]||[]).slice(); arr.push(activeBattles.includes(t)); out[t] = arr.slice(-2); });
  return out;
}

  return { name: profile.name, faction: profile.faction, recentEnergy: profile.recentEnergy || 0, lastSeen: Date.now() };
}
// Keyed by LOCAL_PLAYER_ID, NOT by display name — two different people can
// pick the same name, which would silently merge them into one entry.
// CAS-guarded so two players heartbeating at once can't drop each other.
async function joinRoster(){
  const { data, error } = await sbClient.rpc('rk_heartbeat',{p_room:roomCode,p_name:profile.name});
  if (!error && data){ roster=data; lastHeartbeatAt=Date.now(); }
}
async function refreshRoster(){
  if (Date.now() - lastHeartbeatAt > CONFIG.heartbeatMs){
    const { data, error }=await sbClient.rpc('rk_heartbeat',{p_room:roomCode,p_name:profile.name});
    if (!error && data){ roster=data; lastHeartbeatAt=Date.now(); }
  }
}
function rosterStats(){
  if (!roster) return { total: 0, online: 0, byFaction: {cinder:0,surge:0,bloom:0}, onlineByFaction: {cinder:0,surge:0,bloom:0}, entries: [] };
  const now = Date.now();
  const entries = Object.entries(roster).map(([id, r]) => ({ id, name: r.name || id, faction: r.faction, online: (now - r.lastSeen) <= CONFIG.onlineWindowMs }));
  const byFaction = {cinder:0,surge:0,bloom:0}, onlineByFaction = {cinder:0,surge:0,bloom:0};
  let online = 0;
  entries.forEach(e => {
    if (byFaction[e.faction] !== undefined) byFaction[e.faction]++;
    if (e.online){ online++; if (onlineByFaction[e.faction] !== undefined) onlineByFaction[e.faction]++; }
  });
  entries.sort((a,b) => (b.online - a.online) || a.name.localeCompare(b.name));
  return { total: entries.length, online, byFaction, onlineByFaction, entries };
}

// Loads the room's world, creating it if this is the first person in the room.
// Extracted so ONBOARDING can call it too: faction assignment needs to read
// the season-level energy tallies, which live on the world — but the world
// used to be created only after onboarding finished, so the very first player
// in a fresh room hit "could not reach the game world" and could never join.
async function ensureWorldLoaded(){
  let w = await safeGet(worldKey(), true);
  // If this was just a transient read failure, wait and re-check before
  // concluding the world doesn't exist — otherwise we'd spin up a duplicate world.
  for (let i = 0; i < 3 && w === STORAGE_RETRY_LATER; i++){ await sleep(700); w = await safeGet(worldKey(), true); }
  if (!w || w === STORAGE_RETRY_LATER){
    const candidate = makeInitialWorld();
    const created = await mutateShared(worldKey(), (cur) => cur || candidate);
    if (!created.ok) return null;
    w = created.value || candidate;
  }
  world = w;
  return world;
}
async function enterWorld(){
  const loaded = await ensureWorldLoaded();
  if (!loaded){
    lastSyncError = { message: 'Could not reach the game world. Please retry.', retry: () => { lastSyncError = null; enterWorld(); } };
    bootPhase = 'ready'; render(); return;
  }
  if (profile && profile.seasonId && profile.seasonId !== world.seasonId){
    profile = null;
    await safeSet(profileKey(), null, false);
    bootPhase = 'onboarding';
    render();
    return;
  }
  await syncAll();
  await joinRoster(); // announce ourselves once so we show up for others right away
  bootPhase = 'ready';
  render();
  startLoops();
  startRealtime();
}

/* =========================================================
   REALTIME — push updates instead of frequent polling
   Supabase's free tier includes Postgres realtime (a websocket that tells us
   the instant any row in kv_store changes). This is what actually makes
   this version "more stable" than polling a shared store: other players'
   moves show up within a second or two, and we don't need to hammer the
   database every few seconds to find out what changed. The regular poll
   loop (scheduleNextPoll) is kept, just at a much slower cadence, purely as
   a safety net in case a realtime message is ever missed (e.g. a brief
   disconnect).
========================================================= */
let realtimeChannel = null;
function startRealtime(){
  if (!sbClient || realtimeChannel) return;
  realtimeChannel = sbClient
    .channel('kv-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'kv_store' }, handleRealtimeChange)
    .subscribe();
}
function handleRealtimeChange(payload){
  const row = payload.new && payload.new.key ? payload.new : payload.old;
  if (!row || !row.key || !world) return;
  const key = row.key;
  const value = payload.new ? payload.new.value : null;
  const roomPrefix = `room:${roomCode}:`;
  if (!key.startsWith(roomPrefix)) return; // ignore other rooms entirely
  if (key === worldKey()){
    if (!value) return;
    // A day/round rollover changes which per-day documents are current. If we
    // just swapped in the new world and re-rendered, the header would show the
    // new day while battlesDoc / activityDoc / mystate still held the PREVIOUS
    // day's data — a brief but real "new world + stale UI" state where the map
    // and the deploy screen disagree with the day counter. Re-sync those
    // documents before showing anything from the new day.
    const rolledOver = value.currentDay !== world.currentDay
      || value.round !== world.round
      || value.runId !== world.runId;
    world = value;
    if (rolledOver){
      dataStale = true;
      render();
      syncAll().then(() => { dataStale = false; render(); });
    } else {
      render();
    }
    return;
  }
  // Only react to keys relevant to the season we're currently in — ignore
  // everyone else's personal keys and any leftover data from old runIds.
  if (!key.startsWith(roomPrefix + world.runId + '-')) return;
  if (key === dayKey(world.runId, 'activity', world.currentDay)){
    if (value) { activityDoc = value; render(); }
  } else if (key === dayKey(world.runId, 'battles', world.currentDay)){
    if (value) { battlesDoc = value; render(); }
  } else if (key === `room:${roomCode}:${world.runId}-roster`){
    if (value) { roster = value; render(); }
  } else if (key.startsWith(dayKey(world.runId, 'settlement', ''))){
    // A new day just got settled somewhere else — re-sync everything (new
    // day's battles/activity docs, updated world) rather than trying to
    // patch every field by hand.
    syncAll().then(render);
  }
}

let cachedDocsForDay = null; // day number that battlesDoc/mystate were last loaded for
let settlementFetchedForDay = null; // reportDay we last fetched settlementDoc for
let progressLoaded = false;

async function syncAll(){
  const fresh = await safeGet(worldKey(), true);
  if (fresh && fresh !== STORAGE_RETRY_LATER) world = fresh;
  const day = world.currentDay;

  // battlesDoc and mystate only change when the day itself changes (both are
  // written once per day by this client's own actions or the settlement
  // flow), so there's no need to re-fetch them from storage on every poll —
  // that was a large, mostly-wasted share of our storage call volume.
  const dayChanged = cachedDocsForDay !== day;
  if (dayChanged || !battlesDoc) battlesDoc = await ensureBattlesDoc(day);
  if (dayChanged || !mystate) mystate = await ensureMyState(day);
  cachedDocsForDay = day;

  // activityDoc is the one thing other players actively write to throughout
  // the day, so it's the one worth polling every cycle.
  activityDoc = await ensureActivityDoc(day);

  const reportDay = roundIsOver() ? day : day - 1;
  if (reportDay >= 1 && (settlementFetchedForDay !== reportDay || !settlementDoc)){
    const fetchedSettlement = await safeGet(dayKey(world.runId, 'settlement', reportDay), true);
    if (fetchedSettlement !== STORAGE_RETRY_LATER){ settlementDoc = fetchedSettlement; settlementFetchedForDay = reportDay; }
  } else if (reportDay < 1){
    settlementDoc = null;
  }

  // progress is only ever written by this account, so we only need to load
  // it once per session; reconcileProgress() updates the in-memory copy and
  // persists changes itself, no need to re-GET it every poll.
  if (!progressLoaded){ progress = await ensureProgress(); seasonProgress = await ensureSeasonProgress(); progressLoaded = true; }

  await refreshRoster();
  await electCommanderIfNeeded();
  await autoFallbackRally(day);
  await reconcileProgress();
}

async function autoFallbackRally(day){
  if (world.rallyEnabled === false) return; // Rally turned off for this round
  if (world.phase !== 'fog') return;
  let changed = false;
  const pending = {};
  for (const f of FACTIONS){
    if (!activityDoc.rally[f]){
      const myBattles = battlesDoc.activeBattles.filter(t => effectiveEligibleFactions(t, world.ownership, battlesDoc.activeBattles, world.currentDay).includes(f));
      if (!myBattles.length) continue;
      const rng = rngFor('rally', day, f);
      const scored = myBattles.map(t => ({ t, score: vpValueOf(t, day)*2 + bountyMultiplier(getBountyLevel(world.holdDays[t]||0))*3 + rng() }));
      scored.sort((a,b)=>b.score-a.score);
      const main = scored[0].t; const secondary = scored[1] ? scored[1].t : null;
      pending[f] = { main, secondary, split: secondary ? [75,25] : [100,0], auto: true };
      changed = true;
    }
  }
  if (!changed) return;
  const res = await mutateShared(dayKey(world.runId, 'activity', day), (doc) => {
    const d = doc || { deployed:{}, rally:{cinder:null,surge:null,bloom:null} };
    let any = false;
    const rally = { ...d.rally };
    FACTIONS.forEach(f => { if (pending[f] && !rally[f]){ rally[f] = pending[f]; any = true; } });
    if (!any) return null;
    return { ...d, rally };
  });
  if (res.ok && res.value && !res.skipped) activityDoc = res.value;
}

async function reconcileProgress(){
  const doneUpTo = roundIsOver() ? world.currentDay : world.currentDay - 1;
  if (doneUpTo <= progress.lastCountedDay) return;
  let changed = false;
  for (let d = progress.lastCountedDay+1; d <= doneUpTo; d++){
    const m = await safeGet(dayKey(world.runId, 'mystate', d), false);
    if (m === STORAGE_RETRY_LATER){
      // Don't know yet whether day d counted — stop here rather than guessing.
      // Advancing lastCountedDay past an unconfirmed day would permanently
      // lose that day's participation credit if it turns out we WERE locked
      // in; leaving it unadvanced just means we retry this same day (and any
      // after it) on the next reconcile pass instead.
      break;
    }
    if (m && m.locked){
      progress.participationDays += 1;
      progress.seasonContributionPower = round2(progress.seasonContributionPower + Object.values(m.deployedPower||{}).reduce((a,b)=>a+b,0));
      changed = true;
    }
    progress.lastCountedDay = d;
    changed = true;
  }
  if (changed) await safeSet(roundProgressKey(), progress, false);
}

/* =========================================================
   MANUAL PHASE CONTROLS
   Battle resolution used to run on a real-time countdown, which meant every
   connected client's timer converged on the exact same deadline — the
   single biggest source of simultaneous storage writes, and the main
   trigger behind rate-limit errors under real multiplayer load. Now both
   entering Fog and resolving the day are explicit actions any player can
   take, so a write only happens when a person actually clicks something.
========================================================= */
async function enterFogManually(){
  if (!isRoomAdmin || inFlightFogToggle || !world || world.phase !== 'battles') return;
  inFlightFogToggle = true;
  try{
    const { data,error }=await sbClient.rpc('rk_enter_fog',{p_room:roomCode});
    if (error) throw error;
    if (data) world=data;
  } finally { inFlightFogToggle = false; render(); }
}
async function resolveDayManually(){
  if (!isRoomAdmin || inFlightResolve || !world) return;
  if (roundIsOver()) return;
  inFlightResolve = true;
  try{
    const {data:locked,error:lockError}=await sbClient.rpc('rk_begin_resolve',{p_room:roomCode});
    if (lockError) throw lockError;
    if (locked) world=locked;
    const fresh = await safeGet(worldKey(), true);
    if (fresh && fresh !== STORAGE_RETRY_LATER) world = fresh;
    if (roundIsOver()) return;
    await settleCurrentDay();
    // The round (or season) just ended — take the player straight to the
    // results screen instead of leaving them on Home, where the old banner
    // would keep inviting them to "RESOLVE DAY" again with no visible
    // change (that stale banner is what made it look like nothing happened).
    if (roundIsOver()) uiScreen = 'season';
  } catch(e){
    lastSyncError={message:'The day could not be resolved: '+((e&&e.message)||'Unknown error'),retry:()=>{lastSyncError=null;resolveDayManually();}};
  } finally { inFlightResolve = false; render(); }
}

async function settleCurrentDay(){
  const day = world.currentDay;
  const sKey = dayKey(world.runId, 'settlement', day);
  let sDoc = await safeGet(sKey, true);
  if (sDoc === STORAGE_RETRY_LATER) return; // Can't confirm whether this day was already settled — skip this cycle, try again next tick
  if (sDoc){ settlementDoc = sDoc; await advanceAfterExternalSettlement(); return; }

  let bDoc = await safeGet(dayKey(world.runId, 'battles', day), true);
  if (!bDoc || bDoc === STORAGE_RETRY_LATER) bDoc = battlesDoc;
  let aDoc = await safeGet(dayKey(world.runId, 'activity', day), true);
  if (!aDoc || aDoc === STORAGE_RETRY_LATER) aDoc = activityDoc;

  const results = []; const newOwnership = {...world.ownership}; const rallyResults = {};
  bDoc.activeBattles.forEach(t => {
    // Eligibility is recomputed here from ownership at settlement time, but
    // the deployment was made earlier against the eligibility shown on the
    // deploy screen. If those two disagree — which happens around the moment
    // a faction is eliminated or captures its first tile back — a faction
    // could have real, committed power on this tile and still be missing from
    // `eff`, so its power was silently dropped from the battle entirely.
    // That's how a Last Stand attack could never win: the power was recorded,
    // then ignored at settlement. Anyone who actually deployed here always
    // counts, regardless of what the eligibility check now says.
    const eff = new Set(effectiveEligibleFactions(t, world.ownership, bDoc.activeBattles, day));
    Object.keys((aDoc.deployed && aDoc.deployed[t]) || {}).forEach(f => {
      if (((aDoc.deployed[t][f]) || 0) > 0) eff.add(f);
    });
    const powerMap = {};
    eff.forEach(f => {
      const base = (bDoc.baseline[t] && bDoc.baseline[t][f]) || 0;
      const dep = (aDoc.deployed[t] && aDoc.deployed[t][f]) || 0;
      powerMap[f] = round2(base + dep);
    });
    const prevOwner = world.ownership[t];
    const { winner, tie } = resolveBattle(powerMap, prevOwner);
    const prevHold = world.holdDays[t] || 0;
    let bonusVP = 0;
    if (winner !== prevOwner && winner) bonusVP = bountyBonusVP(getBountyLevel(prevHold));
    results.push({ t, powerMap, prevOwner, winner, tie, bonusVP });
    newOwnership[t] = winner;
    FACTIONS.forEach(f => {
      const r = aDoc.rally[f];
      if (r && (r.main === t || r.secondary === t)){
        rallyResults[f] = rallyResults[f] || {};
        // Distinguish "captured it from someone else" vs "successfully held
        // territory that was already ours" vs "lost it" — these previously
        // all collapsed into a single captured:true/false flag, so
        // defending your own Rally target displayed as "CAPTURED" instead
        // of something like "HELD", which reads backwards.
        const outcome = winner !== f ? 'lost' : (prevOwner === f ? 'held' : 'captured');
        if (r.main === t) rallyResults[f].main = { t, outcome }; else rallyResults[f].secondary = { t, outcome };
      }
    });
  });

  const newHoldDays = {...world.holdDays};
  bDoc.activeBattles.forEach(t => {
    const r = results.find(x=>x.t===t);
    if (r.winner !== r.prevOwner && r.winner) newHoldDays[t] = 1;
    else if (r.winner === r.prevOwner && r.winner) newHoldDays[t] = (world.holdDays[t]||0) + 1;
    else newHoldDays[t] = 0;
  });
  TERRITORIES.forEach(t => { if (!bDoc.activeBattles.includes(t) && world.ownership[t]) newHoldDays[t] = (world.holdDays[t]||0) + 1; });

  const vpGained = calculateDailyVP(newOwnership, day);
  const newVp = {...world.vp};
  FACTIONS.forEach(f => newVp[f] = round2(newVp[f] + vpGained[f]));
  results.forEach(r => { if (r.bonusVP > 0 && r.winner) newVp[r.winner] = round2(newVp[r.winner] + r.bonusVP); });

  const rng = rngFor('economy', day);
  const spend = Math.round(800 + rng()*2600);
  const prizeAdd = Math.round(spend*CONFIG.gmtSplit.prize), burnAdd = Math.round(spend*CONFIG.gmtSplit.burn), protoAdd = Math.round(spend*CONFIG.gmtSplit.protocol);

  const newCommanderRecord = JSON.parse(JSON.stringify(world.commanderRecord));
  Object.entries(rallyResults).forEach(([f,rr]) => {
    if (rr.main){ if (rr.main.outcome !== 'lost') newCommanderRecord[f].wins++; else newCommanderRecord[f].losses++; }
  });

  sDoc = { results, vpGained, rallyResults, commanders: world.commanders, settledAt: Date.now(), ownershipAfter: newOwnership };

  const roundDone = day >= CONFIG.roundDays;
  const nextDay = roundDone ? day : day + 1;

  // Precompute next day's battles + the resulting repHistory here, and fold
  // repHistory into the SAME 'world' write below. This avoids a second
  // 'world' write immediately after this one (which is what was happening
  // right at the day rollover and made that moment the most write-heavy,
  // highest-contention point in the whole cycle).
  let nextBattlesDoc = null;
  let nextRepHistory = world.repHistory;
  if (!roundDone){
    nextBattlesDoc = generateBattlesDocPure(nextDay, newOwnership, newHoldDays, world.repHistory, world.npcPowerEnabled, world.runId);
    nextRepHistory = advanceRepHistory(world.repHistory, nextBattlesDoc.activeBattles);
  }

  // At round end, bank the round winner into the season-long scoreboard.
  let newRoundWins = world.roundWins;
  if (roundDone){
    const winnerFaction = rankFactions(newVp, newOwnership)[0].f;
    newRoundWins = { ...world.roundWins, [winnerFaction]: (world.roundWins[winnerFaction] || 0) + 1 };
  }
  const isLastRound = world.round >= CONFIG.roundsPerSeason;

  // Finalize through ONE database transaction.  The world, settlement report,
  // and next-day battles either all commit or none do.  A version conflict
  // means something legitimate (for example a donation) changed `world` while
  // we calculated; preserve that newer state, rebuild only the derived totals,
  // and retry instead of overwriting it.
  let finalized = false;
  for (let attempt=0; attempt<5; attempt++){
    const cur = await safeGetVersioned(worldKey(), true);
    if (cur === STORAGE_RETRY_LATER){ await sleep(250*(attempt+1)); continue; }
    if (!cur || !cur.value) throw new Error('The room world could not be read.');
    const base = cur.value;
    if (base.runId !== world.runId || base.currentDay !== day || base.phase !== 'resolving'){
      const official = await safeGet(sKey, true);
      if (official && official !== STORAGE_RETRY_LATER) settlementDoc = official;
      await advanceAfterExternalSettlement();
      return;
    }

    // Rebase additive fields on the freshest world so donations and other
    // legitimate concurrent changes cannot be rolled back by settlement.
    const rebasedVp = {...base.vp};
    FACTIONS.forEach(f => rebasedVp[f] = round2((rebasedVp[f]||0) + vpGained[f]));
    results.forEach(r => { if (r.bonusVP > 0 && r.winner) rebasedVp[r.winner] = round2(rebasedVp[r.winner] + r.bonusVP); });
    const rebasedCommanderRecord = JSON.parse(JSON.stringify(base.commanderRecord || newCommanderRecord));
    Object.entries(rallyResults).forEach(([f,rr]) => {
      if (!rebasedCommanderRecord[f]) rebasedCommanderRecord[f] = {wins:0,losses:0};
      if (rr.main){ if (rr.main.outcome !== 'lost') rebasedCommanderRecord[f].wins++; else rebasedCommanderRecord[f].losses++; }
    });
    const winnerFaction = roundDone ? rankFactions(rebasedVp, newOwnership)[0].f : null;
    const finalWorld = {
      ...base,
      ownership:newOwnership,
      holdDays:newHoldDays,
      vp:rebasedVp,
      repHistory:nextRepHistory,
      prizePool:(base.prizePool||0)+prizeAdd,
      gmtBurned:(base.gmtBurned||0)+burnAdd,
      protocolRevenue:(base.protocolRevenue||0)+protoAdd,
      commanderRecord:rebasedCommanderRecord,
      roundWins:roundDone ? {...base.roundWins,[winnerFaction]:(base.roundWins[winnerFaction]||0)+1} : base.roundWins,
      currentDay:nextDay,
      phase:roundDone ? (isLastRound ? 'seasonEnd' : 'roundEnd') : 'battles',
    };

    const {data,error}=await sbClient.rpc('rk_finalize_resolve',{
      p_room:roomCode,
      p_run_id:world.runId,
      p_day:day,
      p_expected_version:cur.version,
      p_world:finalWorld,
      p_settlement:sDoc,
      p_next_battles:nextBattlesDoc,
    });
    if (error) throw error;
    const row=Array.isArray(data)?data[0]:data;
    if (row && row.ok){
      world=row.out_world||finalWorld;
      if (row.already_settled){
        const official=await safeGet(sKey,true);
        if (official&&official!==STORAGE_RETRY_LATER) settlementDoc=official;
      } else settlementDoc=sDoc;
      finalized=true;
      break;
    }
    await sleep(100*(attempt+1)+Math.random()*100);
  }
  if (!finalized) throw new Error('Settlement encountered repeated concurrent changes. Please retry.');

  flashTiles = {}; results.forEach(r => { if (r.winner !== r.prevOwner) flashTiles[r.t] = true; });

  if (!roundDone){ await syncAll(); } else { computeRoundResult(); }
}

// Starts the next ROUND: fresh map, fresh VP, fresh prize pool, fresh
// commander election — but the same factions and the same season scoreboard.
async function startNextRound(){
  if (!isRoomAdmin) return;
  const next = freshRoundState(); // generated once so all clients don't each mint a different runId
  const res = await mutateShared(worldKey(), (w) => {
    if (!w || w.phase !== 'roundEnd') return null; // already advanced by someone else
    return { ...w, round: w.round + 1, ...next };
  });
  if (res.ok && res.value) world = res.value;
  const ok = res.ok;
  if (!ok){
    lastSyncError = { message: 'Could not start the next round. Please retry.', retry: () => { lastSyncError = null; startNextRound(); } };
    render(); return;
  }
  roundResult = null;
  progressLoaded = false; cachedDocsForDay = null; settlementFetchedForDay = null; settlementDoc = null;
  await syncAll();
  uiScreen = 'home';
  render();
}
async function advanceAfterExternalSettlement(){
  const fresh = await safeGet(worldKey(), true);
  if (fresh && fresh !== STORAGE_RETRY_LATER) world = fresh;
  await syncAll();
  if (world.phase === 'roundEnd' || world.phase === 'seasonEnd') computeRoundResult();
}

const RANK_TITLES = { 1: 'Champion', 2: 'Runner-Up', 3: 'Second Runner-Up' };
// Shared ranking used by both the live standings and round settlement, so the
// winner banked into roundWins can never disagree with what players saw.
// Tie rule: VP first; if still tied, the faction currently holding more
// territory ranks higher (reflects actual board control); if STILL tied
// (fully even VP and territory count), fall back to a fixed alphabetical
// order by faction id — deterministic and the same for every player, rather
// than silently depending on the order FACTIONS happens to be declared in.
function rankFactions(vp, ownership){
  const territoryCount = (f) => TERRITORIES.filter(t => ownership[t] === f).length;
  return FACTIONS
    .map(f => ({ f, vp: vp[f], territories: territoryCount(f) }))
    .sort((a,b) => (b.vp - a.vp) || (b.territories - a.territories) || a.f.localeCompare(b.f));
}
function computeRoundResult(){
  const standings = rankFactions(world.vp, world.ownership);
  const ranks = {}; standings.forEach((s,i)=>ranks[s.f]=i+1);
  const myRank = ranks[profile.faction];
  const share = CONFIG.rewardDistribution[myRank] || 0;
  const factionPool = Math.round(world.prizePool * share);
  const participationPool = Math.round(factionPool * CONFIG.poolSplit.participation);
  const contributionPool = factionPool - participationPool;
  const eligible = progress.participationDays >= CONFIG.participationThreshold;
  const estReward = eligible
    ? Math.round(participationPool/850 + contributionPool * (progress.seasonContributionPower / (progress.seasonContributionPower*300 + 40000)))
    : 0;
  const rankTitle = RANK_TITLES[myRank] || null;
  const isSeasonEnd = world.phase === 'seasonEnd';
  // Non-token rewards are awarded on the SEASON result (all 6 rounds), not
  // every week — a weekly badge would be worthless. Weekly rounds pay GMT.
  const seasonStandings = isSeasonEnd
    ? FACTIONS.map(f => ({ f, wins: world.roundWins[f] || 0 }))
        .sort((a,b) => (b.wins - a.wins) || a.f.localeCompare(b.f))
    : null;
  const seasonRank = seasonStandings ? (seasonStandings.findIndex(s => s.f === profile.faction) + 1) : null;
  const seasonRankTitle = seasonRank ? RANK_TITLES[seasonRank] : null;
  roundResult = {
    standings, myRank, factionPool, estReward, eligible, rankTitle,
    isSeasonEnd, seasonStandings, seasonRank,
